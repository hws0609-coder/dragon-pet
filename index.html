  useConsumable(key) {
    if (key === 'heal') {
      // 빙결 해제 체크
      if (this.saveData.frozen) {
        this.saveData.frozen = false;
        this.saveData.items.heal--;
        Save.save(this.saveData);
        this.showMsg('💊 물약으로 얼음이 녹았어요!');
        this.time.delayedCall(700, () => this.scene.start('MapScene', { saveData: this.saveData }));
        return;
      }
      // 동행 펫(없으면 첫 살아있는 펫) HP 회복
      let target = this.saveData.bag.find(p => p.isActive && p.alive) || this.saveData.bag.find(p => p.alive);
      if (!target) { this.showMsg('회복할 펫이 없어요!'); return; }
      if (target.hp >= target.maxHp) { this.showMsg(`${target.name}는 이미 풀피예요!`); return; }
      target.hp = Math.min(target.hp + 20, target.maxHp);
      this.saveData.items.heal--;
      if (typeof Sound !== 'undefined') Sound.play(this, 'coin', 0.4);
      Save.save(this.saveData);
      this.showMsg(`${target.name} HP +20! (${target.hp}/${target.maxHp})`);
      this.time.delayedCall(700, () => this.scene.restart({ saveData: this.saveData }));
    } else if (key === 'revive') {
      // 쓰러진 펫 중 첫 번째 부활
      const dead = this.saveData.bag.find(p => !p.alive);
      if (!dead) { this.showMsg('쓰러진 펫이 없어요!'); return; }
      dead.alive = true;
      dead.hp = dead.maxHp;
      this.saveData.items.revive--;
      if (typeof Sound !== 'undefined') Sound.play(this, 'get', 0.5);
      Save.save(this.saveData);
      this.showMsg(`${dead.name}가 살아났어요!`);
      this.time.delayedCall(700, () => this.scene.restart({ saveData: this.saveData }));
    } else if (key === 'rainbowFragment') {
      this.showMsg('무지개 조각 10개를 모으면 수정이 완성돼요!');
    } else if (key === 'rainbowCrystal') {
      this.showCrystalPetSelect();
    }
  }

  showCrystalPetSelect() {
    const { width, height } = this.scale;
    const pets = this.saveData.bag.filter(p => p.alive);
    const allObjs = [];
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.75).setDepth(40).setOrigin(0.5);
    const panel = this.add.rectangle(width/2, height/2, 370, 500, 0x1a0a3e).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2, 0xe879f9);
    const title = this.add.text(width/2, height/2 - 220, '🔮 무지개 수정 사용', { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#e879f9', fontStyle: 'bold' }).setDepth(42).setOrigin(0.5);
    const sub = this.add.text(width/2, height/2 - 195, '레벨업 시킬 펫을 선택하세요!', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#d8b4fe' }).setDepth(42).setOrigin(0.5);
    allObjs.push(overlay, panel, title, sub);

    if (pets.length === 0) {
      allObjs.push(this.add.text(width/2, height/2, '살아있는 펫이 없어요!', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fb923c' }).setDepth(42).setOrigin(0.5));
    } else {
      const itemObjs = [];
      const listTop = height/2 - 160, listBottom = height/2 + 195;
      const itemH = 40, visibleCount = Math.floor((listBottom - listTop) / itemH);
      let scrollOffset = 0;
      const maxScroll = Math.max(0, pets.length - visibleCount);

      const renderList = () => {
        itemObjs.forEach(o => o.destroy());
        itemObjs.length = 0;
        const visible = pets.slice(scrollOffset, scrollOffset + visibleCount);
        visible.forEach((pet, i) => {
          const by = listTop + i * itemH + itemH/2;
          const btn = this.add.rectangle(width/2, by, 320, 36, 0x3b0764).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
          btn.setStrokeStyle(1, 0xe879f9);
          const txt = this.add.text(width/2, by, `${pet.name} Lv.${pet.level}  HP ${pet.hp}/${pet.maxHp}`, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#f0abfc' }).setDepth(43).setOrigin(0.5);
          itemObjs.push(btn, txt);
          btn.on('pointerdown', () => {
            // 레벨업 적용
            const result = Utils.applyXp(pet, pet.xpToNext);
            this.saveData.items.rainbowCrystal--;
            Save.save(this.saveData);
            itemObjs.forEach(o => o.destroy());
            allObjs.forEach(o => o.destroy());
            this.showMsg(`🔮 ${pet.name}가 Lv.${pet.level}로 레벨업!`);
            this.time.delayedCall(700, () => this.scene.restart({ saveData: this.saveData }));
          });
        });
        if (maxScroll > 0) {
          const upBtn = this.add.text(width/2 + 168, listTop + 16, '▲', { fontSize: '20px', color: scrollOffset > 0 ? '#e879f9' : '#4b5563' }).setDepth(44).setOrigin(0.5).setInteractive({ useHandCursor: true });
          const dnBtn = this.add.text(width/2 + 168, listBottom - 16, '▼', { fontSize: '20px', color: scrollOffset < maxScroll ? '#e879f9' : '#4b5563' }).setDepth(44).setOrigin(0.5).setInteractive({ useHandCursor: true });
          upBtn.on('pointerdown', () => { if (scrollOffset > 0) { scrollOffset--; renderList(); } });
          dnBtn.on('pointerdown', () => { if (scrollOffset < maxScroll) { scrollOffset++; renderList(); } });
          itemObjs.push(upBtn, dnBtn);
        }
      };
      renderList();
    }

    const cBtn = this.add.rectangle(width/2, height/2 + 225, 150, 38, 0x374151).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width/2, height/2 + 225, '✕ 닫기', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setDepth(43).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown', () => allObjs.forEach(o => o.destroy()));
  }

  renderCosmeticCards(type, startY, objs) {
    const { width, height } = this.scale;
    const ownedIds=this.saveData.cosmetics.owned.filter(id=>{
      const c=PETS_DATA.cosmetics.find(x=>x.id===id);
      return c && c.type===type;
    });
    const label=type==='hat'?'모자':'신발';
    if(ownedIds.length===0){
      objs.push(this.add.text(width/2,height/2-40,`보유 ${label}이 없어요\n상점 꾸미기에서 구매해 보세요!`,
        {fontSize:'14px',fontFamily:'Malgun Gothic',color:'#6b7280',align:'center'}).setOrigin(0.5));
      return;
    }
    const cntT=this.add.text(width/2,startY+8,`${ownedIds.length} / 10개`,{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#a78bfa'}).setOrigin(0.5);
    objs.push(cntT);
    ownedIds.forEach((itemId,i)=>{
      const item=PETS_DATA.cosmetics.find(c=>c.id===itemId); if(!item) return;
      const equipped=this.saveData.cosmetics.equipped[item.type]===item.id;
      const col=i%4, row=Math.floor(i/4);
      const x=70+col*130, y=startY+30+row*72;
      const bg=this.add.rectangle(x,y,118,62,equipped?0x5b21b6:0x2d1b69).setOrigin(0.5).setInteractive({useHandCursor:true});
      bg.setStrokeStyle(2,equipped?0xe879f9:0x4c1d95);
      const eT=this.add.text(x-36,y,item.emoji,{fontSize:'22px'}).setOrigin(0.5);
      const nT=this.add.text(x+16,y-13,item.name,{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setOrigin(0.5);
      const sT=this.add.text(x+16,y+8,equipped?'✓ 착용중':'착용가능',{fontSize:'10px',fontFamily:'Malgun Gothic',color:equipped?'#e879f9':'#4ade80'}).setOrigin(0.5);
      objs.push(bg,eT,nT,sT);
      bg.on('pointerdown',()=>{
        this.saveData.cosmetics.equipped[item.type]=equipped?null:item.id;
        Save.save(this.saveData); this.scene.restart({saveData:this.saveData});
      });
    });
  }

  confirmRelease(pet) {
    const { width, height } = this.scale;
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.7).setOrigin(0.5).setDepth(50);
    const box = this.add.rectangle(width/2, height/2, 320, 220, 0x1a0a3e).setOrigin(0.5).setDepth(51);
    box.setStrokeStyle(2, 0xe11d48);
    const t1 = this.add.text(width/2, height/2 - 70, '정말 버릴까요?', { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#fb923c', fontStyle: 'bold' }).setOrigin(0.5).setDepth(52);
    const t2 = this.add.text(width/2, height/2 - 30, `${pet.name}  Lv.${pet.level}`, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#ffffff' }).setOrigin(0.5).setDepth(52);
    const t3 = this.add.text(width/2, height/2 + 5, '한 번 버리면 되돌릴 수 없어요!', { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setOrigin(0.5).setDepth(52);

    const yes = this.add.rectangle(width/2 - 70, height/2 + 60, 120, 44, 0xb91c1c).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
    const ty  = this.add.text(width/2 - 70, height/2 + 60, '버리기', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5).setDepth(53);
    const no  = this.add.rectangle(width/2 + 70, height/2 + 60, 120, 44, 0x374151).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
    const tn  = this.add.text(width/2 + 70, height/2 + 60, '취소', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5).setDepth(53);

    const closeAll = () => [overlay,box,t1,t2,t3,yes,ty,no,tn].forEach(o=>o.destroy());

    yes.on('pointerdown', () => {
      closeAll();
      this.saveData.bag = this.saveData.bag.filter(p => p !== pet);
      // 가방 꽉 찼던 경우 새 펫 추가
      if (this.releaseMode && this.newPet) {
        this.saveData.bag.push(this.newPet);
        if (!this.saveData.collection.includes(this.newPet.id)) this.saveData.collection.push(this.newPet.id);
        Save.save(this.saveData);
        this.scene.start('ResultScene', { saveData: this.saveData, result: { type: 'pet', pet: this.newPet } });
      } else {
        Save.save(this.saveData);
        this.scene.restart({ saveData: this.saveData, releaseMode: false });
      }
    });
    no.on('pointerdown', () => closeAll());
  }

  showMsg(msg) {
    const { width, height } = this.scale;
    const t = this.add.text(width/2, height/2, msg, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fb923c', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(60);
    this.time.delayedCall(1500, () => t.destroy());
  }
}

// ── 씬: 도감 ─────────────────────────────────────────────────────────────────
class CollectionScene extends Phaser.Scene {
  constructor() { super('CollectionScene'); }

  init(data) { this.saveData = data.saveData || Save.load(); }

  preload() { Utils.queuePetImages(this); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);
    // 현재 가방 펫들의 최고 레벨 보정 (기존 세이브 호환)
    if (!this.saveData.maxLevels) this.saveData.maxLevels = {};
    (this.saveData.bag || []).forEach(p => {
      if (!this.saveData.maxLevels[p.id] || p.level > this.saveData.maxLevels[p.id]) {
        this.saveData.maxLevels[p.id] = p.level;
      }
    });
    this.add.text(width / 2, 36, `도감  ${this.saveData.collection.length}/${PETS_DATA.pets.length}마리`, { fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);

    PETS_DATA.pets.forEach((pet, i) => {
      const col = i % 4, row = Math.floor(i / 4);
      const x = 60 + col * 110, y = 100 + row * 110;
      const owned = this.saveData.collection.includes(pet.id);
      const gradeColor = { legend: 0x92400e, rare: 0x1e3a5f, normal: 0x1f2937 };
      const bg = this.add.rectangle(x, y, 95, 90, gradeColor[pet.grade] || 0x1f2937).setOrigin(0.5);
      const borderColor = { legend: 0xfbbf24, rare: 0x60a5fa, normal: 0x4b5563 };
      bg.setStrokeStyle(2, owned ? borderColor[pet.grade] : 0x374151);
      // 도감 썸네일: 획득 시 lv1 이미지, 미획득 시 ❓
      const texKey = `petimg-${pet.id}-lv1`;
      if (owned && this.textures.exists(texKey)) {
        const img = this.add.image(x, y - 18, texKey);
        const src = this.textures.get(texKey).getSourceImage();
        img.setScale(50 / src.height);
      } else {
        this.add.text(x, y - 18, owned ? '🐾' : '❓', { fontSize: owned ? '28px' : '24px' }).setOrigin(0.5).setAlpha(owned ? 1 : 0.4);
      }
      this.add.text(x, y + 18, owned ? (pet.name.length > 5 ? pet.name.slice(0,5)+'.' : pet.name) : '???', {
        fontSize: '11px', fontFamily: 'Malgun Gothic', color: owned ? '#e9d5ff' : '#4b5563',
      }).setOrigin(0.5);
      // 획득한 펫은 클릭 시 레벨별 팝업
      if (owned) {
        bg.setInteractive({ useHandCursor: true });
        bg.on('pointerdown', () => this.showPetLevels(pet));
      }
    });

    const backBtn = this.add.rectangle(width / 2 - 65, height - 36, 120, 44, 0x4c1d95).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width / 2 - 65, height - 36, '← 돌아가기', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => this.scene.start('TitleScene'));

    const typeBtn = this.add.rectangle(width / 2 + 65, height - 36, 120, 44, 0x0f6e56).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width / 2 + 65, height - 36, '속성 도감 ⚡', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    typeBtn.on('pointerdown', () => this.scene.start('TypeChartScene', { saveData: this.saveData }));
  }

  showPetLevels(pet) {
    const { width, height } = this.scale;
    // 도달한 최고 진화 단계 (1~5). 기록 없으면 최소 1
    const maxLv = (this.saveData.maxLevels && this.saveData.maxLevels[pet.id]) || 1;
    const maxStage = Utils.evoStage(maxLv);

    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.85).setDepth(50).setOrigin(0.5).setInteractive();
    const panel = this.add.rectangle(width/2, height/2, 420, 560, 0x1a0a3e).setDepth(51).setOrigin(0.5);
    const gradeBorder = { legend: 0xfbbf24, rare: 0x60a5fa, normal: 0xa855f7 };
    panel.setStrokeStyle(3, gradeBorder[pet.grade] || 0xa855f7);
    const allObjs = [overlay, panel];

    const gradeLabel = { legend: '⭐⭐⭐ 전설', rare: '⭐⭐ 희귀', normal: '⭐ 일반' };
    const gradeColor = { legend: '#fbbf24', rare: '#60a5fa', normal: '#d1d5db' };
    allObjs.push(this.add.text(width/2, height/2-250, pet.name, { fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#fff', fontStyle: 'bold' }).setDepth(52).setOrigin(0.5));
    allObjs.push(this.add.text(width/2, height/2-222, `[${pet.type}]  ${gradeLabel[pet.grade]}`, { fontSize: '13px', fontFamily: 'Malgun Gothic', color: gradeColor[pet.grade] }).setDepth(52).setOrigin(0.5));
    allObjs.push(this.add.text(width/2, height/2-200, `최고 도달 Lv.${maxLv}  (${maxStage}단계까지 공개)`, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setDepth(52).setOrigin(0.5));

    // 메인 큰 이미지 (현재 선택 단계)
    let curStage = maxStage;
    const mainImg = this.add.image(width/2, height/2-70, '').setDepth(52);
    const stageLabel = this.add.text(width/2, height/2+40, '', { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fde047', fontStyle: 'bold' }).setDepth(52).setOrigin(0.5);
    allObjs.push(mainImg, stageLabel);

    const showStage = (stage) => {
      const key = `petimg-${pet.id}-lv${stage}`;
      if (this.textures.exists(key)) {
        mainImg.setTexture(key);
        const src = this.textures.get(key).getSourceImage();
        mainImg.setScale(190 / src.height);
        mainImg.setVisible(true);
      } else {
        mainImg.setVisible(false);
      }
      stageLabel.setText(stage >= 5 ? 'Lv.5 (최종 진화)' : `Lv.${stage} 단계`);
    };
    showStage(curStage);

    // 하단 단계 선택 썸네일 (1 ~ maxStage)
    const thumbY = height/2 + 100;
    const totalW = maxStage * 64;
    const startX = width/2 - totalW/2 + 32;
    const thumbBgs = [];
    for (let s = 1; s <= maxStage; s++) {
      const tx = startX + (s-1) * 64;
      const tBg = this.add.rectangle(tx, thumbY, 56, 56, s === curStage ? 0x5b21b6 : 0x2d1b69).setDepth(52).setOrigin(0.5).setInteractive({ useHandCursor: true });
      tBg.setStrokeStyle(2, s === curStage ? 0xe879f9 : 0x4c1d95);
      tBg._stage = s;
      thumbBgs.push(tBg);
      const tKey = `petimg-${pet.id}-lv${s}`;
      if (this.textures.exists(tKey)) {
        const ti = this.add.image(tx, thumbY-4, tKey).setDepth(53);
        ti.setScale(40 / this.textures.get(tKey).getSourceImage().height);
        allObjs.push(ti);
      }
      const tLabel = this.add.text(tx, thumbY+22, `${s}`, { fontSize: '10px', fontFamily: 'Malgun Gothic', color: '#c4b5fd' }).setDepth(53).setOrigin(0.5);
      allObjs.push(tBg, tLabel);
      tBg.on('pointerdown', () => {
        curStage = s;
        showStage(s);
        thumbBgs.forEach(b => {
          const active = (b._stage === curStage);
          b.setFillStyle(active ? 0x5b21b6 : 0x2d1b69);
          b.setStrokeStyle(2, active ? 0xe879f9 : 0x4c1d95);
        });
      });
    }

    // 닫기
    const cBtn = this.add.rectangle(width/2, height/2+200, 160, 44, 0x4c1d95).setDepth(52).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width/2, height/2+200, '✕ 닫기', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fff' }).setDepth(53).setOrigin(0.5);
    allObjs.push(cBtn);
    const closeAll = () => allObjs.forEach(o => o.destroy());
    cBtn.on('pointerdown', closeAll);
    overlay.on('pointerdown', closeAll);
  }
}

// ── 씬: 속성 도감 ─────────────────────────────────────────────────────────────
class TypeChartScene extends Phaser.Scene {

    this.add.text(width / 2, 56, '내 속성이 상대에게 강하면 데미지 1.5배!', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);

    const typeChart = PETS_DATA.typeChart;

      '불꽃':'#f97316','물':'#3b82f6','풀':'#22c55e','전기':'#eab308',

      '에스퍼':'#d8b4fe','페어리':'#f9a8d4','빛':'#fde047','노말':'#9ca3af'

    const typeEmoji = {
      '불꽃':'🔥','물':'💧','풀':'🌿','전기':'⚡','얼음':'❄️','땅':'🏔️',
      '바람':'🌪️','어둠':'🌑','에스퍼':'🔮','페어리':'🧚','빛':'✨','노말':'⭐'
    };

    const types = Object.keys(typeChart);
    let y = 90;
    types.forEach((type) => {

      this.add.text(140, y, '▶', { fontSize: '12px', color: '#4ade80' }).setOrigin(0.5);

      // 강한 상대들

        this.add.text(165, y, '상성 없음', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#6b7280' }).setOrigin(0, 0.5);
      } else {
        const text = strong.map(t => `${typeEmoji[t]||''}${t}`).join('  ');
        this.add.text(160, y, text, { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#4ade80' }).setOrigin(0, 0.5);
      }
      y += 36;
    });

    // 전설 안내
    this.add.text(width / 2, y + 8, '👑 전설 펫은 모든 속성 상성에 면역!', {
      fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#fbbf24', fontStyle: 'bold',
    }).setOrigin(0.5);

    const backBtn = this.add.rectangle(width / 2, height - 36, 200, 44, 0x4c1d95).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width / 2, height - 36, '← 도감으로', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => this.scene.start('CollectionScene', { saveData: this.saveData }));
  }
}

// ── 씬: 상점 ─────────────────────────────────────────────────────────────────
class ShopScene extends Phaser.Scene {
  constructor() { super('ShopScene'); }

  init(data) { this.saveData = data.saveData || Save.load(); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x2a1f0f).setOrigin(0);
    this.add.text(width/2, 28, '🏪 상점', {fontSize:'22px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setOrigin(0.5);
    this.add.text(width/2, 52, `보유 코인: 🪙 ${this.saveData.coins}`, {fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fde047',fontStyle:'bold'}).setOrigin(0.5);

    const btns=[
      {label:'💰 펫 팔기',      sub:'필요없는 펫을 코인으로',      color:0x713f12,border:0xfbbf24,fn:()=>this.showSellMenu()},
      {label:'💊 아이템 팔기',  sub:'체력회복·소환 아이템 판매',   color:0x14532d,border:0x4ade80,fn:()=>this.showConsumableSellMenu()},
      {label:'🎩 모자 팔기',    sub:'구매가의 50%에 팔아요',        color:0x312e81,border:0xa855f7,fn:()=>this.showCosmeticSellMenu('hat')},
      {label:'👟 신발 팔기',    sub:'구매가의 50%에 팔아요',        color:0x1e3a5f,border:0x60a5fa,fn:()=>this.showCosmeticSellMenu('shoes')},
      {label:'✨ 캐릭터 꾸미기',sub:'코인으로 모자와 신발을 사요', color:0x4c1d95,border:0xa855f7,fn:()=>this.scene.start('CosmeticScene',{saveData:this.saveData})},
    ];
    btns.forEach((b,i)=>{
      const y=110+i*70;
      const bg=this.add.rectangle(width/2,y,320,58,b.color).setOrigin(0.5).setInteractive({useHandCursor:true});
      bg.setStrokeStyle(2,b.border);
      this.add.text(width/2,y-12,b.label,{fontSize:'17px',fontFamily:'Malgun Gothic',color:'#fff',fontStyle:'bold'}).setOrigin(0.5);
      this.add.text(width/2,y+12,b.sub,{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#ddd6fe'}).setOrigin(0.5);
      bg.on('pointerdown',b.fn);
      bg.on('pointerover',()=>bg.setAlpha(0.8)); bg.on('pointerout',()=>bg.setAlpha(1));
    });

    this.add.text(width/2,480,'펫 판매 가격',{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setOrigin(0.5);
    const prices=PETS_DATA.sellPrices; let py=502;
    [1,2,3,4,5].forEach(lv=>{
      this.add.text(width/2,py,`Lv.${lv} → 🪙 ${prices[String(lv)]} 코인`,{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#fde68a'}).setOrigin(0.5);
      py+=22;
    });

    const backBtn=this.add.rectangle(width/2,height-36,200,44,0x4c1d95).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height-36,'← 모험으로',{fontSize:'16px',fontFamily:'Malgun Gothic',color:'#fff'}).setOrigin(0.5);
    backBtn.on('pointerdown',()=>{ Save.save(this.saveData); this.scene.start('MapScene',{saveData:this.saveData}); });
  }

  showSellMenu() {
    const { width, height } = this.scale;
    const sellable = this.saveData.bag.filter(p => !p.isActive);
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.75).setDepth(40).setOrigin(0.5);
    const panel=this.add.rectangle(width/2,height/2,370,500,0x2a1f0f).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2,0xfbbf24);
    const title=this.add.text(width/2,height/2-220,'💰 펫 팔기',{fontSize:'20px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setDepth(42).setOrigin(0.5);
    const sub=this.add.text(width/2,height/2-195,'팔 펫을 선택하세요 (동행 펫 제외)',{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#fde68a'}).setDepth(42).setOrigin(0.5);
    const allObjs=[overlay,panel,title,sub];
    const itemObjs = [];
    if(sellable.length===0){
      allObjs.push(this.add.text(width/2,height/2,'팔 수 있는 펫이 없어요!',{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fb923c'}).setDepth(42).setOrigin(0.5));
     } else {
      // 스크롤 영역 설정
      const listTop = height/2 - 160;
      const listBottom = height/2 + 195;
      const listHeight = listBottom - listTop;
      const itemH = 40;
      const visibleCount = Math.floor(listHeight / itemH);
      let scrollOffset = 0;
      const totalItems = sellable.length;
      const maxScroll = Math.max(0, totalItems - visibleCount);

      if(totalItems > visibleCount) {
        const scrollHint = this.add.text(width/2+160, listTop-14, `총 ${totalItems}마리 ▲▼`, {fontSize:'11px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setDepth(42).setOrigin(0.5);
        allObjs.push(scrollHint);
      }

      const renderList = () => {
        itemObjs.forEach(o=>o.destroy());
        itemObjs.length = 0;
        const visible = sellable.slice(scrollOffset, scrollOffset + visibleCount);
        visible.forEach((pet, i) => {
          const by = listTop + i * itemH + itemH/2;
          const price = PETS_DATA.sellPrices[String(Math.min(pet.level,5))];
          const btn = this.add.rectangle(width/2, by, 320, 36, 0x713f12).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
          btn.setStrokeStyle(1, 0xca8a04);
          const txt = this.add.text(width/2, by, `${pet.name} Lv.${pet.level}  ATK ${pet.atk}  →  🪙 ${price}`, {fontSize:'12px',fontFamily:'Malgun Gothic',color:'#fde68a'}).setDepth(43).setOrigin(0.5);
          itemObjs.push(btn, txt);
          btn.on('pointerdown', () => {
            this.saveData.coins += price;
            this.saveData.bag = this.saveData.bag.filter(p => p !== pet);
            Save.save(this.saveData);
            allObjs.forEach(o=>o.destroy());
            itemObjs.forEach(o=>o.destroy());
            this.scene.restart({saveData: this.saveData});
          });
        });
        if(maxScroll > 0) {
          const upBtn = this.add.text(width/2+168, listTop+16, '▲', {fontSize:'20px',color: scrollOffset>0?'#fbbf24':'#4b5563'}).setDepth(44).setOrigin(0.5).setInteractive({useHandCursor:true});
          const dnBtn = this.add.text(width/2+168, listBottom-16, '▼', {fontSize:'20px',color: scrollOffset<maxScroll?'#fbbf24':'#4b5563'}).setDepth(44).setOrigin(0.5).setInteractive({useHandCursor:true});
          const cntT = this.add.text(width/2+168, (listTop+listBottom)/2, `${scrollOffset+1}-${Math.min(scrollOffset+visibleCount,totalItems)}\n/${totalItems}`, {fontSize:'10px',fontFamily:'Malgun Gothic',color:'#fbbf24',align:'center'}).setDepth(44).setOrigin(0.5);
          upBtn.on('pointerdown', ()=>{ if(scrollOffset>0){scrollOffset--;renderList();} });
          dnBtn.on('pointerdown', ()=>{ if(scrollOffset<maxScroll){scrollOffset++;renderList();} });
          itemObjs.push(upBtn, dnBtn, cntT);
        }
      };
      renderList();
    }
    const cBtn=this.add.rectangle(width/2,height/2+225,150,38,0x374151).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height/2+225,'✕ 닫기',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(43).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>{ itemObjs.forEach(o=>o.destroy()); allObjs.forEach(o=>o.destroy()); });
  }

  showConsumableSellMenu() {
    const { width, height } = this.scale;
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.75).setDepth(40).setOrigin(0.5);
    const panel=this.add.rectangle(width/2,height/2,400,360,0x0f2a1f).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2,0x4ade80);
    const title=this.add.text(width/2,height/2-150,'💊 아이템 팔기',{fontSize:'20px',fontFamily:'Malgun Gothic',color:'#4ade80'}).setDepth(42).setOrigin(0.5);
    const sub=this.add.text(width/2,height/2-126,'− ＋ 로 개수를 정하고 판매하세요',{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#86efac'}).setDepth(42).setOrigin(0.5);
    const allObjs=[overlay,panel,title,sub];
    const defs=[
      {key:'heal',   emoji:'💊',name:'체력 회복',price:PETS_DATA.items.heal.sellPrice||5},
      {key:'revive', emoji:'⭐',name:'소환 아이템',price:PETS_DATA.items.revive.sellPrice||15},
    ];
    // 판매 개수 상태
    this.sellQty = { heal: 0, revive: 0 };

    defs.forEach((def,i)=>{
      const count=this.saveData.items[def.key];
      const y=height/2-80+i*90;
      const bg=this.add.rectangle(width/2,y,350,78,count>0?0x14532d:0x1f2937).setDepth(42).setOrigin(0.5);
      bg.setStrokeStyle(1,count>0?0x4ade80:0x374151);
      const nameT=this.add.text(width/2-150,y-22,`${def.emoji} ${def.name}`,{fontSize:'13px',fontFamily:'Malgun Gothic',color:count>0?'#e9d5ff':'#6b7280'}).setDepth(43).setOrigin(0,0.5);
      const haveT=this.add.text(width/2-150,y-2,`보유 ${count}개 · 개당 🪙${def.price}`,{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#86efac'}).setDepth(43).setOrigin(0,0.5);
      allObjs.push(bg,nameT,haveT);

      if(count>0){
        // − 버튼
        const minusBg=this.add.rectangle(width/2-110,y+22,32,30,0x374151).setDepth(43).setOrigin(0.5).setInteractive({useHandCursor:true});
        const minusT=this.add.text(width/2-110,y+22,'−',{fontSize:'20px',color:'#fff'}).setDepth(44).setOrigin(0.5);
        // 수량 표시
        const qtyT=this.add.text(width/2-60,y+22,'0',{fontSize:'18px',fontFamily:'Malgun Gothic',color:'#fde047',fontStyle:'bold'}).setDepth(44).setOrigin(0.5);
        // ＋ 버튼
        const plusBg=this.add.rectangle(width/2-10,y+22,32,30,0x374151).setDepth(43).setOrigin(0.5).setInteractive({useHandCursor:true});
        const plusT=this.add.text(width/2-10,y+22,'＋',{fontSize:'18px',color:'#fff'}).setDepth(44).setOrigin(0.5);
        // 판매 버튼
        const sellBg=this.add.rectangle(width/2+95,y+22,110,32,0x16a34a).setDepth(43).setOrigin(0.5).setInteractive({useHandCursor:true});
        const sellT=this.add.text(width/2+95,y+22,'판매 🪙0',{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#fff'}).setDepth(44).setOrigin(0.5);
        allObjs.push(minusBg,minusT,qtyT,plusBg,plusT,sellBg,sellT);

        const refresh=()=>{
          qtyT.setText(String(this.sellQty[def.key]));
          sellT.setText(`판매 🪙${this.sellQty[def.key]*def.price}`);
          sellBg.setFillStyle(this.sellQty[def.key]>0?0x16a34a:0x374151);
        };
        minusBg.on('pointerdown',()=>{ if(this.sellQty[def.key]>0){this.sellQty[def.key]--;refresh();} });
        plusBg.on('pointerdown',()=>{ if(this.sellQty[def.key]<count){this.sellQty[def.key]++;refresh();} });
        sellBg.on('pointerdown',()=>{
          const qty=this.sellQty[def.key];
          if(qty<=0){ this.showMsg('개수를 선택하세요!'); return; }
          this.saveData.coins+=def.price*qty;
          this.saveData.items[def.key]-=qty;
          if(typeof Sound!=='undefined') Sound.play(this,'coin',0.5);
          Save.save(this.saveData);
          allObjs.forEach(o=>o.destroy());
          this.scene.restart({saveData:this.saveData});
        });
      }
    });
    const cBtn=this.add.rectangle(width/2,height/2+150,150,38,0x374151).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height/2+150,'✕ 닫기',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(43).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>allObjs.forEach(o=>o.destroy()));
  }

  showCosmeticSellMenu(type) {
    const { width, height } = this.scale;
    const ownedIds=this.saveData.cosmetics.owned.filter(id=>{ const c=PETS_DATA.cosmetics.find(x=>x.id===id); return c&&c.type===type; });
    const label=type==='hat'?'🎩 모자':'👟 신발';
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.75).setDepth(40).setOrigin(0.5);
    const panel=this.add.rectangle(width/2,height/2,400,520,0x0f1a2e).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2,0x60a5fa);
    const title=this.add.text(width/2,height/2-235,`${label} 팔기`,{fontSize:'20px',fontFamily:'Malgun Gothic',color:'#60a5fa'}).setDepth(42).setOrigin(0.5);
    const sub=this.add.text(width/2,height/2-210,'구매가의 50%에 팔립니다',{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#93c5fd'}).setDepth(42).setOrigin(0.5);
    const allObjs=[overlay,panel,title,sub];
    if(ownedIds.length===0){
      allObjs.push(this.add.text(width/2,height/2,`판매할 ${label.slice(3)}이 없어요!`,{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fb923c'}).setDepth(42).setOrigin(0.5));
    } else {
      ownedIds.slice(0,10).forEach((itemId,i)=>{
        const item=PETS_DATA.cosmetics.find(c=>c.id===itemId); if(!item) return;
        const sp=Math.floor(item.price/2);
        const by=height/2-170+i*40;
        const btn=this.add.rectangle(width/2,by,340,36,0x1e3a5f).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
        btn.setStrokeStyle(1,0x60a5fa);
        allObjs.push(btn, this.add.text(width/2,by,`${item.emoji} ${item.name}  →  🪙 ${sp}`,{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#93c5fd'}).setDepth(43).setOrigin(0.5));
        btn.on('pointerdown',()=>{ this.saveData.coins+=sp; this.saveData.cosmetics.owned=this.saveData.cosmetics.owned.filter(id=>id!==itemId); if(this.saveData.cosmetics.equipped[item.type]===itemId) this.saveData.cosmetics.equipped[item.type]=null; Save.save(this.saveData); allObjs.forEach(o=>o.destroy()); this.scene.restart({saveData:this.saveData}); });
      });
    }
    const cBtn=this.add.rectangle(width/2,height/2+232,150,38,0x374151).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height/2+232,'✕ 닫기',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(43).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>allObjs.forEach(o=>o.destroy()));
  }

  showMsg(msg) {
    const { width, height } = this.scale;
    const t = this.add.text(width/2, height/2-30, msg, { fontSize:'16px', fontFamily:'Malgun Gothic', color:'#fb923c', stroke:'#000', strokeThickness:3 }).setOrigin(0.5).setDepth(60);
    this.time.delayedCall(1200, () => t.destroy());
  }
}

// ── 씬: 캐릭터 꾸미기 ─────────────────────────────────────────────────────────
class CosmeticScene extends Phaser.Scene {
  constructor() { super('CosmeticScene'); }

  init(data) { this.saveData = data.saveData || Save.load(); }

  preload() {
    // MapScene에서 이미 로드됐으면 자동 skip
    if (!this.textures.exists('base-boy'))  this.load.image('base-boy',  'assets/characters/base-boy.png');
    if (!this.textures.exists('base-girl')) this.load.image('base-girl', 'assets/characters/base-girl.png');
    for (let n = 1; n <= 5; n++) {
      if (!this.textures.exists(`hat-${n}`)) this.load.image(`hat-${n}`, `assets/characters/hat-${n}.png`);
    }
  }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);
    this.add.text(width / 2, 26, '✨ 캐릭터 꾸미기', { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);
    this.coinText = this.add.text(width / 2, 50, `🪙 ${this.saveData.coins} 코인`, { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fde047' }).setOrigin(0.5);

    // 캐릭터 미리보기
    this.drawPreview(width / 2, 100);

    // 탭 버튼 (모자 / 신발) — 미리보기 아래로 내림
    this.currentTab = 'hat';
    const tabY = 185;
    const tabHat  = this.add.rectangle(width/2 - 75, tabY, 130, 36, 0x5b21b6).setOrigin(0.5).setInteractive({ useHandCursor: true });
    tabHat.setStrokeStyle(2, 0xe879f9);
    const tabHatTxt  = this.add.text(width/2 - 75, tabY, '🎩 모자', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    const tabShoe = this.add.rectangle(width/2 + 75, tabY, 130, 36, 0x1e1145).setOrigin(0.5).setInteractive({ useHandCursor: true });
    tabShoe.setStrokeStyle(2, 0x4c1d95);
    const tabShoeTxt = this.add.text(width/2 + 75, tabY, '👟 신발', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);

    // 아이템 목록 (탭별 표시)
    const allItems = PETS_DATA.cosmetics;
    this.itemObjs = [];

    const renderItems = (tab) => {
      this.itemObjs.forEach(o => o.destroy());
      this.itemObjs = [];
      const filtered = allItems.filter(c => c.type === tab);
      const startY = 235;
      filtered.forEach((item, i) => {
        const col = i % 4, row = Math.floor(i / 4);
        const x = 78 + col * 138, y = startY + row * 72;
        this.drawItemCard(x, y, item, this.itemObjs);
      });
      // 탭 강조
      tabHat.setFillStyle(tab === 'hat'  ? 0x5b21b6 : 0x1e1145);
      tabHat.setStrokeStyle(2, tab === 'hat'  ? 0xe879f9 : 0x4c1d95);
      tabHatTxt.setColor(tab === 'hat'  ? '#fff' : '#a78bfa');
      tabShoe.setFillStyle(tab === 'shoes' ? 0x5b21b6 : 0x1e1145);
      tabShoe.setStrokeStyle(2, tab === 'shoes' ? 0xe879f9 : 0x4c1d95);
      tabShoeTxt.setColor(tab === 'shoes' ? '#fff' : '#a78bfa');
    };

    renderItems('hat');

    tabHat.on('pointerdown',  () => { this.currentTab = 'hat';   renderItems('hat'); });
    tabShoe.on('pointerdown', () => { this.currentTab = 'shoes'; renderItems('shoes'); });

    const backBtn = this.add.rectangle(width / 2, height - 32, 200, 42, 0x4c1d95).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width / 2, height - 32, '← 상점으로', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => { Save.save(this.saveData); this.scene.start('ShopScene', { saveData: this.saveData }); });
  }

  drawPreview(x, y) {
    if (this.preview) this.preview.destroy();
    this.preview = this.add.container(x, y);
    const isFemale = this.saveData.character === 'f';
    const equip = this.saveData.cosmetics.equipped;
    const charImgKey = isFemale ? 'base-girl' : 'base-boy';
    const hasCharImg = this.textures.exists(charImgKey);

    // 그림자: 이미지 모드 y=63 (높이117/2+5), 도형 모드 y=34
    const shadow = this.add.ellipse(0, hasCharImg ? 63 : 34, 44, 14, 0x000000, 0.3);
    this.preview.add(shadow);

    if (hasCharImg) {
      // ── 신발/탈것: 캐릭터 이미지보다 먼저 추가 → 발 아래에 보임 ──
      if (equip.shoes) {
        const shoeItem = PETS_DATA.cosmetics.find(c => c.id === equip.shoes);
        if (shoeItem) {
          const shoeEmoji = this.add.text(0, 65, shoeItem.emoji, { fontSize: '32px' }).setOrigin(0.5);
          this.preview.add(shoeEmoji);
        }
      }
      // ── 이미지 미리보기 ────────────────────────────────────────
      const charImg = this.add.image(0, 0, charImgKey);
      charImg.setDisplaySize(60, 98);  // 탭과 겹치지 않게 약간 축소
      charImg.setOrigin(0.5, 0.5);
      this.preview.add(charImg);
      // 모자: 이미지 있으면 이미지, 없으면 이모지
      if (equip.hat) {
        const hatItem = PETS_DATA.cosmetics.find(c => c.id === equip.hat);
        if (hatItem) {
          if (hatItem.img && this.textures.exists(hatItem.img)) {
            const hat = this.add.image(0, -20, hatItem.img);
            hat.setDisplaySize(46, 31);
            hat.setOrigin(0.5, 1);
            this.preview.add(hat);
          } else {
            const hat = this.add.text(0, -67, hatItem.emoji, { fontSize: '28px' }).setOrigin(0.5);
            this.preview.add(hat);
          }
        }
      }
    } else {
      // ── 도형 미리보기 (이미지 없을 때 자동 fallback) ─────────────
      if (equip.shoes) {
        const shoeItem = PETS_DATA.cosmetics.find(c => c.id === equip.shoes);
        if (shoeItem) {
          const shoeEmoji = this.add.text(0, 42, shoeItem.emoji, { fontSize: '26px' }).setOrigin(0.5);
          this.preview.add(shoeEmoji);
        }
      }
      const body = this.add.rectangle(0, 8, 30, 36, 0x60a5fa);
      const head = this.add.circle(0, -22, 18, isFemale ? 0xfcd34d : 0xfbbf24);
      const eyeL = this.add.circle(-6, -22, 3, 0x1a1a2e);
      const eyeR = this.add.circle(6, -22, 3, 0x1a1a2e);
      this.preview.add([body, head, eyeL, eyeR]);
      if (equip.hat) {
        const hatItem = PETS_DATA.cosmetics.find(c => c.id === equip.hat);
        if (hatItem) {
          const hat = this.add.text(0, -44, hatItem.emoji, { fontSize: '28px' }).setOrigin(0.5);
          this.preview.add(hat);
        }
      }
    }
  }

  drawItemCard(x, y, item, objs = []) {
    const owned = this.saveData.cosmetics.owned.includes(item.id);
    const equipped = this.saveData.cosmetics.equipped[item.type] === item.id;
    const canAfford = this.saveData.coins >= item.price;

    const bg = this.add.rectangle(x, y, 120, 62, equipped ? 0x5b21b6 : 0x2d1b69).setOrigin(0.5).setInteractive({ useHandCursor: true });
    bg.setStrokeStyle(2, equipped ? 0xe879f9 : owned ? 0x4ade80 : 0x4c1d95);
    const icon = this.add.text(x - 36, y, item.emoji, { fontSize: '22px' }).setOrigin(0.5);
    const nameT = this.add.text(x + 16, y - 13, item.name, { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);
    let stateT;
    if (equipped) {
      stateT = this.add.text(x + 16, y + 8, '착용중', { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#e879f9' }).setOrigin(0.5);
    } else if (owned) {
      stateT = this.add.text(x + 16, y + 8, '착용하기', { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#4ade80' }).setOrigin(0.5);
    } else {
      stateT = this.add.text(x + 16, y + 8, `🪙 ${item.price}`, { fontSize: '11px', fontFamily: 'Malgun Gothic', color: canAfford ? '#fde047' : '#6b7280' }).setOrigin(0.5);
    }
    objs.push(bg, icon, nameT, stateT);

    bg.on('pointerdown', () => {
      if (equipped) {
        this.saveData.cosmetics.equipped[item.type] = null;
      } else if (owned) {
        this.saveData.cosmetics.equipped[item.type] = item.id;
      } else if (canAfford) {
        const typeOwned = this.saveData.cosmetics.owned.filter(id=>{
          const c=PETS_DATA.cosmetics.find(x=>x.id===id); return c&&c.type===item.type;
        }).length;
        if (typeOwned >= 10) { this.showMsg(`${item.type==='hat'?'모자':'신발'} 보관 공간 부족! (최대 10개)`); return; }
        Sound.play(this, 'coin', 0.5);   // 구매 효과음
        this.saveData.coins -= item.price;
        this.saveData.cosmetics.owned.push(item.id);
        this.saveData.cosmetics.equipped[item.type] = item.id;
      } else {
        this.showMsg('코인이 부족해요!');
        return;
      }
      Save.save(this.saveData);
      this.scene.restart({ saveData: this.saveData });
    });
  }

  showMsg(msg) {
    const { width, height } = this.scale;
    const t = this.add.text(width/2, height/2, msg, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fb923c', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(60);
    this.time.delayedCall(1300, () => t.destroy());
  }
}

// ── 씬: 월드맵 ────────────────────────────────────────────────────────────────
class WorldMapScene extends Phaser.Scene {
  constructor() { super('WorldMapScene'); }

  init(data) { this.saveData = data.saveData || Save.load(); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x0f0728).setOrigin(0);
    this.add.text(width / 2, 36, '월드 맵', { fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);

    const zones = PETS_DATA.zones;
    const zoneColors = [0x9BB8D4,0x3a7d44,0xc2410c,0x374151,0xf472b6,0xd97706,0x6366f1,0xd946ef,0x065f46];
    const zoneEmojis = ['🧊','🌿','🔥','🕳️','🏘️','🏜️','☁️','🌈','🌌'];

    zones.forEach((zone, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const x = 90 + col * 145, y = 130 + row * 150;
      const current = this.saveData.mapProgress.zone === zone.id;
      const bg = this.add.rectangle(x, y, 120, 110, zoneColors[i]).setOrigin(0.5).setInteractive({ useHandCursor: true });
      bg.setStrokeStyle(current ? 4 : 1, current ? 0xfbbf24 : 0xffffff);
      bg.setAlpha(current ? 1 : 0.75);

      this.add.text(x, y - 25, zoneEmojis[i], { fontSize: '30px' }).setOrigin(0.5);
      this.add.text(x, y + 8,  `${zone.id}. ${zone.name.replace(' 지역','')}`, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
      if (current) this.add.text(x, y + 28, '현재 위치', { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#fbbf24' }).setOrigin(0.5);

      bg.on('pointerdown', () => {
        this.saveData.mapProgress.zone = zone.id;
        this.saveData.mapProgress.x = 0;
        Save.save(this.saveData);
        this.scene.start('MapScene', { saveData: this.saveData });
      });
    });

    const backBtn = this.add.rectangle(width / 2, height - 36, 200, 44, 0x4c1d95).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(width / 2, height - 36, '← 모험으로', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    backBtn.on('pointerdown', () => this.scene.start('MapScene', { saveData: this.saveData }));
  }
}

// ── 씬: 진화 연출 ─────────────────────────────────────────────────────────────
class EvolveScene extends Phaser.Scene {
  constructor() { super('EvolveScene'); }

  init(data) {
    this.saveData = data.saveData;
    this.evoInfo = data.evoInfo;        // { petId, name, level }
    this.nextScene = data.nextScene || 'MapScene';
  }

  preload() { Utils.queuePetImages(this); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x0a0520).setOrigin(0);
    const pet = this.saveData.bag.find(p => p.id === this.evoInfo.petId) || this.evoInfo;
    const newLevel = this.evoInfo.level;
    const prevStage = Math.max(1, Utils.evoStage(newLevel) - 1);

    this.add.text(width/2, 90, '✨ 진화! ✨', { fontSize: '34px', fontFamily: 'Malgun Gothic', color: '#fde047', stroke: '#7c3aed', strokeThickness: 6 }).setOrigin(0.5);
    this.add.text(width/2, 140, `${this.evoInfo.name}가 성장했어요!`, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#c4b5fd' }).setOrigin(0.5);

    // 빛나는 원 배경
    const glow = this.add.circle(width/2, height*0.45, 110, 0xfde047, 0.25);
    this.tweens.add({ targets: glow, scale: 1.3, alpha: 0.05, duration: 1000, yoyo: true, repeat: -1 });

    // 이전 단계 → 새 단계 이미지 전환
    const prevKey = `petimg-${this.evoInfo.petId}-lv${prevStage}`;
    const newKey  = `petimg-${this.evoInfo.petId}-lv${Utils.evoStage(newLevel)}`;

    let sprite;
    if (this.textures.exists(prevKey)) {
      sprite = this.add.image(width/2, height*0.45, prevKey);
      sprite.setScale(150 / this.textures.get(prevKey).getSourceImage().height);
    } else {
      sprite = this.add.text(width/2, height*0.45, '🥚', { fontSize: '100px' }).setOrigin(0.5);
    }

    // 흔들림 → 번쩍 → 새 모습
    this.tweens.add({ targets: sprite, angle: 6, duration: 80, yoyo: true, repeat: 8 });
    this.time.delayedCall(1400, () => {
      const flash = this.add.rectangle(width/2, height*0.45, width, height, 0xffffff, 0).setDepth(20);
      this.tweens.add({ targets: flash, alpha: 1, duration: 250, yoyo: true, onYoyo: () => {
        sprite.destroy();
        if (this.textures.exists(newKey)) {
          const ns = this.add.image(width/2, height*0.45, newKey);
          ns.setScale(170 / this.textures.get(newKey).getSourceImage().height);
          this.tweens.add({ targets: ns, scale: ns.scale*1.08, duration: 600, yoyo: true, repeat: -1 });
        } else {
          this.add.text(width/2, height*0.45, '🐉', { fontSize: '110px' }).setOrigin(0.5);
        }
        if (typeof Sound !== 'undefined') Sound.play(this, 'win', 0.6);
        this.spawnSparkles();
      }});
    });

    this.add.text(width/2, height*0.66, `Lv.${newLevel} 으로 진화!`, { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#fbbf24', fontStyle: 'bold' }).setOrigin(0.5);

    // 계속 버튼 (연출 후 표시)
    this.time.delayedCall(2000, () => {
      const btn = this.add.rectangle(width/2, height*0.85, 220, 48, 0x7c3aed).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.setStrokeStyle(2, 0xa855f7);
      this.add.text(width/2, height*0.85, '계속하기 ▶', { fontSize: '17px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
      btn.on('pointerdown', () => this.scene.start(this.nextScene, { saveData: this.saveData }));
    });
  }

  spawnSparkles() {
    const { width, height } = this.scale;
    for (let i = 0; i < 16; i++) {
      const s = this.add.text(width/2, height*0.45, '✨', { fontSize: '20px' }).setOrigin(0.5);
      const ang = (Math.PI * 2 / 16) * i, dist = Phaser.Math.Between(80, 150);
      this.tweens.add({ targets: s, x: width/2 + Math.cos(ang)*dist, y: height*0.45 + Math.sin(ang)*dist, alpha: 0, duration: 900, onComplete: () => s.destroy() });
    }
  }
}

// ── Phaser 게임 초기화 ────────────────────────────────────────────────────────
async function init() {
  await loadPetsData();

  new Phaser.Game({
    type: Phaser.AUTO,
    width: 600,
    height: 800,
    parent: 'game-container',
    backgroundColor: '#1a0a3e',
    scene: [
      TitleScene, GradeScene, CharScene,
      MapScene, QuizScene, HatchScene, ResultScene,
      BattleScene, PetSwapScene,
      BagScene, CollectionScene, TypeChartScene,
      ShopScene, CosmeticScene, WorldMapScene, EvolveScene,
    ],
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
  });
}

init();
</script>

</html>
