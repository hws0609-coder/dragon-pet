    zoneNames.forEach((name, i) => {
      const zoneId = i + 1;
      const row = Math.floor(i / 3), col = i % 3;
      const bx = width/2 - 110 + col * 110;
      const by = height/2 - 140 + row * 90;
      const isCurrent = zoneId === currentZone;

      const btn = this.add.rectangle(bx, by, 96, 72, isCurrent ? 0x4c1d95 : 0x2d1b69)
        .setScrollFactor(0).setDepth(42).setOrigin(0.5);
      btn.setStrokeStyle(isCurrent ? 2 : 1, isCurrent ? 0xe879f9 : 0x4c1d95);

      const emoji = this.add.text(bx, by - 14, zoneEmojis[i], { fontSize: '24px' })
        .setScrollFactor(0).setDepth(43).setOrigin(0.5);
      const label = this.add.text(bx, by + 14, `${zoneId}.${name}`, {
        fontSize: '12px', fontFamily: 'Malgun Gothic',
        color: isCurrent ? '#e879f9' : '#c4b5fd',
      }).setScrollFactor(0).setDepth(43).setOrigin(0.5);

      if (isCurrent) {
        const cur = this.add.text(bx, by + 28, '현재', {
          fontSize: '10px', fontFamily: 'Malgun Gothic', color: '#a78bfa',
        }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
        allObjs.push(cur);
      }

      allObjs.push(btn, emoji, label);

      if (!isCurrent) {
        btn.setInteractive({ useHandCursor: true });
        btn.on('pointerover', () => { btn.setFillStyle(0x4c1d95); btn.setScale(1.06); });
        btn.on('pointerout',  () => { btn.setFillStyle(0x2d1b69); btn.setScale(1); });
        btn.on('pointerdown', () => {
          allObjs.forEach(o => o.destroy());
          this.saveData.mapProgress.zone = zoneId;
          this.saveData.mapObjects = null;
          this.saveData.mapProgress.px = null;
          this.saveData.mapProgress.py = null;
          Save.save(this.saveData);
          this.scene.restart({ saveData: this.saveData });
        });
      }
    });

    // 닫기 버튼
    const closeBtn = this.add.rectangle(width/2, height/2 + 215, 160, 40, 0x374151)
      .setScrollFactor(0).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
    const closeText = this.add.text(width/2, height/2 + 215, '✕ 닫기', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#9ca3af',
    }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
    allObjs.push(closeBtn, closeText);
    closeBtn.on('pointerdown', () => allObjs.forEach(o => o.destroy()));
  }

  createJoystick() {
    const { width, height } = this.scale;
    // 조이스틱 베이스 (화면 고정 — setScrollFactor(0))
    const jx = 80, jy = height - 130;
    const base = this.add.circle(jx, jy, 48, 0x000000, 0.35).setScrollFactor(0).setDepth(20);
    base.setStrokeStyle(2, 0xffffff, 0.4);
    this.stick = this.add.circle(jx, jy, 22, 0xffffff, 0.7).setScrollFactor(0).setDepth(21);

    // 방향 버튼 대신 드래그 조이스틱
    const zone = this.add.zone(jx - 60, jy - 60, 120, 120).setScrollFactor(0).setDepth(22).setInteractive();
    this.joyBase = { x: jx, y: jy };
    this.joystickActive = false;

    zone.on('pointerdown', (ptr) => {
      this.joystickActive = true;
      this.updateJoystick(ptr.x, ptr.y);
    });
    this.input.on('pointermove', (ptr) => {
      if (this.joystickActive) this.updateJoystick(ptr.x, ptr.y);
    });
    this.input.on('pointerup', () => {
      this.joystickActive = false;
      this.moveDir = { x: 0, y: 0 };
      this.stick.setPosition(this.joyBase.x, this.joyBase.y);
    });

    // 방향키 (키보드)
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({ up:'W', down:'S', left:'A', right:'D' });
  }

  updateJoystick(px, py) {
    const dx = px - this.joyBase.x, dy = py - this.joyBase.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 40;
    const clamped = Math.min(dist, maxDist);
    const angle = Math.atan2(dy, dx);
    this.stick.setPosition(this.joyBase.x + Math.cos(angle)*clamped, this.joyBase.y + Math.sin(angle)*clamped);
    this.moveDir = dist > 8
      ? { x: Math.cos(angle), y: Math.sin(angle) }
      : { x: 0, y: 0 };
  }

  update() {
    if (!this.player) return;

    // 얼음 지역 빙결 시 이동 차단
    if (this.iceFreeze) return;

    let dx = this.moveDir.x, dy = this.moveDir.y;

    // 키보드
    if (this.cursors.left.isDown  || this.wasd.left.isDown)  dx = -1;
    if (this.cursors.right.isDown || this.wasd.right.isDown) dx =  1;
    if (this.cursors.up.isDown    || this.wasd.up.isDown)    dy = -1;
    if (this.cursors.down.isDown  || this.wasd.down.isDown)  dy =  1;

    // 얼음 지역 정지 시간 추적
    if (this.saveData.mapProgress.zone === 1 && !this.iceImmune) {
      if (dx === 0 && dy === 0) {
        this.iceIdle += this.game.loop.delta;
        if (this.iceIdle >= 3000) {
          this.iceFreeze = true;
          this.saveData.frozen = true;
          Save.save(this.saveData);
          this.showFreezeOverlay();
          return;
        }
      } else {
        this.iceIdle = 0;
      }
    }

    if (dx !== 0 || dy !== 0) {
      const len = Math.sqrt(dx*dx + dy*dy);
      const ndx = dx/len, ndy = dy/len;
      // 덩굴 지대 진입 시 속도 감소 (풀 속성 동행 펫은 면역)
      let spd = this.SPEED;
      if (this.vineZone) {
        const vz = this.vineZone;
        const inVine = this.player.x >= vz.x && this.player.x <= vz.x + vz.w &&
                       this.player.y >= vz.y && this.player.y <= vz.y + vz.h;
        const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
        const isGrassType = activePet && activePet.type === '풀';
        if (inVine && !isGrassType) {
          spd = Math.max(1, spd * 0.5);
          if (!this.vineHud) {
            this.vineHud = this.add.text(this.scale.width/2, 90, '🌿 덩굴 지대! 속도 -50%', {
              fontSize:'13px', fontFamily:'Malgun Gothic', color:'#86efac',
              fontStyle:'bold', stroke:'#000', strokeThickness:3,
            }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
          }
        } else if (inVine && isGrassType) {
          if (!this.vineHud || this.vineHud.text !== '🌿 풀 속성 저항! 속도 유지') {
            if (this.vineHud) this.vineHud.destroy();
            this.vineHud = this.add.text(this.scale.width/2, 90, '🌿 풀 속성 저항! 속도 유지', {
              fontSize:'13px', fontFamily:'Malgun Gothic', color:'#4ade80',
              fontStyle:'bold', stroke:'#000', strokeThickness:3,
            }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
          }
        } else if (this.vineHud) {
          this.vineHud.destroy();
          this.vineHud = null;
        }
      }
      // 블랙홀 근접 시 속도 감소
      if (this.blackHole) {
        const bhDist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.blackHole.x, this.blackHole.y);
        if (bhDist < this.bhPullRange) {
          spd = Math.max(1, spd - 8);
          if (!this.bhHud) {
            this.bhHud = this.add.text(this.scale.width/2, 115, '🕳️ 블랙홀의 인력! 속도 -8', {
              fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#c084fc',
              fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
            }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
          }
        } else if (this.bhHud) {
          this.bhHud.destroy();
          this.bhHud = null;
        }
      }
      const nx = this.player.x + ndx * spd;
      const ny = this.player.y + ndy * spd;
      this.player.x = Phaser.Math.Clamp(nx, 20, this.MAP_W - 20);
      this.player.y = Phaser.Math.Clamp(ny, 20, this.MAP_H - 20);
      // 이동 방향 기억 (펫이 뒤에 위치하도록)
      this.lastDir = { x: ndx, y: ndy };
      // 이름 라벨 따라오기
      if (this.playerLabel) {
        this.playerLabel.x = this.player.x;
        this.playerLabel.y = this.player.y - 56;
      }
      // 위치 저장 (매 60프레임)
      if (this.game.getFrame() % 60 === 0) {
        this.saveData.mapProgress.px = this.player.x;
        this.saveData.mapProgress.py = this.player.y;
      }
    }

    // 동행 펫이 캐릭터 뒤를 부드럽게 따라오기 (이동 방향 반대편)
    if (this.petFollow) {
      const dir = this.lastDir || { x: -1, y: 0 };
      const targetX = this.player.x - dir.x * 42;
      const targetY = this.player.y - dir.y * 42 + 6;
      this.petFollow.x += (targetX - this.petFollow.x) * 0.15;
      this.petFollow.y += (targetY - this.petFollow.y) * 0.15;
    }
    // 동굴 스포트라이트 업데이트 (화면 좌표)
    if (this.caveSpotlight) {
      const cam = this.cameras.main;
      const screenX = this.player.x - cam.scrollX;
      const screenY = this.player.y - cam.scrollY;
      this.caveSpotlight.clear();
      this.caveSpotlight.fillStyle(0xffffff);
      this.caveSpotlight.fillCircle(screenX, screenY, this.caveRadius);
    }
    // 미니맵 플레이어 점 업데이트
    if (this.minimapDot) {
      const { width } = this.scale;
      this.minimapDot.x = (width - 90) + (this.player.x / this.MAP_W) * 80;
      this.minimapDot.y = 22 + (this.player.y / this.MAP_H) * 58;
    }

    // 블랙홀 흡수 체크 (이동 여부와 무관하게 항상)
    if (this.blackHole && this.player) {
      const bhDist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.blackHole.x, this.blackHole.y);
      if (bhDist < this.bhSuckRange) {
        // 흡수 연출 후 랜덤 위치 텔레포트
        const { width, height } = this.scale;
        const suckTxt = this.add.text(width/2, height/2, '🕳️ 블랙홀에 빨려 들어갔어요!', {
          fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#c084fc',
          fontStyle: 'bold', stroke: '#000', strokeThickness: 4,
        }).setScrollFactor(0).setDepth(30).setOrigin(0.5);
        // 화면 플래시
        const flash = this.add.rectangle(width/2, height/2, width, height, 0x2d0060, 0.7)
          .setScrollFactor(0).setDepth(29).setOrigin(0.5);
        // 랜덤 위치로 텔레포트
        const newX = Phaser.Math.Between(100, this.MAP_W - 100);
        const newY = Phaser.Math.Between(100, this.MAP_H - 100);
        this.time.delayedCall(1200, () => {
          this.player.x = newX;
          this.player.y = newY;
          this.saveData.mapProgress.px = newX;
          this.saveData.mapProgress.py = newY;
          Save.save(this.saveData);
          flash.destroy();
          suckTxt.destroy();
          if (this.bhHud) { this.bhHud.destroy(); this.bhHud = null; }
        });
        // 블랙홀을 멀리 이동시켜서 연속 흡수 방지
        this.blackHole.x = Phaser.Math.Between(100, this.MAP_W - 100);
        this.blackHole.y = Phaser.Math.Between(100, this.MAP_H - 100);
      }
    }
  }

  createMinimap() {
    const { width } = this.scale;
    // 미니맵 배경
    const mm = this.add.rectangle(width - 50, 20, 82, 62, 0x000000, 0.5).setScrollFactor(0).setDepth(20).setOrigin(0.5, 0);
    mm.setStrokeStyle(1, 0xffffff, 0.4);
    // 오브젝트 점
    const objs = this.saveData.mapObjects;
    objs.eggs.forEach(e => {
      if (e.collected) return;
      const mx = (width-90) + (e.x/this.MAP_W)*80, my = 22 + (e.y/this.MAP_H)*58;
      this.add.circle(mx, my, 3, 0xffff00, 0.8).setScrollFactor(0).setDepth(21);
    });
    objs.wildPets.forEach(w => {
      if (w.defeated) return;
      const mx = (width-90) + (w.x/this.MAP_W)*80, my = 22 + (w.y/this.MAP_H)*58;
      this.add.circle(mx, my, 3, 0xff4444, 0.9).setScrollFactor(0).setDepth(21);
    });
    // 플레이어 점
    this.minimapDot = this.add.circle(width-50, 50, 5, 0x00ffff, 1).setScrollFactor(0).setDepth(22);
    // 미니맵에 덩굴 지대 표시
    if (this.vineZone) {
      const vz = this.vineZone;
      const mx = (width-90) + (vz.x / this.MAP_W) * 80;
      const my = 22 + (vz.y / this.MAP_H) * 58;
      const mw = (vz.w / this.MAP_W) * 80;
      const mh = (vz.h / this.MAP_H) * 58;
      this.add.rectangle(mx + mw/2, my + mh/2, mw, mh, 0x0a3d0a, 0.5).setScrollFactor(0).setDepth(20).setOrigin(0.5);
    }
  }

  showLegendWarning(onConfirm) {
    const { width, height } = this.scale;
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.6).setScrollFactor(0).setDepth(30).setOrigin(0.5);
    const box = this.add.rectangle(width/2, height/2, 320, 200, 0x1a0a3e).setScrollFactor(0).setDepth(31).setOrigin(0.5);
    box.setStrokeStyle(3, 0xFFD700);
    const t1 = this.add.text(width/2, height/2-60, '⚠️ 전설 드래곤 출현!', { fontSize:'20px', fontFamily:'Malgun Gothic', color:'#FFD700' }).setScrollFactor(0).setDepth(32).setOrigin(0.5);
    const t2 = this.add.text(width/2, height/2-20, '매우 강한 상대예요.\n배틀하겠어요?', { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#ffffff', align:'center' }).setScrollFactor(0).setDepth(32).setOrigin(0.5);
    const yes = this.add.rectangle(width/2-70, height/2+50, 120, 40, 0x7c3aed).setScrollFactor(0).setDepth(32).setOrigin(0.5).setInteractive({ useHandCursor:true });
    const ty  = this.add.text(width/2-70, height/2+50, '배틀하기', { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#fff' }).setScrollFactor(0).setDepth(33).setOrigin(0.5);
    const no  = this.add.rectangle(width/2+70, height/2+50, 120, 40, 0x374151).setScrollFactor(0).setDepth(32).setOrigin(0.5).setInteractive({ useHandCursor:true });
    const tn  = this.add.text(width/2+70, height/2+50, '도망가기', { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#fff' }).setScrollFactor(0).setDepth(33).setOrigin(0.5);
    const closeAll = () => [overlay,box,t1,t2,yes,ty,no,tn].forEach(o=>o.destroy());
    yes.on('pointerdown', () => { closeAll(); onConfirm(); });
    no.on('pointerdown',  () => { closeAll(); });
  }

  generatePositions(count) {
    const positions = [], margin = 100;
    let tries = 0;
    while (positions.length < count && tries < 1000) {
      const x = Phaser.Math.Between(margin, this.MAP_W - margin);
      const y = Phaser.Math.Between(margin, this.MAP_H - margin);
      const overlap = positions.some(p => Phaser.Math.Distance.Between(x, y, p.x, p.y) < 120);
      if (!overlap) positions.push({ x, y });
      tries++;
    }
    return positions;
  }

  createHUD() {
    const { width, height } = this.scale;
    const hud = this.add.rectangle(0, height-70, width, 70, 0x0f0728, 0.92).setScrollFactor(0).setDepth(20).setOrigin(0);
    hud.setStrokeStyle(1, 0x4c1d95);

    const btns = [
      { label:'가방', x:width*0.35, scene:'BagScene'        },
      { label:'도감', x:width*0.55, scene:'CollectionScene' },
      { label:'설정', x:width*0.75, scene:'TitleScene'      },
    ];
    btns.forEach(({ label, x, scene }) => {
      const btn = this.add.rectangle(x, height-35, 72, 44, 0x1e1145).setScrollFactor(0).setDepth(21).setOrigin(0.5).setInteractive({ useHandCursor:true });
      btn.setStrokeStyle(1, 0x4c1d95);
      this.add.text(x, height-35, label, { fontSize:'13px', fontFamily:'Malgun Gothic', color:'#c4b5fd' }).setScrollFactor(0).setDepth(22).setOrigin(0.5);
      btn.on('pointerdown', () => { Save.save(this.saveData); this.scene.start(scene, { saveData:this.saveData }); });
    });

    // 남은 오브젝트 카운트
    const remainEggs = this.saveData.mapObjects.eggs.filter(e=>!e.collected).length;
    const remainWild = this.saveData.mapObjects.wildPets.filter(w=>!w.defeated).length;
    const zoneId = this.saveData.mapProgress.zone;
    const zone   = PETS_DATA.zones.find(z=>z.id===zoneId);
    this.add.text(width*0.22, height-44, `${zone.name}`, { fontSize:'12px', fontFamily:'Malgun Gothic', color:'#e9d5ff' }).setScrollFactor(0).setDepth(22).setOrigin(0.5);
    this.add.text(width*0.22, height-24, `🥚${remainEggs}  ⚔️${remainWild}`, { fontSize:'12px', fontFamily:'Malgun Gothic', color:'#c4b5fd' }).setScrollFactor(0).setDepth(22).setOrigin(0.5);

    // 코인 표시 (상단 좌측, 더 위로)
    const coinBg = this.add.rectangle(54, 34, 90, 26, 0x000000, 0.5).setScrollFactor(0).setDepth(20).setOrigin(0.5);
    coinBg.setStrokeStyle(1, 0xfbbf24);
    this.add.text(54, 34, `🪙 ${this.saveData.coins}`, { fontSize:'14px', fontFamily:'Malgun Gothic', color:'#fde047', fontStyle:'bold' }).setScrollFactor(0).setDepth(21).setOrigin(0.5);

    // 속도 표시 (탈것 장착 시, 코인 바로 아래)
    const curShoeId = this.saveData.cosmetics?.equipped?.shoes;
    if (curShoeId) {
      const curShoe = PETS_DATA.cosmetics.find(c => c.id === curShoeId);
      if (curShoe?.speed) {
        const speedBg = this.add.rectangle(54, 62, 90, 24, 0x000000, 0.45).setScrollFactor(0).setDepth(20).setOrigin(0.5);
        speedBg.setStrokeStyle(1, 0x60a5fa);
        const bars = '▶'.repeat(Math.min(Math.round(curShoe.speed / 2), 5));
        this.add.text(54, 62, `${curShoe.emoji}${bars}`, { fontSize: '12px', color: '#93c5fd' }).setScrollFactor(0).setDepth(21).setOrigin(0.5);
      }
    }

    // ── 동행 펫 패널 (우측 하단) ──
    this.createActivePetPanel();
  }

  createActivePetPanel() {
    const { width, height } = this.scale;
    const pet = this.saveData.bag.find(p => p.isActive && p.alive) || this.saveData.bag.find(p => p.alive);
    if (!pet) return;

    const panelW = 200, panelH = 52;
    const px = width - panelW - 8;       // 우측
    const py = height - 70 - panelH - 6; // HUD(70) 바로 위 = 우측 하단

    // 패널 배경
    const panel = this.add.rectangle(px, py, panelW, panelH, 0x0f0728, 0.9).setScrollFactor(0).setDepth(20).setOrigin(0);
    panel.setStrokeStyle(1, 0x7c3aed);

    // 펫 썸네일
    const texKey = Utils.petTexKey(pet.id, pet.level);
    const imgCx = px + 28, imgCy = py + panelH/2;
    if (this.textures.exists(texKey)) {
      const img = this.add.image(imgCx, imgCy, texKey).setScrollFactor(0).setDepth(21);
      const src = this.textures.get(texKey).getSourceImage();
      img.setScale(44 / src.height);
    } else {
      this.add.text(imgCx, imgCy, '🐾', { fontSize: '28px' }).setScrollFactor(0).setDepth(21).setOrigin(0.5);
    }

    // 이름 + 레벨
    const tx = px + 54;
    this.add.text(tx, py + 6, `${pet.name.length>6?pet.name.slice(0,6):pet.name}`, { fontSize:'12px', fontFamily:'Malgun Gothic', color:'#e9d5ff', fontStyle:'bold' }).setScrollFactor(0).setDepth(21).setOrigin(0,0.5);
    this.add.text(px + panelW - 8, py + 6, `Lv.${pet.level}`, { fontSize:'11px', fontFamily:'Malgun Gothic', color:'#fbbf24' }).setScrollFactor(0).setDepth(21).setOrigin(1,0.5);

    // HP 바
    const barW = panelW - 54 - 12, barX = tx;
    const hpY = py + 24;
    this.add.rectangle(barX, hpY, barW, 8, 0x374151).setScrollFactor(0).setDepth(21).setOrigin(0,0.5);
    const hpPct = Math.max(0, Math.min(pet.hp / pet.maxHp, 1));
    this.hudHpFill = this.add.rectangle(barX, hpY, barW * Math.max(hpPct, 0.001), 8, 0xef4444).setScrollFactor(0).setDepth(22).setOrigin(0,0.5);
    this.hudHpText = this.add.text(barX + barW/2, hpY, `HP ${pet.hp}/${pet.maxHp}`, { fontSize:'8px', fontFamily:'Malgun Gothic', color:'#fff' }).setScrollFactor(0).setDepth(23).setOrigin(0.5);
    this.hudHpBarW = barW;

    // XP 바
    const xpY = py + 40;
    this.add.rectangle(barX, xpY, barW, 8, 0x1a1a2e).setScrollFactor(0).setDepth(21).setOrigin(0,0.5);
    const xpPct = Math.max(0, Math.min(pet.xp / pet.xpToNext, 1));
    if (xpPct > 0) this.add.rectangle(barX, xpY, barW * xpPct, 8, 0xfbbf24).setScrollFactor(0).setDepth(22).setOrigin(0,0.5);
    this.add.text(barX + barW/2, xpY, `XP ${pet.xp}/${pet.xpToNext}`, { fontSize:'8px', fontFamily:'Malgun Gothic', color:'#1a0a3e' }).setScrollFactor(0).setDepth(23).setOrigin(0.5);
  }

  updateHpBar() {
    const pet = this.saveData.bag.find(p => p.isActive);
    if (!pet || !this.hudHpFill || !this.hudHpText) return;
    const pct = Math.max(0, Math.min(pet.hp / pet.maxHp, 1));
    this.hudHpFill.setDisplaySize(this.hudHpBarW * Math.max(pct, 0.001), 8);
    this.hudHpText.setText(`HP ${pet.hp}/${pet.maxHp}`);
  }
}

// ── 씬: 퀴즈 ─────────────────────────────────────────────────────────────────
class QuizScene extends Phaser.Scene {
  constructor() { super('QuizScene'); }

  init(data) { this.saveData = data.saveData; this.retryMode = data.retryMode || false; }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1e1b4b).setOrigin(0);

    const grade = this.saveData.grade || 2;
    // 다시 풀기 모드면 틀린 문제에서 출제, 아니면 일반 출제
    let quiz;
    if (this.retryMode && this.saveData.wrongQuiz && this.saveData.wrongQuiz.length > 0) {
      const w = this.saveData.wrongQuiz[Phaser.Math.Between(0, this.saveData.wrongQuiz.length - 1)];
      quiz = { question: w.question, answer: w.answer, choices: Utils.shuffle([...w.choices]), bonus: !!w.bonus, category: w.category };
      this.currentWrong = w;
    } else {
      quiz = this.makeQuiz(grade);
      this.currentWrong = null;
    }
    this.currentQuiz = quiz;

    const headTitle = this.retryMode ? '📝 틀린 문제 다시 풀기!' : '🥚 알을 발견했어요!';
    this.add.text(width / 2, 60, headTitle, { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);
    if (quiz.bonus) {
      const bonusTag = this.add.text(width / 2, 110, '⭐ 경험치가 높은 문제예요! (+15 XP) ⭐', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fde047', fontStyle: 'bold' }).setOrigin(0.5);
      this.tweens.add({ targets: bonusTag, scale: 1.08, duration: 600, yoyo: true, repeat: -1 });
    } else {
      this.add.text(width / 2, 110, '문제를 풀면 경험치를 얻어요', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);
    }

    this.add.rectangle(width / 2, height * 0.35, width - 40, 80, 0x312e81).setOrigin(0.5);
    this.add.text(width / 2, height * 0.35, quiz.question, {
      fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#ffffff', align: 'center', wordWrap: { width: width - 80 },
    }).setOrigin(0.5);

    this.answered = false;
    this.btnList  = [];

    quiz.choices.forEach((choice, i) => {
      const x = i % 2 === 0 ? width * 0.28 : width * 0.72;
      const y = height * 0.55 + Math.floor(i / 2) * 80;
      const btn = this.add.rectangle(x, y, 180, 60, 0x4c1d95).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.setStrokeStyle(2, 0x7c3aed);
      const txt = this.add.text(x, y, String(choice), { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#ffffff' }).setOrigin(0.5);
      this.btnList.push({ btn, txt, choice, isAnswer: choice === quiz.answer });
      btn.on('pointerdown', () => this.answer(choice === quiz.answer, quiz.answer));
    });
  }

  answer(correct, correctAnswer) {
    if (this.answered) return;
    this.answered = true;

    // 모든 버튼 비활성화 + 정답 강조
    this.btnList.forEach(({ btn, txt, isAnswer }) => {
      btn.disableInteractive();
      if (isAnswer) {
        btn.setFillStyle(0x16a34a);
        btn.setStrokeStyle(3, 0x4ade80);
        txt.setColor('#ffffff');
      } else {
        btn.setFillStyle(0x374151);
        btn.setStrokeStyle(1, 0x6b7280);
        txt.setColor('#9ca3af');
      }
    });

    // 경험치: 보너스 문제(수학/영어) 정답 시 15, 일반 정답 10, 오답 3
    const isBonus = this.currentQuiz && this.currentQuiz.bonus;
    const xpGain = correct ? (isBonus ? 15 : 10) : 3;
    const { width, height } = this.scale;

    if (correct) {
      if (isBonus) {
        // 강조 표시
        this.add.text(width / 2, height * 0.80, '✅ 정답! +15 XP', {
          fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#fde047', fontStyle: 'bold',
          stroke: '#7c3aed', strokeThickness: 4,
        }).setOrigin(0.5);
        const star = this.add.text(width / 2, height * 0.87, '⭐ 경험치가 높은 문제예요! ⭐', {
          fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fbbf24', fontStyle: 'bold',
        }).setOrigin(0.5);
        this.tweens.add({ targets: star, scale: 1.12, duration: 400, yoyo: true, repeat: 2 });
      } else {
        this.add.text(width / 2, height * 0.82, '✅ 정답! +10 XP', {
          fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#4ade80', fontStyle: 'bold',
        }).setOrigin(0.5);
      }
    } else {
      this.add.text(width / 2, height * 0.80, '❌ 오답! +3 XP', {
        fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#fb923c', fontStyle: 'bold',
      }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.88, `정답: ${correctAnswer}`, {
        fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fbbf24',
      }).setOrigin(0.5);
    }

    // 오답 노트 처리
    if (!this.saveData.wrongQuiz) this.saveData.wrongQuiz = [];
    if (correct) {
      // 다시풀기에서 맞히면 목록에서 제거
      if (this.currentWrong) {
        this.saveData.wrongQuiz = this.saveData.wrongQuiz.filter(w => w.question !== this.currentWrong.question);
      }
    } else {
      // 틀린 문제 저장 (중복 방지, 최대 50개)
      const q = this.currentQuiz;
      const exists = this.saveData.wrongQuiz.some(w => w.question === q.question);
      if (!exists && q) {
        this.saveData.wrongQuiz.push({ question: q.question, answer: q.answer, choices: [...q.choices], bonus: !!q.bonus, category: q.category });
        if (this.saveData.wrongQuiz.length > 50) this.saveData.wrongQuiz.shift();
      }
    }

    // XP 적용 (레벨 무한)
    let evoInfo = null;
    const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
    if (activePet) {
      const r = Utils.applyXp(activePet, xpGain);
      if (r.leveledUp) this.leveledUp = true;
      if (r.evolved) evoInfo = { petId: activePet.id, name: activePet.name, level: activePet.level };
    }
    Save.save(this.saveData);

    // 다시풀기 모드: 결과 후 다시 다시풀기 화면 또는 타이틀로
    if (this.retryMode) {
      this.time.delayedCall(1400, () => {
        if (this.saveData.wrongQuiz.length > 0) this.scene.restart({ saveData: this.saveData, retryMode: true });
        else {
          this.add.text(this.scale.width/2, this.scale.height*0.7, '🎉 틀린 문제를 모두 풀었어요!', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#4ade80' }).setOrigin(0.5);
          this.time.delayedCall(1200, () => this.scene.start('MapScene', { saveData: this.saveData }));
        }
      });
      return;
    }

    // 정답: 1.2초 후 부화 씬으로 / 오답: 2초 후 맵으로 (알 못 깸)
    this.time.delayedCall(correct ? 1200 : 2000, () => {
      if (correct) {
        this.scene.start('HatchScene', { saveData: this.saveData, correct, xpGain, evoInfo });
      } else {
        this.scene.start('MapScene', { saveData: this.saveData });
      }
    });
  }

  makeQuiz(grade) {
    if (grade === 2) return this.makeGrade2Quiz();
    return this.makeGrade4Quiz();
  }

  makeGrade2Quiz() {
    const isMath = Math.random() < 0.75;  // 수학 75% / 상식 25%
    if (isMath) {
      const type = Phaser.Math.Between(0, 2);
      // 정답 주변의 서로 다른 오답 3개 생성 (음수 제외, 중복 없음)
      const makeChoices = (answer) => {
        const set = new Set([answer]);
        const offsets = [10, -3, 4, 5, -5, 8, -8, 12, 2, -2];
        let oi = 0;
        while (set.size < 4 && oi < offsets.length) {
          const v = answer + offsets[oi++];
          if (v >= 0) set.add(v);
        }
        let extra = 13;
        while (set.size < 4) { set.add(answer + extra); extra += 3; }
        return Utils.shuffle([...set]).slice(0, 4);
      };
      if (type === 0) {
        // 덧셈: 두 자리(10XP) 또는 세 자리(15XP, 보너스)
        const big = Math.random() < 0.5;
        const a = big ? Phaser.Math.Between(100, 500) : Phaser.Math.Between(5, 90);
        const b = big ? Phaser.Math.Between(100, 400) : Phaser.Math.Between(5, 90);
        const answer = a + b;
        return { category: 'math', bonus: big, question: `${a} + ${b} = ?`, answer, choices: makeChoices(answer) };
      }
      if (type === 1) {
        // 뺄셈: 두 자리(10XP) 또는 세 자리(15XP, 보너스)
        const big = Math.random() < 0.5;
        const a = big ? Phaser.Math.Between(200, 900) : Phaser.Math.Between(20, 90);
        const b = big ? Phaser.Math.Between(100, a-1) : Phaser.Math.Between(5, a-1);
        const answer = a - b;
        return { category: 'math', bonus: big, question: `${a} - ${b} = ?`, answer, choices: makeChoices(answer) };
      }
      const table = Phaser.Math.Between(2, 5), num = Phaser.Math.Between(2, 9);
      const answer = table * num;
      return { category: 'math', bonus: true, question: `${table} × ${num} = ?`, answer, choices: makeChoices(answer) };
    }
    // 백과사전 퀴즈
    const pool = QUIZ_DATA.grade2.encyclopedia;
    const q = pool[Phaser.Math.Between(0, pool.length-1)];
    return { category: 'encyclopedia', bonus: false, question: q.question, answer: q.answer, choices: Utils.shuffle([...q.choices]) };
  }

  makeGrade4Quiz() {
    const r = Math.random();
    // 수학 50%
    if (r < 0.5) {
      const type = Phaser.Math.Between(0, 2);
      if (type === 0) {
        const a = Phaser.Math.Between(10, 30), b = Phaser.Math.Between(3, 9);
        const answer = a * b;
        return { category: 'math', bonus: true, question: `${a} × ${b} = ?`, answer,
          choices: Utils.shuffle([answer, answer+b, answer-b, answer+b*2]).slice(0,4) };
      }
      if (type === 1) {
        const b = Phaser.Math.Between(2, 9), answer = Phaser.Math.Between(10, 20);
        const a = b * answer;
        return { category: 'math', bonus: true, question: `${a} ÷ ${b} = ?`, answer,
          choices: Utils.shuffle([answer, answer+1, answer-1, answer+2]).slice(0,4) };
      }
      const fracs = [
        { question: '1/2 + 1/2 = ?', answer: '1', choices: ['1/2','1','3/2','2'] },
        { question: '3/4 - 1/4 = ?', answer: '1/2', choices: ['1/4','1/2','3/4','1'] },
        { question: '1/3 + 1/3 = ?', answer: '2/3', choices: ['1/3','2/3','3/3','1'] },
        { question: '5/6 - 1/6 = ?', answer: '4/6', choices: ['2/6','3/6','4/6','5/6'] },
        { question: '1/4 + 2/4 = ?', answer: '3/4', choices: ['1/4','2/4','3/4','4/4'] },
        { question: '2/5 + 1/5 = ?', answer: '3/5', choices: ['1/5','2/5','3/5','4/5'] },
      ];
      const f = fracs[Phaser.Math.Between(0, fracs.length-1)];
      return { category: 'math', bonus: true, question: f.question, answer: f.answer, choices: Utils.shuffle([...f.choices]) };
    }
    // 백과사전 25% / 영어 25%
    let pool, cat;
    if (r < 0.75) { pool = QUIZ_DATA.grade4.encyclopedia; cat = 'encyclopedia'; }
    else { pool = QUIZ_DATA.grade4.english; cat = 'english'; }
    const q = pool[Phaser.Math.Between(0, pool.length-1)];
    return { category: cat, bonus: (cat === 'english'), question: q.question, answer: q.answer, choices: Utils.shuffle([...q.choices]) };
  }
}

// ── 씬: 부화 ─────────────────────────────────────────────────────────────────
class HatchScene extends Phaser.Scene {
  constructor() { super('HatchScene'); }

  init(data) { this.saveData = data.saveData; this.correct = data.correct; this.xpGain = data.xpGain; this.evoInfo = data.evoInfo || null; }

  preload() { Utils.queuePetImages(this); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    const resultColor = this.correct ? '#4ade80' : '#fb923c';
    const resultText  = this.correct ? '✅ 정답!' : '❌ 오답!';
    this.add.text(width / 2, 70, resultText, { fontSize: '28px', fontFamily: 'Malgun Gothic', color: resultColor }).setOrigin(0.5);
    this.add.text(width / 2, 110, `경험치 +${this.xpGain}`, { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fbbf24' }).setOrigin(0.5);
    this.add.text(width / 2, 160, '알을 두드려서 부화시키자!', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);

    this.tapCount = 0;
    this.maxTaps = Phaser.Math.Between(3, 5);

    this.eggText = this.add.text(width / 2, height * 0.45, '🥚', { fontSize: '100px' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.tweens.add({ targets: this.eggText, y: this.eggText.y - 10, duration: 900, yoyo: true, repeat: -1 });

    this.tapCountText = this.add.text(width / 2, height * 0.63, '0', { fontSize: '40px', fontFamily: 'Malgun Gothic', color: '#e879f9' }).setOrigin(0.5);
    this.add.text(width / 2, height * 0.7, '번 두드렸어!', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);

    this.barBg = this.add.rectangle(width / 2, height * 0.77, width - 80, 18, 0x312e81).setOrigin(0.5);
    this.bar   = this.add.rectangle(width / 2 - (width - 80) / 2, height * 0.77, 0, 18, 0xa855f7).setOrigin(0, 0.5);

    this.eggText.on('pointerdown', () => this.tap());
  }

  tap() {
    this.tapCount++;
    Sound.play(this, 'click', 0.3);   // 두드림 효과음
    const pct = Math.min(this.tapCount / this.maxTaps, 1);
    this.bar.width = (this.scale.width - 80) * pct;
    this.tapCountText.setText(String(this.tapCount));
    this.tweens.add({ targets: this.eggText, angle: -8, duration: 60, yoyo: true });

    if (this.tapCount >= this.maxTaps) {
      this.eggText.disableInteractive();
      Sound.play(this, 'hatch', 0.6);   // 부화 효과음
      this.time.delayedCall(300, () => this.hatch());
    }
  }

  hatch() {
    const result = Utils.hatchResult();
    if (result.type === 'pet') {
      if (!this.saveData.collection.includes(result.pet.id)) this.saveData.collection.push(result.pet.id);
      if (this.saveData.bag.length < 20) {
        this.saveData.bag.push(result.pet);
        Save.save(this.saveData);
        this.scene.start('ResultScene', { saveData: this.saveData, result, evoInfo: this.evoInfo });
      } else {
        // 가방 꽉 참 → 버리기 모드로 BagScene 이동
        Save.save(this.saveData);
        this.scene.start('BagScene', { saveData: this.saveData, releaseMode: true, newPet: result.pet });
      }
    } else {
      this.saveData.items[result.item]++;
      Save.save(this.saveData);
      this.scene.start('ResultScene', { saveData: this.saveData, result, evoInfo: this.evoInfo });
    }
  }
}

// ── 씬: 획득 결과 ─────────────────────────────────────────────────────────────
class ResultScene extends Phaser.Scene {
  constructor() { super('ResultScene'); }

  init(data) { this.saveData = data.saveData; this.result = data.result; this.evoInfo = data.evoInfo || null; }

  preload() { Utils.queuePetImages(this); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    // 결과 효과음
    Sound.play(this, this.result.type === 'pet' ? 'get' : 'coin', 0.6);

    if (this.result.type === 'pet') {
      const pet = this.result.pet;
      const gradeColors = { legend: '#fbbf24', rare: '#60a5fa', normal: '#d1d5db' };
      const gradeLabel  = { legend: '⭐⭐⭐ 전설', rare: '⭐⭐ 희귀', normal: '⭐ 일반' };

      this.add.text(width / 2, 80, pet.grade === 'legend' ? '🎉 전설 등장!!!' : pet.grade === 'rare' ? '✨ 희귀 펫 획득!' : '귀여운 펫이야!', {
        fontSize: '24px', fontFamily: 'Malgun Gothic', color: gradeColors[pet.grade],
      }).setOrigin(0.5);

      const texKey = Utils.petTexKey(pet.id, pet.level);
      let petSprite;
      if (this.textures.exists(texKey)) {
        petSprite = this.add.image(width / 2, height * 0.35, texKey);
        const src = this.textures.get(texKey).getSourceImage();
        petSprite.setScale(140 / src.height);
        this.tweens.add({ targets: petSprite, scale: petSprite.scale * 1.1, duration: 500, yoyo: true, repeat: -1 });
      } else {
        petSprite = this.add.text(width / 2, height * 0.35, '🐾', { fontSize: '90px' }).setOrigin(0.5);
        this.tweens.add({ targets: petSprite, scale: 1.15, duration: 400, yoyo: true, repeat: -1 });
      }

      this.add.text(width / 2, height * 0.55, pet.name, { fontSize: '28px', fontFamily: 'Malgun Gothic', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.62, gradeLabel[pet.grade], { fontSize: '16px', fontFamily: 'Malgun Gothic', color: gradeColors[pet.grade] }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.69, `Lv.${pet.level}  ATK ${pet.atk}  HP ${pet.hp}`, { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#c4b5fd' }).setOrigin(0.5);

      if (pet.grade === 'legend' || pet.grade === 'rare') this.spawnSparkles();
    } else {
      const itemData = PETS_DATA.items[this.result.item];
      this.add.text(width / 2, 100, '아이템 획득!', { fontSize: '26px', fontFamily: 'Malgun Gothic', color: '#4ade80' }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.4, this.result.item === 'heal' ? '💊' : '⭐', { fontSize: '90px' }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.6, itemData.name, { fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#ffffff' }).setOrigin(0.5);
      this.add.text(width / 2, height * 0.68, this.result.item === 'heal' ? 'HP +20 회복' : '죽은 펫을 살릴 수 있어요!', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);
    }

    // 다음 화면 이동 (진화가 있으면 진화 연출 먼저)
    const goNext = (targetScene) => {
      if (this.evoInfo) {
        this.scene.start('EvolveScene', { saveData: this.saveData, evoInfo: this.evoInfo, nextScene: targetScene });
      } else {
        this.scene.start(targetScene, { saveData: this.saveData });
      }
    };
    this.makeBtn(width / 2, height * 0.82, '또 부화하기 🥚', 0x7c3aed, () => goNext('MapScene'));
    this.makeBtn(width / 2, height * 0.91, '가방 보기', 0x312e81, () => goNext('BagScene'));
  }

  makeBtn(x, y, label, color, cb) {
    const bg = this.add.rectangle(x, y, 220, 42, color).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.add.text(x, y, label, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    bg.on('pointerdown', cb);
  }

  spawnSparkles() {
    const { width, height } = this.scale;
    const emojis = ['✨', '⭐', '💫', '🌟'];
    for (let i = 0; i < 10; i++) {
      this.time.delayedCall(i * 80, () => {
        const s = this.add.text(Phaser.Math.Between(60, width - 60), Phaser.Math.Between(100, 300), emojis[Phaser.Math.Between(0, 3)], { fontSize: '24px' });
        this.tweens.add({ targets: s, y: s.y - 80, alpha: 0, duration: 900, onComplete: () => s.destroy() });
      });
    }
  }
}

// ── 씬: 배틀 ─────────────────────────────────────────────────────────────────
class BattleScene extends Phaser.Scene {
  constructor() { super('BattleScene'); }

  init(data) {
    this.saveData  = data.saveData;
    this.wildPet   = data.wildPet;
    this.wildDataId = data.wildDataId;
    this.myPet     = this.saveData.bag.find(p => p.isActive && p.alive) || this.saveData.bag.find(p => p.alive);
    this.turn      = 'player';
    this.skillCooldown = 0;
    this.actionLocked = false;
  }

  preload() {
    Utils.queuePetImages(this);
  }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x0f0728).setOrigin(0);

    this.add.text(width / 2, 30, '⚔️ 배틀!', { fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);

    if (!this.myPet) {
      this.add.text(width / 2, height / 2, '살아있는 펫이 없어요!\n가방에서 펫을 살려주세요.', { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fb923c', align: 'center' }).setOrigin(0.5);
      this.time.delayedCall(2500, () => this.scene.start('BagScene', { saveData: this.saveData }));
      return;
    }

    this.drawBattle();
  }

  drawBattle() {
    const { width, height } = this.scale;

    this.children.removeAll();
    this.add.rectangle(0, 0, width, height, 0x0f0728).setOrigin(0);
    this.add.text(width / 2, 28, '⚔️ 배틀!', { fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);

    const legendMark = (p) => p.isLegend ? ' 👑' : '';

    this.add.text(width * 0.25, 72,  `야생 ${this.wildPet.name}${legendMark(this.wildPet)}`,  { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#fb923c' }).setOrigin(0.5);
    this.add.text(width * 0.25, 92, `Lv.${this.wildPet.level}  [${this.wildPet.type}]`, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setOrigin(0.5);
    this.drawBattlePet(width * 0.25, 145, this.wildPet, true);   // 야생: 왼쪽 바라봄(반전)
    this.drawHpBar(width * 0.25, 195, this.wildPet.hp, this.wildPet.maxHp, this.wildPet.atk, 0xe11d48);

    this.add.text(width * 0.75, 72,  `내 ${this.myPet.name}${legendMark(this.myPet)}`,     { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#60a5fa' }).setOrigin(0.5);
    this.add.text(width * 0.75, 92, `Lv.${this.myPet.level}  [${this.myPet.type}]`, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setOrigin(0.5);
    this.drawBattlePet(width * 0.75, 145, this.myPet, false);    // 내 펫: 오른쪽(기본)
    this.drawHpBar(width * 0.75, 195, this.myPet.hp, this.myPet.maxHp, this.myPet.atk, 0x2563eb);

    // 속성 상성 표시
    const adv = Utils.typeMultiplier(this.myPet, this.wildPet);
    let advText = '', advColor = '#9ca3af';
    if (this.wildPet.isLegend) { advText = '상대는 전설 — 상성 면역!'; advColor = '#fbbf24'; }
    else if (adv === 'advantage')    { advText = '내 속성이 효과적! 💪'; advColor = '#4ade80'; }
    else if (adv === 'disadvantage') { advText = '내 속성이 불리해요...'; advColor = '#fb7185'; }
    if (advText) this.add.text(width / 2, 218, advText, { fontSize: '12px', fontFamily: 'Malgun Gothic', color: advColor }).setOrigin(0.5);

    this.logText = this.add.text(width / 2, 240, this.turn === 'player' ? '행동을 선택하세요!' : '야생 펫의 턴...', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#e9d5ff', align: 'center',
    }).setOrigin(0.5);

    if (this.turn === 'player') this.drawActionButtons();
  }

  drawBattlePet(x, y, pet, flip) {
    const texKey = Utils.petTexKey(pet.id, pet.level);
    if (this.textures.exists(texKey)) {
      const img = this.add.image(x, y, texKey);
      const src = this.textures.get(texKey).getSourceImage();
      // 세로 90px 기준으로 비율 맞춤
      const scale = 90 / src.height;
      img.setScale(scale);
      if (flip) img.setFlipX(true);
      // 둥실 애니메이션
      this.tweens.add({ targets: img, y: y - 6, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    } else {
      // fallback 이모지
      this.add.text(x, y, flip ? '🐾' : '🐉', { fontSize: '56px' }).setOrigin(0.5);
    }
  }

  drawHpBar(x, y, hp, maxHp, atk, color) {
    const w = 120, h = 10;
    this.add.rectangle(x, y, w, h, 0x374151).setOrigin(0.5);
    const pct = Math.max(hp / maxHp, 0);
    if (pct > 0) this.add.rectangle(x - w / 2 + (w * pct) / 2, y, w * pct, h, color).setOrigin(0.5);
    this.add.text(x - 24, y + 14, `HP ${Math.max(hp,0)}/${maxHp}`, { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setOrigin(0.5);
    this.add.text(x + 46, y + 14, `ATK ${atk}`, { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#fbbf24' }).setOrigin(0.5);
  }

  drawActionButtons() {
    const { width, height } = this.scale;
    const c1=width*0.28, c2=width*0.72, bW=200, bH=48;
    const rows=[
      [{label:'⚔️ 공격',  key:'attack', color:0x7c3aed},{label:'🛡️ 방어', key:'defend',color:0x1d4ed8}],
      [{label:`💥 필살기${this.skillCooldown>0?` (${this.skillCooldown}턴)`:''}`,key:'skill',color:this.skillCooldown>0?0x374151:0x9d174d},{label:'🔄 펫 교체',key:'swap',color:0x065f46}],
      [{label:'🏃 도망',  key:'run',   color:0x374151},{label:'📊 상생표',key:'chart',color:0x312e81}],
    ];
    rows.forEach(([left,right],ri)=>{
      const y=height*0.50+ri*height*0.11;
      [left,right].forEach((a,ci)=>{
        const x=ci===0?c1:c2;
        const btn=this.add.rectangle(x,y,bW,bH,a.color).setOrigin(0.5);
        if(a.key==='skill'&&this.skillCooldown>0){
          this.add.text(x,y,a.label,{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#6b7280'}).setOrigin(0.5);
          return;
        }
        btn.setInteractive({useHandCursor:true});
        btn.setStrokeStyle(1,0xa855f7);
        this.add.text(x,y,a.label,{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#ffffff'}).setOrigin(0.5);
        btn.on('pointerdown',()=>{
          if(a.key==='chart'){ this.showTypeChartOverlay(); return; }
          if(a.key==='swap'){  this.showPetSwapInBattle(); return; }
          this.playerAction(a.key);
        });
      });
    });
  }

  playerAction(action) {
    // 0.5초 쿨다운: 연타는 가능하되 0.5초마다 한 번씩만 입력됨
    if (this.actionLocked) return;
    this.actionLocked = true;
    this.time.delayedCall(500, () => { this.actionLocked = false; });

    this.defending = false;

    if (action === 'run') {
      this.scene.start('MapScene', { saveData: this.saveData });
      return;
    }
    if (action === 'defend') {
      this.defending = true;
      this.showDamageLabel('🛡️ 방어 태세!', '#60a5fa');
      if (this.skillCooldown > 0) this.skillCooldown--;
      this.turn = 'enemy';
      this.time.delayedCall(700, () => this.enemyTurn());
      return;
    }

    const isSkill = action === 'skill' && this.skillCooldown === 0;
    const { damage, label } = Utils.calcDamage(this.myPet, this.wildPet, isSkill);

    Sound.play(this, 'attack', 0.5);   // 공격 효과음

    if (isSkill) this.skillCooldown = 3;
    else if (this.skillCooldown > 0) this.skillCooldown--;

    this.wildPet.hp = Math.max(this.wildPet.hp - damage, 0);
    this.showDamageLabel(`${label ? label + ' ' : ''}${damage} 데미지!`, label.includes('효과적') || label.includes('필살기') ? '#fbbf24' : '#ffffff');

    if (this.wildPet.hp <= 0) {
      this.time.delayedCall(700, () => this.battleWin());
      return;
    }

    this.turn = 'enemy';
    this.time.delayedCall(800, () => this.enemyTurn());
  }

  showDamageLabel(text, color) {
    const { width, height } = this.scale;
    const t = this.add.text(width / 2, height * 0.42, text, {
      fontSize: '20px', fontFamily: 'Malgun Gothic', color, fontStyle: 'bold',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setDepth(30);
    this.tweens.add({ targets: t, y: t.y - 40, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
  }

  enemyTurn() {
    const { damage, label } = Utils.calcDamage(this.wildPet, this.myPet, false);
    const finalDmg = this.defending ? Math.round(damage * PETS_DATA.battleRule.defendReduction) : damage;
    this.myPet.hp = Math.max(this.myPet.hp - finalDmg, 0);
    this.showDamageLabel(`적 공격! ${finalDmg} 데미지`, '#fb7185');

    if (this.myPet.hp <= 0) {
      this.myPet.alive = false;
      const nextPet = this.saveData.bag.find(p => p.alive && !p.isActive);
      if (nextPet) {
        this.time.delayedCall(700, () => this.scene.start('PetSwapScene', { saveData: this.saveData, wildPet: this.wildPet, wildDataId: this.wildDataId }));
        return;
      } else {
        this.time.delayedCall(700, () => this.battleLose());
        return;
      }
    }

    this.turn = 'player';
    this.time.delayedCall(700, () => this.drawBattle());
  }

  battleWin() {
    Sound.play(this, 'win', 0.6);   // 승리 효과음
    // 보스 처치 보너스: 코인 +100, 이름 정상화
    if (this.wildPet.isBoss) {
      this.saveData.coins += 100;
      this.wildPet.name = this.wildPet.name.replace('👑 보스 ', '');
      delete this.wildPet.isBoss;
    }
    // 전투 승리 보상: 동행 펫 경험치 +20
    let evoInfo = null;
    const fighter = this.myPet;
    if (fighter) {
      const r = Utils.applyXp(fighter, 20);
      if (r.evolved) evoInfo = { petId: fighter.id, name: fighter.name, level: fighter.level };
    }
    if (!this.saveData.collection.includes(this.wildPet.id)) this.saveData.collection.push(this.wildPet.id);
    if (this.saveData.bag.length < 20) {
      this.saveData.bag.push(this.wildPet);
      Save.save(this.saveData);
      this.scene.start('ResultScene', { saveData: this.saveData, result: { type: 'pet', pet: this.wildPet }, evoInfo });
    } else {
      // 가방 꽉 참 → 버리기 모드
      Save.save(this.saveData);
      this.scene.start('BagScene', { saveData: this.saveData, releaseMode: true, newPet: this.wildPet });
    }
  }

  battleLose() {
    // 패배 시 야생 펫 다시 살아남 (맵에 재등장)
    if (this.saveData.mapObjects && this.wildDataId !== undefined) {
      const wildData = this.saveData.mapObjects.wildPets.find(w => w.id === this.wildDataId);
      if (wildData) wildData.defeated = false;
    }
    Save.save(this.saveData);
    this.scene.start('MapScene', { saveData: this.saveData });
  }

  showPetSwapInBattle() {
    const { width, height } = this.scale;
    const alive = this.saveData.bag.filter(p => p.alive && p !== this.myPet);
    if (alive.length === 0) { this.showDamageLabel('교체할 펫이 없어요!', '#fb923c'); return; }
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.7).setDepth(30).setOrigin(0.5);
    const panel=this.add.rectangle(width/2,height/2,360,400,0x0f0728).setDepth(31).setOrigin(0.5);
    panel.setStrokeStyle(2,0x7c3aed);
    const title=this.add.text(width/2,height/2-175,'🔄 펫 교체 (교체 후 적 턴)',{fontSize:'16px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setDepth(32).setOrigin(0.5);
    const allObjs=[overlay,panel,title];
    alive.slice(0,6).forEach((pet,i)=>{
      const by=height/2-130+i*54;
      const btn=this.add.rectangle(width/2,by,300,46,0x2d1b69).setDepth(32).setOrigin(0.5).setInteractive({useHandCursor:true});
      btn.setStrokeStyle(1,0x7c3aed);
      const txt=this.add.text(width/2,by,`${pet.name} Lv.${pet.level}  HP ${pet.hp}/${pet.maxHp}  ATK ${pet.atk}`,{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setDepth(33).setOrigin(0.5);
      allObjs.push(btn,txt);
      btn.on('pointerdown',()=>{
        this.saveData.bag.forEach(p=>p.isActive=false);
        pet.isActive=true; this.myPet=pet;
        allObjs.forEach(o=>o.destroy());
        this.turn='enemy';
        this.time.delayedCall(400,()=>this.enemyTurn());
      });
    });
    const cBtn=this.add.rectangle(width/2,height/2+175,140,36,0x374151).setDepth(32).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height/2+175,'✕ 취소',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(33).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>allObjs.forEach(o=>o.destroy()));
  }

  showTypeChartOverlay() {
    const { width, height } = this.scale;
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.85).setDepth(40).setOrigin(0.5);
    const panel=this.add.rectangle(width/2,height/2,width-10,height-10,0x0f0728).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(1,0x7c3aed);
    const title=this.add.text(width/2,18,'📊 속성 상성표',{fontSize:'17px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setDepth(42).setOrigin(0.5);
    const sub=this.add.text(width/2,40,'효과적 ×1.5  |  불리 ×0.75  |  전설 면역',{fontSize:'10px',fontFamily:'Malgun Gothic',color:'#a78bfa'}).setDepth(42).setOrigin(0.5);
    const allObjs=[overlay,panel,title,sub];
    const chart=PETS_DATA.typeChart;
    const emoji={'불꽃':'🔥','물':'💧','풀':'🌿','전기':'⚡','얼음':'❄️','땅':'🏔️','바람':'🌪️','어둠':'🌑','에스퍼':'🔮','페어리':'🧚','빛':'✨','노말':'⭐'};
    const colors={'불꽃':'#f97316','물':'#3b82f6','풀':'#22c55e','전기':'#eab308','얼음':'#67e8f9','땅':'#a16207','바람':'#86efac','어둠':'#7c3aed','에스퍼':'#d8b4fe','페어리':'#f9a8d4','빛':'#fde047','노말':'#9ca3af'};
    let y=62;
    Object.keys(chart).forEach(type=>{
      const strong=chart[type];
      const box=this.add.rectangle(58,y,108,26,0x1e1145).setDepth(42).setOrigin(0.5);
      const tTxt=this.add.text(58,y,`${emoji[type]||''}${type}`,{fontSize:'12px',fontFamily:'Malgun Gothic',color:colors[type]||'#fff'}).setDepth(43).setOrigin(0.5);
      const arr=this.add.text(118,y,'▶',{fontSize:'11px',color:'#4ade80'}).setDepth(43).setOrigin(0.5);
      const vTxt=strong.length>0?strong.map(t=>`${emoji[t]||''}${t}`).join('  '):'없음';
      const vt=this.add.text(130,y,vTxt,{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#4ade80'}).setDepth(43).setOrigin(0,0.5);
      allObjs.push(box,tTxt,arr,vt);
      y+=30;
    });
    const cBtn=this.add.rectangle(width/2,height-22,140,32,0x374151).setDepth(42).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height-22,'✕ 닫기',{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(43).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>allObjs.forEach(o=>o.destroy()));
  }
}

// ── 씬: 펫 교체 ───────────────────────────────────────────────────────────────
class PetSwapScene extends Phaser.Scene {
  constructor() { super('PetSwapScene'); }

  init(data) { this.saveData = data.saveData; this.wildPet = data.wildPet; this.wildDataId = data.wildDataId; }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);
    this.add.text(width / 2, 60, '펫이 쓰러졌어요!', { fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#fb923c' }).setOrigin(0.5);
    this.add.text(width / 2, 100, '다음 펫을 선택하세요', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#a78bfa' }).setOrigin(0.5);

    const alive = this.saveData.bag.filter(p => p.alive);
    if (alive.length === 0) {
      this.add.text(width / 2, height / 2, '살아있는 펫이 없어요...', { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fb923c' }).setOrigin(0.5);
      this.time.delayedCall(2000, () => this.scene.start('MapScene', { saveData: this.saveData }));
      return;
    }

    alive.forEach((pet, i) => {
      const y = 200 + i * 80;
      const btn = this.add.rectangle(width / 2, y, 300, 60, 0x2d1b69).setOrigin(0.5).setInteractive({ useHandCursor: true });
      btn.setStrokeStyle(1, 0x7c3aed);
      this.add.text(width / 2, y, `${pet.name}  Lv.${pet.level}  HP ${pet.hp}/${pet.maxHp}`, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);
      btn.on('pointerdown', () => {
        this.saveData.bag.forEach(p => p.isActive = false);
        pet.isActive = true;
        this.scene.start('BattleScene', { saveData: this.saveData, wildPet: this.wildPet, wildDataId: this.wildDataId });
      });
    });
  }
}

// ── 씬: 가방 ─────────────────────────────────────────────────────────────────
class BagScene extends Phaser.Scene {
  constructor() { super('BagScene'); }

  init(data) {
    this.saveData    = data.saveData || Save.load();
    this.releaseMode = data.releaseMode || false;  // 버리기 모드
    this.newPet      = data.newPet || null;         // 가방 꽉 찼을 때 새 펫
    this.popupOpen   = false;                       // 팝업 표시 중 플래그
  }

  preload() { Utils.queuePetImages(this); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    if (this.releaseMode && this.newPet) {
      this.add.text(width/2, 28, '가방이 꽉 찼어요!', {fontSize:'20px',fontFamily:'Malgun Gothic',color:'#fb923c',fontStyle:'bold'}).setOrigin(0.5);
      this.add.text(width/2, 56, `새 펫: ${this.newPet.name} (Lv.${this.newPet.level})`, {fontSize:'14px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setOrigin(0.5);
      this.add.text(width/2, 78, '버릴 펫을 선택하세요 (길게 누르기)', {fontSize:'13px',fontFamily:'Malgun Gothic',color:'#a78bfa'}).setOrigin(0.5);
      this.renderPetCards(95, []);
      const skipBtn = this.add.rectangle(width/2, height-36, 220, 44, 0x374151).setOrigin(0.5).setInteractive({useHandCursor:true});
      this.add.text(width/2, height-36, '새 펫 포기하기', {fontSize:'15px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setOrigin(0.5);
      skipBtn.on('pointerdown', () => {
        if (!this.saveData.collection.includes(this.newPet.id)) this.saveData.collection.push(this.newPet.id);
        Save.save(this.saveData); this.scene.start('MapScene', {saveData:this.saveData});
      });
      return;
    }

    // ── 4개 탭 ──
    const tabDefs = [
      { label:`🐾 펫 ${this.saveData.bag.length}/20` },
      { label:`💊 아이템` },
      { label:`🎩 모자` },
      { label:`👟 신발` },
    ];
    const TW = Math.floor((width-16)/4);
    const tabBgs=[], tabTxts=[];
    tabDefs.forEach((t,i)=>{
      const x=8+TW/2+i*TW;
      const bg=this.add.rectangle(x,34,TW-4,28,i===0?0x5b21b6:0x1e1145).setOrigin(0.5).setInteractive({useHandCursor:true});
      bg.setStrokeStyle(1,i===0?0xe879f9:0x4c1d95);
      const tx=this.add.text(x,34,t.label,{fontSize:'11px',fontFamily:'Malgun Gothic',color:i===0?'#fff':'#a78bfa'}).setOrigin(0.5);
      tabBgs.push(bg); tabTxts.push(tx);
    });
    const helpTxt=this.add.text(width/2,64,'펫 클릭: 동행  |  길게 누르기: 버리기',{fontSize:'10px',fontFamily:'Malgun Gothic',color:'#6b7280'}).setOrigin(0.5);

    this.tabObjs=[];
    const switchTab=(idx)=>{
      this.tabObjs.forEach(o=>o.destroy()); this.tabObjs=[];
      tabBgs.forEach((b,i)=>{ b.setFillStyle(i===idx?0x5b21b6:0x1e1145); b.setStrokeStyle(1,i===idx?0xe879f9:0x4c1d95); });
      tabTxts.forEach((t,i)=>t.setColor(i===idx?'#fff':'#a78bfa'));
      helpTxt.setVisible(idx===0);
      if      (idx===0) this.renderPetCards(120, this.tabObjs);
      else if (idx===1) this.renderConsumableCards(120, this.tabObjs);
      else if (idx===2) this.renderCosmeticCards('hat',   100, this.tabObjs);
      else              this.renderCosmeticCards('shoes', 100, this.tabObjs);
    };
    switchTab(0);
    tabBgs.forEach((b,i)=>b.on('pointerdown',()=>switchTab(i)));

    // 하단 메뉴: 펫 강화 / 틀린문제 / 모험으로
    const fuseBtn=this.add.rectangle(width*0.22,height-36,118,42,0x6d28d9).setOrigin(0.5).setInteractive({useHandCursor:true});
    fuseBtn.setStrokeStyle(2,0xa855f7);
    this.add.text(width*0.22,height-36,'⚡ 펫 강화',{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#fff'}).setOrigin(0.5);
    fuseBtn.on('pointerdown',()=>this.showFuseMenu());

    const wrongCount=(this.saveData.wrongQuiz||[]).length;
    const retryBtn=this.add.rectangle(width*0.5,height-36,118,42,wrongCount>0?0xb45309:0x374151).setOrigin(0.5).setInteractive({useHandCursor:true});
    retryBtn.setStrokeStyle(2,wrongCount>0?0xfbbf24:0x4b5563);
    this.add.text(width*0.5,height-36,`📝 오답 ${wrongCount}`,{fontSize:'13px',fontFamily:'Malgun Gothic',color:wrongCount>0?'#fff':'#6b7280'}).setOrigin(0.5);
    retryBtn.on('pointerdown',()=>{
      if(wrongCount>0){ Save.save(this.saveData); this.scene.start('QuizScene',{saveData:this.saveData,retryMode:true}); }
      else this.showMsg('틀린 문제가 없어요!');
    });

    const backBtn=this.add.rectangle(width*0.78,height-36,118,42,0x4c1d95).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width*0.78,height-36,'← 모험',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#fff'}).setOrigin(0.5);
    backBtn.on('pointerdown',()=>{ Save.save(this.saveData); this.scene.start('MapScene',{saveData:this.saveData}); });
  }

  showFuseMenu() {
    const { width, height } = this.scale;
    // 같은 id가 2마리 이상인 펫만 강화 가능
    const idCount = {};
    this.saveData.bag.forEach(p => { idCount[p.id] = (idCount[p.id]||0) + 1; });
    const fusable = Object.keys(idCount).filter(id => idCount[id] >= 2);

    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.8).setDepth(50).setOrigin(0.5).setInteractive();
    const panel=this.add.rectangle(width/2,height/2,380,460,0x1a0a3e).setDepth(51).setOrigin(0.5);
    panel.setStrokeStyle(2,0xa855f7);
    const title=this.add.text(width/2,height/2-200,'⚡ 펫 강화',{fontSize:'20px',fontFamily:'Malgun Gothic',color:'#c4b5fd'}).setDepth(52).setOrigin(0.5);
    const sub=this.add.text(width/2,height/2-174,'같은 펫 2마리 → 1마리 + 경험치\n성공 확률 70% (실패해도 재료 소모)',{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#a78bfa',align:'center'}).setDepth(52).setOrigin(0.5);
    const allObjs=[overlay,panel,title,sub];

    if(fusable.length===0){
      allObjs.push(this.add.text(width/2,height/2,'같은 펫이 2마리 이상\n있어야 강화할 수 있어요!',{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fb923c',align:'center'}).setDepth(52).setOrigin(0.5));
    } else {
      fusable.slice(0,7).forEach((id,i)=>{
        const sample=this.saveData.bag.find(p=>p.id===id);
        const by=height/2-130+i*44;
        const btn=this.add.rectangle(width/2,by,330,38,0x4c1d95).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
        btn.setStrokeStyle(1,0x7c3aed);
        const txt=this.add.text(width/2,by,`${sample.name}  ×${idCount[id]}마리`,{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setDepth(53).setOrigin(0.5);
        allObjs.push(btn,txt);
        btn.on('pointerdown',()=>{ allObjs.forEach(o=>o.destroy()); this.doFuse(id); });
      });
    }
    const cBtn=this.add.rectangle(width/2,height/2+200,150,38,0x374151).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2,height/2+200,'✕ 닫기',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(53).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown',()=>allObjs.forEach(o=>o.destroy()));
  }

  doFuse(id) {
    // 같은 id 2마리 찾기: 동행 펫은 보존 우선, 재료는 비동행 우선
    const sameList = this.saveData.bag.filter(p => p.id === id);
    // 강화 대상(남길 펫) = 레벨 가장 높은 것, 재료 = 그 다음
    sameList.sort((a,b) => b.level - a.level);
    const keep = sameList[0];
    const material = sameList[1];

    // 재료 제거
    const matIdx = this.saveData.bag.indexOf(material);
    this.saveData.bag.splice(matIdx, 1);

    const success = Math.random() < 0.7;
    if (success) {
      const xpGain = Utils.randInt(20, 30);
      const r = Utils.applyXp(keep, xpGain);
      if (typeof Sound !== 'undefined') Sound.play(this, 'win', 0.5);
      Save.save(this.saveData);
      const evolved = r.evolved;
      this.showFuseResult(true, keep, xpGain, evolved);
    } else {
      if (typeof Sound !== 'undefined') Sound.play(this, 'click', 0.4);
      Save.save(this.saveData);
      this.showFuseResult(false, keep, 0, false);
    }
  }

  showFuseResult(success, pet, xpGain, evolved) {
    const { width, height } = this.scale;
    this.popupOpen = true;   // 팝업 열림 → 펫 카드 클릭 차단
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.85).setDepth(60).setOrigin(0.5).setInteractive();
    const panel=this.add.rectangle(width/2,height/2,340,300,success?0x14532d:0x3a1f1f).setDepth(61).setOrigin(0.5);
    panel.setStrokeStyle(3,success?0x4ade80:0xef4444);
    const allObjs=[overlay,panel];
    allObjs.push(this.add.text(width/2,height/2-100,success?'⚡ 강화 성공!':'💥 강화 실패...',{fontSize:'26px',fontFamily:'Malgun Gothic',color:success?'#4ade80':'#fb7185',fontStyle:'bold'}).setDepth(62).setOrigin(0.5));

    const texKey=Utils.petTexKey(pet.id,pet.level);
    if(this.textures.exists(texKey)){
      const img=this.add.image(width/2,height/2-20,texKey).setDepth(62);
      img.setScale(90/this.textures.get(texKey).getSourceImage().height);
      allObjs.push(img);
    } else {
      allObjs.push(this.add.text(width/2,height/2-20,'🐾',{fontSize:'60px'}).setDepth(62).setOrigin(0.5));
    }

    if(success){
      allObjs.push(this.add.text(width/2,height/2+45,`경험치 +${xpGain} 획득!`,{fontSize:'16px',fontFamily:'Malgun Gothic',color:'#fbbf24'}).setDepth(62).setOrigin(0.5));
      if(evolved) allObjs.push(this.add.text(width/2,height/2+68,`✨ Lv.${pet.level} 진화!`,{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#e879f9'}).setDepth(62).setOrigin(0.5));
    } else {
      allObjs.push(this.add.text(width/2,height/2+45,'재료 펫만 사라졌어요',{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#fca5a5'}).setDepth(62).setOrigin(0.5));
    }

    const okBtn=this.add.rectangle(width/2,height/2+110,150,40,0x4c1d95).setDepth(62).setOrigin(0.5).setInteractive({useHandCursor:true});
    const okTxt=this.add.text(width/2,height/2+110,'확인',{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fff'}).setDepth(63).setOrigin(0.5);
    allObjs.push(okBtn, okTxt);
    okBtn.on('pointerdown',()=>{
      allObjs.forEach(o=>o.destroy());
      // 한 박자 늦게 재시작 → 같은 클릭이 펫 카드 pointerup으로 전파되는 것 방지
      this.time.delayedCall(80, () => this.scene.restart({saveData:this.saveData}));
    });
  }

  renderPetCards(startY, objs) {
    this.saveData.bag.forEach((pet, i) => {
      const col=i%3, row=Math.floor(i/3);
      const x=80+col*140, y=startY+row*96;
      const isActive=pet.isActive;
      const bg=this.add.rectangle(x,y,122,84,isActive?0x5b21b6:pet.alive?0x2d1b69:0x1f1f2e).setOrigin(0.5).setInteractive({useHandCursor:true});
      bg.setStrokeStyle(2,isActive?0xe879f9:pet.alive?0x4c1d95:0x374151);
      const gc={legend:'#fbbf24',rare:'#60a5fa',normal:'#9ca3af'};
      const d =this.add.text(x-44,y-30,pet.alive?'●':'💀',{fontSize:'12px',color:gc[pet.grade]||'#9ca3af'}).setOrigin(0.5);
      // 작은 펫 썸네일 (카드 좌측)
      const texKey = Utils.petTexKey(pet.id, pet.level);
      let thumb=null;
      if (pet.alive && this.textures.exists(texKey)) {
        thumb = this.add.image(x-44, y+4, texKey);
        const src = this.textures.get(texKey).getSourceImage();
        thumb.setScale(34/src.height);
      }
      const nT=this.add.text(x+8,y-15,pet.name.length>6?pet.name.slice(0,6)+'...':pet.name,{fontSize:'12px',fontFamily:'Malgun Gothic',color:pet.alive?'#e9d5ff':'#6b7280'}).setOrigin(0.5);
      const aT=this.add.text(x+8,y,`Lv.${pet.level}  ATK${pet.atk}`,{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setOrigin(0.5);
      const hT=this.add.text(x+8,y+14,`HP ${pet.hp}/${pet.maxHp}`,{fontSize:'10px',fontFamily:'Malgun Gothic',color:'#6b7280'}).setOrigin(0.5);
      const bW=100,bH=5,bY=y+28;
      const bBg=this.add.rectangle(x,bY,bW,bH,0x1a1a2e).setOrigin(0.5);
      const xPct=Math.max(0,Math.min(pet.xp/pet.xpToNext,1));
      const bFg=xPct>0?this.add.rectangle(x-bW/2+(bW*xPct)/2,bY,bW*xPct,bH,0xfbbf24).setOrigin(0.5):null;
      const xT=this.add.text(x,bY+8,`XP ${pet.xp}/${pet.xpToNext}`,{fontSize:'8px',fontFamily:'Malgun Gothic',color:'#a78bfa'}).setOrigin(0.5);
      objs.push(bg,d,nT,aT,hT,bBg,xT); if(bFg) objs.push(bFg); if(thumb) objs.push(thumb);
      let ht=null, longPressed=false;
      bg.on('pointerdown',()=>{
        longPressed=false;
        ht=this.time.delayedCall(600,()=>{ longPressed=true; this.confirmRelease(pet); });
      });
      bg.on('pointerup', ()=>{
        if(ht){ht.remove();ht=null;}
        if(longPressed || this.releaseMode || this.popupOpen) return;
        this.showPetDetail(pet);   // 짧은 클릭 → 상세 팝업
      });
      bg.on('pointerout',()=>{if(ht){ht.remove();ht=null;}});
    });
  }

  showPetDetail(pet) {
    const { width, height } = this.scale;
    this.popupOpen = true;   // 팝업 열림 → 뒤 펫 카드 클릭 차단
    const overlay=this.add.rectangle(width/2,height/2,width,height,0x000000,0.8).setDepth(50).setOrigin(0.5).setInteractive();
    const panel=this.add.rectangle(width/2,height/2,340,440,0x1a0a3e).setDepth(51).setOrigin(0.5);
    const gradeBorder={legend:0xfbbf24,rare:0x60a5fa,normal:0xa855f7};
    panel.setStrokeStyle(3,gradeBorder[pet.grade]||0xa855f7);
    const allObjs=[overlay,panel];

    // 등급 라벨
    const gradeLabel={legend:'⭐⭐⭐ 전설',rare:'⭐⭐ 희귀',normal:'⭐ 일반'};
    const gradeColor={legend:'#fbbf24',rare:'#60a5fa',normal:'#d1d5db'};
    allObjs.push(this.add.text(width/2,height/2-190,gradeLabel[pet.grade]||'',{fontSize:'14px',fontFamily:'Malgun Gothic',color:gradeColor[pet.grade]}).setDepth(52).setOrigin(0.5));

    // 큰 펫 이미지
    const texKey=Utils.petTexKey(pet.id,pet.level);
    if(pet.alive && this.textures.exists(texKey)){
      const img=this.add.image(width/2,height/2-70,texKey).setDepth(52);
      const src=this.textures.get(texKey).getSourceImage();
      img.setScale(170/src.height);
      allObjs.push(img);
    } else {
      allObjs.push(this.add.text(width/2,height/2-70,pet.alive?'🐾':'💀',{fontSize:'90px'}).setDepth(52).setOrigin(0.5));
    }

    // 정보
    allObjs.push(this.add.text(width/2,height/2+40,pet.name,{fontSize:'22px',fontFamily:'Malgun Gothic',color:'#fff',fontStyle:'bold'}).setDepth(52).setOrigin(0.5));
    allObjs.push(this.add.text(width/2,height/2+68,`[${pet.type}]  Lv.${pet.level}`,{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#c4b5fd'}).setDepth(52).setOrigin(0.5));
    allObjs.push(this.add.text(width/2,height/2+92,`ATK ${pet.atk}   HP ${pet.hp}/${pet.maxHp}`,{fontSize:'14px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(52).setOrigin(0.5));
    allObjs.push(this.add.text(width/2,height/2+114,`XP ${pet.xp}/${pet.xpToNext}`,{fontSize:'12px',fontFamily:'Malgun Gothic',color:'#a78bfa'}).setDepth(52).setOrigin(0.5));

    const isActive = pet.isActive && pet.alive;

    // 선택(동행) 버튼
    const selBg=this.add.rectangle(width/2-75,height/2+165,140,44,isActive?0x4c1d95:0x16a34a).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    selBg.setStrokeStyle(2,isActive?0x6b7280:0x4ade80);
    const selTxt=this.add.text(width/2-75,height/2+165,isActive?'이미 동행중':'✓ 선택하기',{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#fff'}).setDepth(53).setOrigin(0.5);
    allObjs.push(selBg,selTxt);

    // 닫기 버튼
    const closeBg=this.add.rectangle(width/2+75,height/2+165,140,44,0x374151).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    const closeTxt=this.add.text(width/2+75,height/2+165,'✕ 닫기',{fontSize:'15px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setDepth(53).setOrigin(0.5);
    allObjs.push(closeBg,closeTxt);

    const closeAll=()=>{
      allObjs.forEach(o=>o.destroy());
      // 같은 클릭의 pointerup이 뒤 펫 카드에 닿지 않도록 잠깐 차단 유지
      this.time.delayedCall(120, () => { this.popupOpen = false; });
    };
    overlay.on('pointerdown',closeAll);
    closeBg.on('pointerdown',closeAll);

    selBg.on('pointerdown',()=>{
      if(!pet.alive){
        // 쓰러진 펫 → 소환 아이템으로 부활
        if(this.saveData.items.revive>0){
          this.saveData.items.revive--; pet.alive=true; pet.hp=pet.maxHp;
          Save.save(this.saveData); closeAll(); this.scene.restart({saveData:this.saveData});
        } else this.showMsg('소환 아이템이 없어요!');
        return;
      }
      if(isActive){ closeAll(); return; }
      this.saveData.bag.forEach(p=>p.isActive=false);
      pet.isActive=true; this.saveData.activePetId=pet.id;
      if(typeof Sound!=='undefined') Sound.play(this,'click',0.4);
      Save.save(this.saveData); closeAll(); this.scene.restart({saveData:this.saveData});
    });

    // 쓰러진 펫이면 선택 버튼 텍스트 변경
    if(!pet.alive){ selTxt.setText('⭐ 살리기'); selBg.setFillStyle(0xb45309); }
  }

    const defs=[
      {key:'heal',   emoji:'💊',name:'체력 회복', desc:'펫 HP +20 회복'},
      {key:'revive', emoji:'⭐',name:'소환 아이템',desc:'쓰러진 펫을 살림'},
      {key:'rainbowFragment', emoji:'🌈',name:'무지개 조각', desc:'10개 모으면 수정 완성'},

      const bg=this.add.rectangle(x,y,200,140,count>0?0x14532d:0x1f2937).setOrigin(0.5);
      bg.setStrokeStyle(2,count>0?0x4ade80:0x374151);
      const eT=this.add.text(x,y-48,def.emoji,{fontSize:'38px'}).setOrigin(0.5);
      const nT=this.add.text(x,y-4, def.name,{fontSize:'13px',fontFamily:'Malgun Gothic',color:'#e9d5ff'}).setOrigin(0.5);
      const dT=this.add.text(x,y+14,def.desc,{fontSize:'11px',fontFamily:'Malgun Gothic',color:'#9ca3af'}).setOrigin(0.5);
      const cT=this.add.text(x,y+32,`${count}개 / 10개`,{fontSize:'13px',fontFamily:'Malgun Gothic',color:count>0?'#4ade80':'#6b7280',fontStyle:'bold'}).setOrigin(0.5);
      objs.push(bg,eT,nT,dT,cT);
      // 사용하기 버튼
      const useBg=this.add.rectangle(x,y+58,150,30,count>0?0x16a34a:0x374151).setOrigin(0.5);
      const useTxt=this.add.text(x,y+58,count>0?'사용하기':'없음',{fontSize:'13px',fontFamily:'Malgun Gothic',color:count>0?'#fff':'#6b7280'}).setOrigin(0.5);
      objs.push(useBg,useTxt);
      if(count>0){
        useBg.setInteractive({useHandCursor:true});
        useBg.on('pointerdown',()=>this.useConsumable(def.key));
      }
    });
