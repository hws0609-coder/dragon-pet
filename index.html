<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>드래곤 펫</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a0a3e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
#game-container { width: 600px; height: 800px; position: relative; }
canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"></div>
<script>
// ── 전역 데이터 ──────────────────────────────────────────────────────────────
let PETS_DATA = null;
let QUIZ_DATA = null;

async function loadPetsData() {
  const res = await fetch('data/pets.json');
  PETS_DATA = await res.json();
  const qres = await fetch('data/quiz.json');
  QUIZ_DATA = await qres.json();
}

// ── 사운드 매니저 ─────────────────────────────────────────────────────────────
// 음원 파일이 없어도 게임은 정상 작동 (조용히 skip)
const SOUND_KEYS = {
  click:  'assets/sounds/click.mp3',
  hatch:  'assets/sounds/hatch.mp3',
  attack: 'assets/sounds/attack.mp3',
  win:    'assets/sounds/win.mp3',
  get:    'assets/sounds/get.mp3',
  coin:   'assets/sounds/coin.mp3',
  bgm:    'assets/sounds/bgm.mp3',          // 타이틀/기본 BGM
  bgm1:   'assets/sounds/bgm-zone1.mp3',    // 얼음
  bgm2:   'assets/sounds/bgm-zone2.mp3',    // 숲
  bgm3:   'assets/sounds/bgm-zone3.mp3',    // 불
  bgm4:   'assets/sounds/bgm-zone4.mp3',    // 동굴
  bgm5:   'assets/sounds/bgm-zone5.mp3',    // 마을
  bgm6:   'assets/sounds/bgm-zone6.mp3',    // 사막
  bgm7:   'assets/sounds/bgm-zone7.mp3',    // 구름
  bgm8:   'assets/sounds/bgm-zone8.mp3',    // 무지개
  bgm9:   'assets/sounds/bgm-zone9.mp3',    // 오로라
  thunder:'assets/sounds/thunder.mp3',      // 번개
};

const Sound = {
  bgmInstance: null,
  currentBgmKey: null,   // 현재 재생 중인 BGM 트랙 키

  // 각 씬 preload()에서 호출 — 음원을 로드 큐에 등록
  queue(scene) {
    Object.entries(SOUND_KEYS).forEach(([key, path]) => {
      if (!scene.cache.audio.exists(key)) {
        scene.load.audio(key, path);
      }
    });
  },

  // 효과음 재생 (음소거 설정·파일 유무 자동 체크)
  play(scene, key, volume = 0.5) {
    try {
      if (Save.load().muted) return;
      if (scene.cache.audio.exists(key)) {
        scene.sound.play(key, { volume });
      }
    } catch (e) { /* 음원 없으면 무시 */ }
  },

  // 배경음악 재생. key를 지정하면 해당 트랙, 없으면 'bgm'(기본)
  // 트랙이 아직 로드 안 됐으면 로드 후 재생
  playBGM(scene, keyOrVolume, volume = 0.25) {
    try {
      if (Save.load().muted) return;
      let key = 'bgm';
      if (typeof keyOrVolume === 'string') key = keyOrVolume;
      else if (typeof keyOrVolume === 'number') volume = keyOrVolume;

      const startTrack = (k) => {
        if (Save.load().muted) return;
        if (this.bgmInstance && this.bgmInstance.isPlaying && this.currentBgmKey === k) return;
        this.stopBGM();
        this.bgmInstance = scene.sound.add(k, { volume, loop: true });
        this.bgmInstance.play();
        this.currentBgmKey = k;
      };

      // 1) 이미 로드돼 있으면 바로 재생
      if (scene.cache.audio.exists(key)) { startTrack(key); return; }

      // 2) 아직 로드 안 됐으면 → 동적으로 로드 후 재생
      const path = SOUND_KEYS[key];
      if (path) {
        scene.load.audio(key, path);
        scene.load.once('complete', () => {
          if (scene.cache.audio.exists(key)) startTrack(key);
          else if (scene.cache.audio.exists('bgm')) startTrack('bgm'); // 파일 없으면 기본
        });
        scene.load.start();
        return;
      }

      // 3) 경로조차 없으면 기본 bgm 시도
      if (scene.cache.audio.exists('bgm')) startTrack('bgm');
    } catch (e) { /* 무시 */ }
  },

  // 지역 번호로 BGM 재생 (1~9)
  playZoneBGM(scene, zoneId, volume = 0.25) {
    this.playBGM(scene, `bgm${zoneId}`, volume);
  },

  stopBGM() {
    try { if (this.bgmInstance) { this.bgmInstance.stop(); this.bgmInstance = null; this.currentBgmKey = null; } }
    catch (e) { /* 무시 */ }
  },

  toggleMute() {
    const data = Save.load();
    data.muted = !data.muted;
    Save.save(data);
    if (data.muted) this.stopBGM();
    return data.muted;
  },
};

// ── 유틸 ─────────────────────────────────────────────────────────────────────
const Utils = {
  randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); },

  getImgForLevel(pet, level) {
    // 레벨별 5단계 이미지 (lv1~lv5, 6레벨 이상은 lv5)
    if (level <= 1) return pet.img.lv1;
    if (level === 2) return pet.img.lv2;
    if (level === 3) return pet.img.lv3;
    if (level === 4) return pet.img.lv4;
    return pet.img.lv5;
  },

  // 펫 텍스처 키 (Phaser 로드용): "petimg-{id}-lv{n}"
  petTexKey(petId, level) {
    const lv = level <= 1 ? 1 : level >= 5 ? 5 : level;
    return `petimg-${petId}-lv${lv}`;
  },

  // 모든 펫 이미지(20마리×5단계)를 scene.load 큐에 등록. 이미 있으면 skip.
  queuePetImages(scene) {
    if (!PETS_DATA || !PETS_DATA.pets) return;
    PETS_DATA.pets.forEach(pet => {
      for (let lv = 1; lv <= 5; lv++) {
        const key = `petimg-${pet.id}-lv${lv}`;
        if (!scene.textures.exists(key) && pet.img && pet.img[`lv${lv}`]) {
          scene.load.image(key, pet.img[`lv${lv}`]);
        }
      }
    });
  },

  // 레벨별 스탯 계산 (6레벨 이상 무한 지원)
  getLevelStats(level) {
    const rule = PETS_DATA.levelRule;
    if (level <= rule.maxFixed) {
      return PETS_DATA.levels[String(level)];
    }
    // 6레벨 이상: 5레벨 기준 + 추가
    const base = PETS_DATA.levels[String(rule.maxFixed)];
    const extra = level - rule.maxFixed;
    return {
      xpToNext: rule.xpPerLevelAfter5,
      atkMin: base.atkMin + extra * rule.atkPerLevelAfter5,
      atkMax: base.atkMax + extra * rule.atkPerLevelAfter5,
      hp: base.hp + extra * rule.hpPerLevelAfter5,
    };
  },

  buildPetInstance(petData, level) {
    const lvData = Utils.getLevelStats(level);
    return {
      id: petData.id,
      name: petData.name,
      grade: petData.grade,
      type: petData.type,
      img: petData.img,
      isLegend: petData.isLegend,
      level,
      xp: 0,
      xpToNext: lvData.xpToNext,
      atk: Utils.randInt(lvData.atkMin, lvData.atkMax),
      hp: lvData.hp,
      maxHp: lvData.hp,
      alive: true,
      isActive: false,
    };
  },

  // 진화 단계 (이미지가 바뀌는 레벨 구간: 1,2,3,4,5+)
  evoStage(level) {
    return level >= 5 ? 5 : level;
  },

  // 펫에게 XP 부여 → 레벨업 처리. { leveledUp, evolved, fromLevel, toLevel } 반환
  applyXp(pet, xpGain) {
    const fromLevel = pet.level;
    const fromStage = Utils.evoStage(pet.level);
    pet.xp += xpGain;
    let leveledUp = false;
    while (pet.xp >= pet.xpToNext) {
      pet.xp -= pet.xpToNext;
      pet.level++;
      const lvData = Utils.getLevelStats(pet.level);
      pet.xpToNext = lvData.xpToNext;
      pet.atk = Utils.randInt(lvData.atkMin, lvData.atkMax);
      pet.maxHp = lvData.hp;
      pet.hp = lvData.hp;
      leveledUp = true;
    }
    const evolved = Utils.evoStage(pet.level) > fromStage;
    return { leveledUp, evolved, fromLevel, toLevel: pet.level };
  },

  // 속성 상성 배율 계산
  // attacker가 defender를 공격할 때의 배율 반환
  typeMultiplier(attacker, defender) {
    // 방어자가 전설이면 상성 면역 (항상 1.0)
    if (defender.isLegend) return 1.0;
    const chart = PETS_DATA.typeChart;
    const strongAgainst = chart[attacker.type] || [];
    if (strongAgainst.includes(defender.type)) return 'advantage';
    // 역상성 체크 (방어자 속성이 공격자를 이기면 불리)
    const defenderStrong = chart[defender.type] || [];
    if (defenderStrong.includes(attacker.type)) return 'disadvantage';
    return 'normal';
  },

  // 최종 데미지 계산
  calcDamage(attacker, defender, isSkill) {
    const rule = PETS_DATA.battleRule;
    const typeResult = Utils.typeMultiplier(attacker, defender);
    let mult = 1.0;
    let label = '';

    if (isSkill && typeResult === 'advantage') {
      mult = rule.skillAndAdvantage; // 1.8 (곱연산 방지)
      label = '필살기 + 효과적!';
    } else if (isSkill) {
      mult = rule.skillMultiplier; // 1.5
      label = '필살기!';
      if (typeResult === 'disadvantage') { mult *= rule.typeDisadvantage; label = '필살기 (효과 약함)'; }
    } else if (typeResult === 'advantage') {
      mult = rule.typeAdvantage; // 1.5
      label = '효과적!';
    } else if (typeResult === 'disadvantage') {
      mult = rule.typeDisadvantage; // 0.75
      label = '효과 약함...';
    }
    return { damage: Math.round(attacker.atk * mult), label };
  },

  gacha() {
    const r = Math.random();
    let grade = 'normal';
    if (r < PETS_DATA.gachaProb.legend) grade = 'legend';
    else if (r < PETS_DATA.gachaProb.legend + PETS_DATA.gachaProb.rare) grade = 'rare';
    const pool = PETS_DATA.pets.filter(p => p.grade === grade);
    return pool[Math.floor(Math.random() * pool.length)];
  },

  hatchResult() {
    const r = Math.random();
    if (r < 0.30) {
      const itemR = Math.random();
      return { type: 'item', item: itemR < 0.80 ? 'heal' : 'revive' };
    }
    const petData = Utils.gacha();
    const lvR = Math.random();
    const level = lvR < 0.02 ? 3 : lvR < 0.10 ? 2 : 1;
    return { type: 'pet', pet: Utils.buildPetInstance(petData, level) };
  },

  pickWildPets(zoneId) {
    const zone = PETS_DATA.zones.find(z => z.id === zoneId);
    const result = [];
    for (let i = 0; i < 2; i++) {
      // 보스 펫: 5% 확률, 레벨 4~5의 강한 펫
      const isBoss = Math.random() < 0.05;
      if (isBoss) {
        // 보스는 전설 우선, 없으면 야생풀에서
        const bossId = zone.legendPet || zone.wildPool[Math.floor(Math.random() * zone.wildPool.length)];
        const petData = PETS_DATA.pets.find(p => p.id === bossId);
        const level = Utils.randInt(4, 5);
        const boss = Utils.buildPetInstance(petData, level);
        boss.isBoss = true;
        boss.name = '👑 보스 ' + boss.name;
        // 보스 스탯 강화 (HP 2배, ATK 2배)
        boss.maxHp = Math.round(boss.maxHp * 2);
        boss.hp = boss.maxHp;
        boss.atk = Math.round(boss.atk * 2);
        result.push(boss);
        continue;
      }
      const isLegend = zone.legendPet && Math.random() < 0.05;
      const petId = isLegend
        ? zone.legendPet
        : zone.wildPool[Math.floor(Math.random() * zone.wildPool.length)];
      const petData = PETS_DATA.pets.find(p => p.id === petId);
      const level = Utils.randInt(2, 3);
      result.push(Utils.buildPetInstance(petData, level));
    }
    return result;
  },
};

// ── 저장/불러오기 ─────────────────────────────────────────────────────────────
const Save = {
  key: 'dragon_pet_save',
  defaultData() {
    return {
      grade: null, character: null,
      bag: [], activePetId: null,
      collection: [],
      maxLevels: {},
      items: { heal: 0, revive: 0, rainbowFragment: 0, rainbowCrystal: 0 },
      coins: 40,
      cosmetics: { owned: [], equipped: { hat: null, shoes: null } },
      mapProgress: { zone: 1, x: 0 },
      mapObjects: null,
      muted: false,
      wrongQuiz: [],
    };
  },
  // 기존 저장 데이터에 새 필드 보강
  migrate(data) {
    if (data.coins === undefined) data.coins = 0;
    if (data.muted === undefined) data.muted = false;
    if (!data.wrongQuiz) data.wrongQuiz = [];
    if (!data.maxLevels) data.maxLevels = {};
    if (!data.cosmetics) data.cosmetics = { owned: [], equipped: { hat: null, shoes: null } };
    if (data.cosmetics.equipped.shoes === undefined) data.cosmetics.equipped.shoes = null;
    if (data.items.rainbowFragment === undefined) data.items.rainbowFragment = 0;
    if (data.items.rainbowCrystal === undefined) data.items.rainbowCrystal = 0;
    return data;
  },
  load() {
    try {
      const data = JSON.parse(localStorage.getItem(this.key));
      return data ? this.migrate(data) : this.defaultData();
    }
    catch { return this.defaultData(); }
  },
  save(data) {
    // 가방 펫들의 최고 도달 레벨 기록 (도감 표시용)
    try {
      if (!data.maxLevels) data.maxLevels = {};
      if (Array.isArray(data.bag)) {
        data.bag.forEach(p => {
          if (!data.maxLevels[p.id] || p.level > data.maxLevels[p.id]) {
            data.maxLevels[p.id] = p.level;
          }
        });
      }
    } catch {}
    try { localStorage.setItem(this.key, JSON.stringify(data)); } catch {}
  },
  clear() { localStorage.removeItem(this.key); },
};

// ── 씬: 타이틀 ───────────────────────────────────────────────────────────────
class TitleScene extends Phaser.Scene {
  constructor() { super('TitleScene'); }

  preload() {
    Sound.queue(this);   // 모든 효과음·BGM 전역 로드 (1회)
  }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    // 첫 사용자 상호작용 후 BGM 시작 (브라우저 자동재생 정책)
    this.input.once('pointerdown', () => Sound.playBGM(this));

    for (let i = 0; i < 40; i++) {
      const x = Phaser.Math.Between(0, width);
      const y = Phaser.Math.Between(0, height);
      const s = Phaser.Math.Between(1, 3);
      const star = this.add.circle(x, y, s, 0xffffff, Phaser.Math.FloatBetween(0.3, 1));
      this.tweens.add({ targets: star, alpha: 0.1, duration: Phaser.Math.Between(800, 2000), yoyo: true, repeat: -1 });
    }

    const dragon = this.add.text(width / 2, height * 0.28, '🐉', { fontSize: '80px' }).setOrigin(0.5);
    this.tweens.add({ targets: dragon, y: dragon.y - 12, duration: 1500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    this.add.text(width / 2, height * 0.45, '드래곤 펫', {
      fontSize: '42px', fontFamily: 'Malgun Gothic', color: '#ffffff',
      stroke: '#7c3aed', strokeThickness: 6,
    }).setOrigin(0.5);

    this.add.text(width / 2, height * 0.55, '알을 부화시키고 펫을 모아보자!', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#c4b5fd',
    }).setOrigin(0.5);

    const saveData = Save.load();
    const hasData = saveData.character !== null;

    this.makeBtn(width / 2, height * 0.68, '게임 시작 ▶', 0x7c3aed, () => {
      this.scene.start('GradeScene');
    });

    if (hasData) {
      this.makeBtn(width / 2, height * 0.78, '이어하기', 0x4c1d95, () => {
        this.scene.start('MapScene', { saveData });
      });
    }

    this.makeBtn(width / 2 - 75, height * 0.88, '도감', 0x312e81, () => {
      this.scene.start('CollectionScene');
    });
    // 세이브/불러오기 버튼
    const saveBtn = this.add.rectangle(width / 2 + 75, height * 0.88, 130, 46, 0x065f46).setOrigin(0.5).setInteractive({ useHandCursor: true });
    saveBtn.setStrokeStyle(2, 0x10b981);
    this.add.text(width / 2 + 75, height * 0.88, '💾 저장/불러오기', { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#fff' }).setOrigin(0.5);
    saveBtn.on('pointerdown', () => this.showSaveMenu());

    // 음소거 토글 버튼 (우측 상단)
    this.muteBtn = this.add.text(width - 30, 30, Save.load().muted ? '🔇' : '🔊', { fontSize: '28px' })
      .setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.muteBtn.on('pointerdown', () => {
      const muted = Sound.toggleMute();
      this.muteBtn.setText(muted ? '🔇' : '🔊');
      if (!muted) Sound.playBGM(this);
    });
  }

  showSaveMenu() {
    const { width, height } = this.scale;
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.85).setDepth(50).setOrigin(0.5).setInteractive();
    const panel = this.add.rectangle(width/2, height/2, 400, 380, 0x0f2a1f).setDepth(51).setOrigin(0.5);
    panel.setStrokeStyle(2, 0x10b981);
    const title = this.add.text(width/2, height/2-150, '💾 저장 / 불러오기', { fontSize:'20px', fontFamily:'Malgun Gothic', color:'#10b981' }).setDepth(52).setOrigin(0.5);
    const desc = this.add.text(width/2, height/2-118, '저장 코드를 복사해 메모장에 보관하세요.\n다른 기기에서 붙여넣어 불러올 수 있어요.', { fontSize:'11px', fontFamily:'Malgun Gothic', color:'#86efac', align:'center' }).setDepth(52).setOrigin(0.5);
    const allObjs = [overlay, panel, title, desc];

    // 저장 코드 만들기
    const saveBtn = this.add.rectangle(width/2, height/2-55, 320, 50, 0x16a34a).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    saveBtn.setStrokeStyle(2, 0x4ade80);
    this.add.text(width/2, height/2-65, '📋 저장 코드 복사하기', { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#fff', fontStyle:'bold' }).setDepth(53).setOrigin(0.5);
    const saveSub = this.add.text(width/2, height/2-43, '현재 게임을 코드로 만들어요', { fontSize:'11px', fontFamily:'Malgun Gothic', color:'#bbf7d0' }).setDepth(53).setOrigin(0.5);
    allObjs.push(saveBtn, saveSub);
    saveBtn.on('pointerdown', () => {
      try {
        const code = btoa(unescape(encodeURIComponent(JSON.stringify(Save.load()))));
        if (navigator.clipboard) navigator.clipboard.writeText(code);
        else { const ta=document.createElement('textarea'); ta.value=code; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
        this.flashMsg('✅ 저장 코드가 복사됐어요!\n메모장 등에 붙여넣어 보관하세요.');
      } catch(e) { this.flashMsg('❌ 복사 실패. 다시 시도해 주세요.'); }
    });

    // 불러오기
    const loadBtn = this.add.rectangle(width/2, height/2+30, 320, 50, 0x1e40af).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    loadBtn.setStrokeStyle(2, 0x60a5fa);
    this.add.text(width/2, height/2+20, '📥 저장 코드 불러오기', { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#fff', fontStyle:'bold' }).setDepth(53).setOrigin(0.5);
    const loadSub = this.add.text(width/2, height/2+42, '보관한 코드로 게임을 되살려요', { fontSize:'11px', fontFamily:'Malgun Gothic', color:'#bfdbfe' }).setDepth(53).setOrigin(0.5);
    allObjs.push(loadBtn, loadSub);
    loadBtn.on('pointerdown', () => {
      const code = window.prompt('저장 코드를 붙여넣어 주세요:');
      if (!code) return;
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
        if (!data || typeof data !== 'object' || !('bag' in data)) throw new Error('형식 오류');
        Save.save(Save.migrate(data));
        this.flashMsg('✅ 불러오기 성공! 게임을 다시 시작합니다.');
        this.time.delayedCall(1200, () => this.scene.restart());
      } catch(e) { this.flashMsg('❌ 코드가 올바르지 않아요.'); }
    });

    const cBtn = this.add.rectangle(width/2, height/2+115, 150, 40, 0x374151).setDepth(52).setOrigin(0.5).setInteractive({useHandCursor:true});
    this.add.text(width/2, height/2+115, '✕ 닫기', { fontSize:'14px', fontFamily:'Malgun Gothic', color:'#9ca3af' }).setDepth(53).setOrigin(0.5);
    allObjs.push(cBtn);
    cBtn.on('pointerdown', () => allObjs.forEach(o=>o.destroy()));
    this._saveMenuObjs = allObjs;
  }

  flashMsg(msg) {
    const { width, height } = this.scale;
    const t = this.add.text(width/2, height*0.2, msg, { fontSize:'15px', fontFamily:'Malgun Gothic', color:'#fde047', align:'center', stroke:'#000', strokeThickness:4, backgroundColor:'#000000aa', padding:{x:12,y:8} }).setDepth(70).setOrigin(0.5);
    this.time.delayedCall(2200, () => t.destroy());
  }

  makeBtn(x, y, label, color, cb) {
    const bg = this.add.rectangle(x, y, 220, 46, color, 1).setOrigin(0.5).setInteractive({ useHandCursor: true });
    bg.setStrokeStyle(2, 0xa855f7);
    this.add.text(x, y, label, { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#ffffff' }).setOrigin(0.5);
    bg.on('pointerdown', () => { Sound.play(this, 'click', 0.4); Sound.playBGM(this); cb(); });
    bg.on('pointerover', () => bg.setScale(1.05));
    bg.on('pointerout',  () => bg.setScale(1));
  }
}

// ── 씬: 학년 선택 ─────────────────────────────────────────────────────────────
class GradeScene extends Phaser.Scene {
  constructor() { super('GradeScene'); }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    this.add.text(width / 2, height * 0.18, '몇 학년이에요?', {
      fontSize: '28px', fontFamily: 'Malgun Gothic', color: '#e9d5ff',
    }).setOrigin(0.5);
    this.add.text(width / 2, height * 0.27, '학년에 맞는 문제가 나와요', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#a78bfa',
    }).setOrigin(0.5);

    this.makeGradeCard(width / 2 - 90, height * 0.5, '2학년', '덧셈·뺄셈\n구구단·상식', 2);
    this.makeGradeCard(width / 2 + 90, height * 0.5, '4학년', '곱셈·나눗셈\n분수·영어', 4);
  }

  makeGradeCard(x, y, label, sub, grade) {
    const bg = this.add.rectangle(x, y, 150, 180, 0x2d1b69, 1).setOrigin(0.5).setInteractive({ useHandCursor: true });
    bg.setStrokeStyle(2, 0x7c3aed);
    this.add.text(x, y - 50, grade === 2 ? '✏️' : '📚', { fontSize: '48px' }).setOrigin(0.5);
    this.add.text(x, y + 20, label, { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#e9d5ff', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(x, y + 60, sub, { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#a78bfa', align: 'center' }).setOrigin(0.5);

    bg.on('pointerdown', () => {
      const saveData = Save.defaultData();
      saveData.grade = grade;
      Save.save(saveData);
      this.scene.start('CharScene', { saveData });
    });
    bg.on('pointerover', () => { bg.setFillStyle(0x4c1d95); bg.setScale(1.05); });
    bg.on('pointerout',  () => { bg.setFillStyle(0x2d1b69); bg.setScale(1); });
  }
}

// ── 씬: 캐릭터 선택 ───────────────────────────────────────────────────────────
class CharScene extends Phaser.Scene {
  constructor() { super('CharScene'); }

  init(data) { this.saveData = data.saveData; }

  create() {
    const { width, height } = this.scale;
    this.add.rectangle(0, 0, width, height, 0x1a0a3e).setOrigin(0);

    this.add.text(width / 2, height * 0.15, '캐릭터를 골라봐!', {
      fontSize: '26px', fontFamily: 'Malgun Gothic', color: '#e9d5ff',
    }).setOrigin(0.5);

    this.selected = null;
    this.cards = {};

    this.makeCharCard(width / 2 - 90, height * 0.5, '🧒', '남자아이', 'm');
    this.makeCharCard(width / 2 + 90, height * 0.5, '👧', '여자아이', 'f');

    const btn = this.add.rectangle(width / 2, height * 0.82, 200, 46, 0x4c1d95, 1).setOrigin(0.5).setInteractive({ useHandCursor: true });
    btn.setStrokeStyle(2, 0x7c3aed);
    this.add.text(width / 2, height * 0.82, '다음으로 →', { fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#ffffff' }).setOrigin(0.5);
    btn.on('pointerdown', () => {
      if (!this.selected) this.selectChar('m');
      this.saveData.character = this.selected;
      Save.save(this.saveData);
      this.scene.start('MapScene', { saveData: this.saveData });
    });
  }

  makeCharCard(x, y, emoji, label, id) {
    const bg = this.add.rectangle(x, y, 140, 180, 0x2d1b69, 1).setOrigin(0.5).setInteractive({ useHandCursor: true });
    bg.setStrokeStyle(2, 0x4c1d95);
    this.add.text(x, y - 40, emoji, { fontSize: '56px' }).setOrigin(0.5);
    this.add.text(x, y + 50, label, { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#e9d5ff' }).setOrigin(0.5);
    this.cards[id] = bg;
    bg.on('pointerdown', () => this.selectChar(id));
  }

  selectChar(id) {
    this.selected = id;
    Object.keys(this.cards).forEach(k => {
      this.cards[k].setStrokeStyle(2, k === id ? 0xe879f9 : 0x4c1d95);
      this.cards[k].setFillStyle(k === id ? 0x5b21b6 : 0x2d1b69);
    });
  }
}

// ── 씬: 모험 맵 (대형 스크롤 맵 + 캐릭터 이동) ──────────────────────────────
class MapScene extends Phaser.Scene {
  constructor() { super('MapScene'); }

  init(data) { this.saveData = data.saveData || Save.load(); }

  preload() {
    const zoneId = this.saveData.mapProgress.zone;
    const key = `zone${zoneId}-bg`;
    if (!this.textures.exists(key)) {
      this.load.image(key, `assets/maps/${key}.png`);
    }
    // 베이스 캐릭터 이미지 로드 (없으면 도형 fallback 자동 적용)
    if (!this.textures.exists('base-boy'))  this.load.image('base-boy',  'assets/characters/base-boy.png');
    if (!this.textures.exists('base-girl')) this.load.image('base-girl', 'assets/characters/base-girl.png');
    // 모자 이미지 로드 (hat-1~5, 없는 파일은 자동 skip)
    for (let n = 1; n <= 5; n++) {
      if (!this.textures.exists(`hat-${n}`)) this.load.image(`hat-${n}`, `assets/characters/hat-${n}.png`);
    }
    // 펫 이미지 로드 (동행 펫 표시용)
    Utils.queuePetImages(this);
    // 사운드 로드 (지역별 BGM 포함)
    Sound.queue(this);
    // 이미지 로드 실패해도 게임 진행
    this.load.on('loaderror', () => { this.bgLoadFailed = true; });
  }

  create() {
    const { width, height } = this.scale;
    const zoneId = this.saveData.mapProgress.zone;
    const zone   = PETS_DATA.zones.find(z => z.id === zoneId);

    // 맵 크기 = 화면의 3×3
    this.MAP_W = width  * 3;
    this.MAP_H = height * 3;

    // 지역 바뀌었으면 오브젝트 초기화
    if (!this.saveData.mapObjects || this.saveData.mapObjects.zoneId !== zoneId) {
      const positions  = this.generatePositions(12);
      const wildPool   = [Utils.pickWildPets(zoneId)[0], Utils.pickWildPets(zoneId)[1]];
      const isVillage  = zone.theme === 'village';
      this.saveData.mapObjects = {
        zoneId,
        eggs:     positions.slice(0, 8).map((p, i) => ({ id:i, x:p.x, y:p.y, collected:false })),
        wildPets: positions.slice(8, 10).map((p, i) => ({ id:i, x:p.x, y:p.y, defeated:false, pet: wildPool[i]||wildPool[0] })),
        // 마을 지역(5번)에만 수의사 + 상점 배치
        vet:  isVillage ? { x: positions[10].x, y: positions[10].y, used: false } : null,
        shop: isVillage ? { x: positions[11].x, y: positions[11].y } : null,
        angel: (zone.theme === 'rainbow') ? { x: this.MAP_W / 2, y: this.MAP_H / 2, used: false } : null,
      };
      Save.save(this.saveData);
    }

    // ── 배경 ──
    const zoneColors = { ice:0x9BB8D4, forest:0x2d6a35, fire:0xb03010, cave:0x2a2f38, village:0xe8a0b0, desert:0xd4a020, cloud:0x6070a0, rainbow:0xb040c0, aurora:0x054030 };
    const bgColor = zoneColors[zone.theme] || 0x2d1b69;
    const bgKey = `zone${zoneId}-bg`;

    if (this.textures.exists(bgKey)) {
      // 배경 이미지를 맵 전체 크기로 늘려서 배치
      const bg = this.add.image(0, 0, bgKey).setOrigin(0).setDepth(0);
      bg.setDisplaySize(this.MAP_W, this.MAP_H);
    } else {
      // 이미지 없으면 색 배경 + 이모지 장식
      this.add.rectangle(0, 0, this.MAP_W, this.MAP_H, bgColor).setOrigin(0).setDepth(0);
      this.drawMapDecoration(zone.theme);
    }

    // ── 오브젝트 배치 ──
    this.spawnObjects();

    // ── 숲 지역(2번) 덩굴 지대: 맵 하단 1/3 ──
    this.vineZone = null;
    if (zoneId === 2) {
      const vx = 0, vy = Math.round(this.MAP_H * 0.25);
      const vw = this.MAP_W, vh = Math.round(this.MAP_H * 0.5);
      // 덩굴 배경 (짙은 갈록색, 눈에 띄게)
      this.add.rectangle(vx + vw/2, vy + vh/2, vw, vh, 0x1a0800, 0.55).setOrigin(0.5).setDepth(3);
      // 덩굴 경계선 (붉은 갈색, 굵게)
      this.add.rectangle(vx + vw/2, vy, vw, 8, 0x8b4513, 0.9).setOrigin(0.5, 0).setDepth(3);
      // 덩굴 장식 (크고 많게)
      const vineEmojis = ['🌿','🍃','🌱','🪴','🌾','🕸️'];
      for (let i = 0; i < 55; i++) {
        const ex = Phaser.Math.Between(vx + 30, vx + vw - 30);
        const ey = Phaser.Math.Between(vy + 40, vy + vh - 20);
        this.add.text(ex, ey, vineEmojis[i % vineEmojis.length], {
          fontSize: Phaser.Math.Between(22, 42) + 'px',
        }).setOrigin(0.5).setDepth(3).setAlpha(0.85);
      }
      // 진입 안내 텍스트 (상단 + 중앙 반복)
      this.add.text(vx + vw/2, vy + 30, '⚠️ 덩굴 지대 — 이동 속도 -50%! ⚠️', {
        fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fde68a',
        fontStyle: 'bold', stroke: '#000', strokeThickness: 5,
      }).setOrigin(0.5).setDepth(4);
      this.add.text(vx + vw/2, vy + vh/2, '🌿 덩굴 지대 🌿', {
        fontSize: '24px', fontFamily: 'Malgun Gothic', color: '#fde68a',
        fontStyle: 'bold', stroke: '#000', strokeThickness: 5,
      }).setOrigin(0.5).setDepth(4).setAlpha(0.6);
      this.vineZone = { x: vx, y: vy, w: vw, h: vh };
    }

    // ── 캐릭터 ──
    const startX = this.saveData.mapProgress.px || this.MAP_W / 2;
    const startY = this.saveData.mapProgress.py || this.MAP_H / 2;
    const isFemale = this.saveData.character === 'f';

    // 캐릭터 컨테이너 (이미지 우선 / 도형 fallback)
    const equip = this.saveData.cosmetics ? this.saveData.cosmetics.equipped : { hat: null, shoes: null };
    const charImgKey = isFemale ? 'base-girl' : 'base-boy';
    const hasCharImg = this.textures.exists(charImgKey);

    // 도형 fallback 전용 색상 (이미지 있으면 사용 안 함)
    let bodyColor = isFemale ? 0xe879f9 : 0x60a5fa;

    this.player = this.add.container(startX, startY).setDepth(10);
    // 그림자: 이미지 모드 y=47 (높이86/2+4), 도형 모드 y=24
    const shadow = this.add.ellipse(0, hasCharImg ? 47 : 24, 30, 10, 0x000000, 0.3);
    this.player.add(shadow);

    if (hasCharImg) {
      // ── 신발/탈것 이모지: 캐릭터 이미지보다 먼저 추가 → 발 아래에 보임 ──
      if (equip.shoes) {
        const shoeItem = PETS_DATA.cosmetics.find(c => c.id === equip.shoes);
        if (shoeItem) {
          const shoeEmoji = this.add.text(0, 50, shoeItem.emoji, { fontSize: '26px' }).setOrigin(0.5);
          this.player.add(shoeEmoji);
        }
      }
      // ── 이미지 캐릭터 ──────────────────────────────────────────
      const charImg = this.add.image(0, 0, charImgKey);
      charImg.setDisplaySize(52, 86);  // 너비 52: 홀쭉함 개선 (높이 유지)
      charImg.setOrigin(0.5, 0.5);
      this.player.add(charImg);
      // 모자: 이미지 있으면 이미지, 없으면 이모지
      if (equip.hat) {
        const hatItem = PETS_DATA.cosmetics.find(c => c.id === equip.hat);
        if (hatItem) {
          if (hatItem.img && this.textures.exists(hatItem.img)) {
            const hatImg = this.add.image(0, -15, hatItem.img);
            hatImg.setDisplaySize(36, 24);
            hatImg.setOrigin(0.5, 1);
            this.player.add(hatImg);
          } else {
            const hatEmoji = this.add.text(0, -50, hatItem.emoji, { fontSize: '22px' }).setOrigin(0.5);
            this.player.add(hatEmoji);
          }
        }
      }
    } else {
      // ── 도형 캐릭터 (이미지 없을 때 자동 fallback) ─────────────
      if (equip.shoes) {
        const shoeItem = PETS_DATA.cosmetics.find(c => c.id === equip.shoes);
        if (shoeItem) {
          const shoeEmoji = this.add.text(0, 26, shoeItem.emoji, { fontSize: '22px' }).setOrigin(0.5);
          this.player.add(shoeEmoji);
        }
      }
      const body = this.add.rectangle(0, 4, 22, 26, bodyColor);
      const head = this.add.circle(0, -16, 13, isFemale ? 0xfcd34d : 0xfbbf24);
      const eyes = this.add.rectangle(0, -16, 10, 4, 0x1a1a2e);
      this.player.add([body, head, eyes]);
      if (equip.hat) {
        const hatItem = PETS_DATA.cosmetics.find(c => c.id === equip.hat);
        if (hatItem) {
          const hatEmoji = this.add.text(0, -34, hatItem.emoji, { fontSize: '22px' }).setOrigin(0.5);
          this.player.add(hatEmoji);
        }
      } else {
        const hat = isFemale
          ? this.add.triangle(0, -32, -8, 0, 8, 0, 0, -14, 0xff69b4)
          : this.add.rectangle(0, -30, 18, 6, 0x2563eb);
        this.player.add(hat);
      }
    }

    // 캐릭터 위에 이름 표시 (이미지 상단 y=-43 기준 위 13px = -56)
    this.playerLabel = this.add.text(startX, startY - 56,
      isFemale ? '여자아이' : '남자아이',
      { fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#ffffff',
        stroke: '#000000', strokeThickness: 3 }
    ).setOrigin(0.5).setDepth(11);

    // 동행 펫 표시 (그래픽)
    // 동행 펫이 없으면 가방의 첫 번째 살아있는 펫을 자동 동행
    let activePet = this.saveData.bag.find(p => p.isActive && p.alive);
    if (!activePet) {
      const firstAlive = this.saveData.bag.find(p => p.alive);
      if (firstAlive) {
        this.saveData.bag.forEach(p => p.isActive = false);
        firstAlive.isActive = true;
        this.saveData.activePetId = firstAlive.id;
        activePet = firstAlive;
        Save.save(this.saveData);
      }
    }

    if (activePet) {
      this.petFollow = this.add.container(startX - 48, startY + 6).setDepth(9);
      const petShadow = this.add.ellipse(0, 14, 26, 9, 0x000000, 0.3);
      const petLabel  = this.add.text(0, 28, `${activePet.name.slice(0, 5)} Lv.${activePet.level}`,
        { fontSize: '10px', fontFamily: 'Malgun Gothic', color: '#e9d5ff', stroke: '#000', strokeThickness: 3 }
      ).setOrigin(0.5);

      const petTexKey = Utils.petTexKey(activePet.id, activePet.level);
      if (this.textures.exists(petTexKey)) {
        // ── 이미지 동행 펫 ──
        const petImg = this.add.image(0, 0, petTexKey);
        const src = this.textures.get(petTexKey).getSourceImage();
        // 레벨별 동행 펫 높이 (성장 곡선): 1=115, 2=130, 3=140, 4=150, 5이상=165
        const petHeights = { 1: 115, 2: 130, 3: 140, 4: 150 };
        const targetH = petHeights[activePet.level] || 165;
        const scale = targetH / src.height;
        petImg.setScale(scale);
        petImg.y = -targetH / 2 + 16;  // 발이 그림자에 닿게
        // 펫이 커졌으니 그림자도 키우고, 캐릭터와 안 겹치게 간격 넓힘
        petShadow.width = targetH * 0.42;
        petShadow.height = targetH * 0.15;
        this.petFollow.x = startX - 56;
        this.petFollow.add([petShadow, petImg, petLabel]);
        petLabel.y = 22;
        this.tweens.add({ targets: petImg, y: petImg.y - 4, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      } else {
        // ── 도형 fallback ──
        const gradeColor = { legend: 0xfbbf24, rare: 0x60a5fa, normal: 0xa855f7 };
        const petColor = gradeColor[activePet.grade] || 0xa855f7;
        const petBody   = this.add.circle(0, 0, 15, petColor);
        const petEar1   = this.add.triangle(-8, -12, -4, 0, 4, 0, 0, -10, petColor);
        const petEar2   = this.add.triangle(8, -12, -4, 0, 4, 0, 0, -10, petColor);
        const petEyeL   = this.add.circle(-5, -2, 2.5, 0xffffff);
        const petEyeR   = this.add.circle(5, -2, 2.5, 0xffffff);
        const petPupilL = this.add.circle(-5, -2, 1.2, 0x1a1a2e);
        const petPupilR = this.add.circle(5, -2, 1.2, 0x1a1a2e);
        this.petFollow.add([petShadow, petBody, petEar1, petEar2, petEyeL, petEyeR, petPupilL, petPupilR, petLabel]);
        this.tweens.add({ targets: petBody, scaleY: 0.85, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }
    } else {
      this.petFollow = null;
    }

    // ── 카메라 ──
    this.cameras.main.setBounds(0, 0, this.MAP_W, this.MAP_H);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

    // ── 조이스틱 (화면 고정 HUD) ──
    this.createJoystick();
    this.createHUD();

    // ── 미니맵 ──
    this.createMinimap();

    // ── 이동 상태 ──
    this.moveDir = { x: 0, y: 0 };
    // 탈것에 따른 이동 속도 (기본 3, 장착 시 해당 speed 적용)
    const shoeId = this.saveData.cosmetics?.equipped?.shoes;
    const shoeSpeedItem = shoeId ? PETS_DATA.cosmetics.find(c => c.id === shoeId) : null;
    this.SPEED = shoeSpeedItem?.speed ?? 3;

    // ── 지역별 배경음악 ──
    Sound.playZoneBGM(this, this.saveData.mapProgress.zone);

    // ── 동굴 지역(4번) 어둠 효과: 시야 제한 ──
    this.caveSpotlight = null;
    this.caveDark = null;
    if (zoneId === 4) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      const isDarkType = activePet && activePet.type === '어둠';

      if (!isDarkType) {
        // 어둠 속성이 아닐 때만 시야 제한
        this.caveRadius = 120;
        this.caveDark = this.add.rectangle(width/2, height/2, width + 100, height + 100, 0x000000, 0.88).setScrollFactor(0).setOrigin(0.5).setDepth(14);
        this.caveSpotlight = this.make.graphics();
        this.caveSpotlight.fillStyle(0xffffff);
        this.caveSpotlight.fillCircle(width/2, height/2, this.caveRadius);
        const mask = this.caveSpotlight.createGeometryMask();
        mask.invertAlpha = true;
        this.caveDark.setMask(mask);
      }

      // HUD 안내
      const caveMsg = isDarkType
        ? '🌑 어둠 속성 저항! 맵 전체가 밝아요'
        : '🌑 동굴 지대! 시야가 좁아요';
      const caveColor = isDarkType ? '#c084fc' : '#9ca3af';
      this.caveHud = this.add.text(this.scale.width/2, 90, caveMsg, {
        fontSize:'13px', fontFamily:'Malgun Gothic', color: caveColor,
        fontStyle:'bold', stroke:'#000', strokeThickness:3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => { if(this.caveHud) { this.caveHud.destroy(); this.caveHud = null; } });
    }

    // ── 불 지역(3번) 열기 효과: 동행 펫 3초마다 HP -1 ──
    this.heatTimer = null;
    if (zoneId === 3) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      const isFireType = activePet && activePet.type === '불꽃';

      if (!isFireType && activePet) {
        this.heatTimer = this.time.addEvent({
          delay: 3000,
          loop: true,
          callback: () => {
            const pet = this.saveData.bag.find(p => p.isActive && p.alive);
            if (!pet) return;
            pet.hp = Math.max(0, pet.hp - 1);
            Save.save(this.saveData);
            this.updateHpBar();
            // 데미지 이펙트
            const { width, height } = this.scale;
            const dmgTxt = this.add.text(width - 80, height - 80, '🔥 -1', {
              fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#f97316',
              fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
            }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
            this.tweens.add({ targets: dmgTxt, y: dmgTxt.y - 30, alpha: 0, duration: 800, onComplete: () => dmgTxt.destroy() });
            // 기절 처리
            if (pet.hp <= 0) {
              pet.alive = false;
              Save.save(this.saveData);
              if (this.heatTimer) this.heatTimer.remove();
              const faintTxt = this.add.text(width/2, height/2, '🔥 펫이 열기에 기절했어요!', {
                fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fb923c',
                fontStyle: 'bold', stroke: '#000', strokeThickness: 4,
              }).setScrollFactor(0).setDepth(30).setOrigin(0.5);
              this.time.delayedCall(2000, () => { faintTxt.destroy(); this.scene.restart({ saveData: this.saveData }); });
            }
          },
        });
      }

      // HUD 안내
      const heatMsg = isFireType
        ? '🔥 불꽃 속성 저항! 열기 면역'
        : '🔥 뜨거운 지역! 펫 HP가 3초마다 -1';
      const heatColor = isFireType ? '#fb923c' : '#f97316';
      this.heatHud = this.add.text(this.scale.width/2, 90, heatMsg, {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: heatColor,
        fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => { if(this.heatHud) { this.heatHud.destroy(); this.heatHud = null; } });
    }

    // ── 사막 지역(6번) 갈증 효과: 이동속도 -2 + 3초마다 HP -1 ──
    this.desertSlow = false;
    this.thirstTimer = null;
    if (zoneId === 6) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      const isResist = activePet && (activePet.type === '물' || activePet.type === '땅');

      if (!isResist) {
        // 속도 감소
        this.desertSlow = true;
        this.SPEED = Math.max(1, this.SPEED - 2);

        // HP 감소 타이머
        if (activePet) {
          this.thirstTimer = this.time.addEvent({
            delay: 3000,
            loop: true,
            callback: () => {
              const pet = this.saveData.bag.find(p => p.isActive && p.alive);
              if (!pet) return;
              pet.hp = Math.max(0, pet.hp - 1);
              Save.save(this.saveData);
              this.updateHpBar();
              const { width, height } = this.scale;
              const dmgTxt = this.add.text(width - 80, height - 80, '💧 -1', {
                fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#facc15',
                fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
              }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
              this.tweens.add({ targets: dmgTxt, y: dmgTxt.y - 30, alpha: 0, duration: 800, onComplete: () => dmgTxt.destroy() });
              if (pet.hp <= 0) {
                pet.alive = false;
                Save.save(this.saveData);
                if (this.thirstTimer) this.thirstTimer.remove();
                const faintTxt = this.add.text(width/2, height/2, '🏜️ 펫이 갈증으로 기절했어요!', {
                  fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#facc15',
                  fontStyle: 'bold', stroke: '#000', strokeThickness: 4,
                }).setScrollFactor(0).setDepth(30).setOrigin(0.5);
                this.time.delayedCall(2000, () => { faintTxt.destroy(); this.scene.restart({ saveData: this.saveData }); });
              }
            },
          });
        }
      }

      // HUD 안내
      const desertMsg = isResist
        ? '🏜️ 물/땅 속성 저항! 갈증 면역'
        : '🏜️ 사막 갈증! 속도 -2 · HP 3초마다 -1';
      const desertColor = isResist ? '#60a5fa' : '#facc15';
      this.desertHud = this.add.text(this.scale.width/2, 90, desertMsg, {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: desertColor,
        fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => { if(this.desertHud) { this.desertHud.destroy(); this.desertHud = null; } });
    }

    // ── 얼음 지역(1번) 빙결 효과: 3초 정지 시 얼음 ──
    this.iceFreeze = false;
    this.iceIdle = 0;
    this.iceImmune = false;
    if (zoneId === 1) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      this.iceImmune = !!(activePet && activePet.type === '얼음');

      // 이전에 빙결된 상태로 돌아왔을 때
      if (this.saveData.frozen && !this.iceImmune) {
        this.iceFreeze = true;
        this.time.delayedCall(100, () => this.showFreezeOverlay());
      } else {
        this.saveData.frozen = false;
      }

      // HUD 안내
      const iceMsg = this.iceImmune
        ? '❄️ 얼음 속성 저항! 빙결 면역'
        : '❄️ 얼음 지역! 3초간 멈추면 얼어요';
      const iceColor = this.iceImmune ? '#67e8f9' : '#9ca3af';
      this.iceHud = this.add.text(this.scale.width/2, 90, iceMsg, {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: iceColor,
        fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => { if(this.iceHud) { this.iceHud.destroy(); this.iceHud = null; } });
    }

    // ── 구름 지역(7번) 번개 효과: 7~10초마다 번개 + HP -10 ──
    this.lightningTimer = null;
    if (zoneId === 7) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      const isResist = !!(activePet && (activePet.type === '전기' || activePet.type === '바람'));

      if (!isResist) {
        const scheduleLightning = () => {
          const delay = Phaser.Math.Between(7000, 10000);
          this.lightningTimer = this.time.delayedCall(delay, () => {
            this.triggerLightning();
            scheduleLightning();
          });
        };
        scheduleLightning();
      }

      // HUD 안내
      const stormMsg = isResist
        ? '⚡ 전기/바람 속성 저항! 번개 면역'
        : '⛈️ 구름 지역! 번개를 조심하세요!';
      const stormColor = isResist ? '#eab308' : '#9ca3af';
      this.stormHud = this.add.text(this.scale.width/2, 90, stormMsg, {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: stormColor,
        fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => { if(this.stormHud) { this.stormHud.destroy(); this.stormHud = null; } });
    }

    // ── 오로라 지역(9번) 블랙홀: 맵 전역 배회 + 근접 시 흡수 ──
    this.blackHole = null;
    this.bhPullRange = 200;
    this.bhSuckRange = 50;
    if (zoneId === 9) {
      const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
      const isLightType = !!(activePet && activePet.type === '빛');

      if (!isLightType) {
        const bh = this.add.text(this.MAP_W / 2, this.MAP_H / 4, '🕳️', { fontSize: '70px' }).setOrigin(0.5).setDepth(8);
        this.tweens.add({ targets: bh, scaleX: 1.15, scaleY: 1.15, duration: 800, yoyo: true, repeat: -1 });
        this.tweens.add({ targets: bh, angle: 360, duration: 4000, repeat: -1 });
        this.blackHole = bh;
        this.moveBhToRandom();
      }

      // HUD 안내
      const bhMsg = isLightType
        ? '✨ 빛 속성 저항! 블랙홀 면역'
        : '🕳️ 블랙홀을 조심하세요! 가까이 가면 빨려 들어가요!';
      const bhColor = isLightType ? '#fde047' : '#c084fc';
      const bhHud = this.add.text(this.scale.width/2, 90, bhMsg, {
        fontSize: '12px', fontFamily: 'Malgun Gothic', color: bhColor,
        fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
      }).setScrollFactor(0).setDepth(25).setOrigin(0.5);
      this.time.delayedCall(3000, () => bhHud.destroy());
    }
  }

  moveBhToRandom() {
    if (!this.blackHole) return;
    const tx = Phaser.Math.Between(100, this.MAP_W - 100);
    const ty = Phaser.Math.Between(100, this.MAP_H - 100);
    const dist = Phaser.Math.Distance.Between(this.blackHole.x, this.blackHole.y, tx, ty);
    const duration = Math.max(3000, dist * 3);
    this.tweens.add({
      targets: this.blackHole, x: tx, y: ty, duration,
      ease: 'Sine.easeInOut',
      onComplete: () => this.moveBhToRandom(),
    });
  }

  triggerLightning() {
    const { width, height } = this.scale;

    // 사운드
    Sound.play(this, 'thunder', 0.6);

    // 1단계: 화면 번쩍 (흰색 플래시 2회)
    const flash = this.add.rectangle(width/2, height/2, width, height, 0xffffff, 0.85)
      .setScrollFactor(0).setDepth(26).setOrigin(0.5);
    this.tweens.add({
      targets: flash, alpha: 0, duration: 120, yoyo: true, repeat: 2,
      onComplete: () => flash.destroy(),
    });

    // 2단계: 큰 번개 이모지들 (맵 곳곳에)
    const bolts = [];
    for (let i = 0; i < 8; i++) {
      const bx = Phaser.Math.Between(40, width - 40);
      const by = Phaser.Math.Between(40, height - 40);
      const bolt = this.add.text(bx, by, '⚡', {
        fontSize: Phaser.Math.Between(40, 80) + 'px',
      }).setScrollFactor(0).setDepth(27).setOrigin(0.5).setAlpha(0);
      bolts.push(bolt);
      // 깜빡깜빡 등장
      this.tweens.add({
        targets: bolt, alpha: 1, duration: 80,
        delay: i * 60,
        yoyo: true, repeat: 2,
        onComplete: () => bolt.destroy(),
      });
    }

    // 3단계: 중앙 대형 번개
    const mainBolt = this.add.text(width/2, height/2 - 50, '⚡⚡⚡', {
      fontSize: '60px',
    }).setScrollFactor(0).setDepth(27).setOrigin(0.5).setAlpha(0);
    this.tweens.add({
      targets: mainBolt, alpha: 1, scaleX: 1.3, scaleY: 1.3, duration: 100,
      delay: 200, yoyo: true, repeat: 1,
      onComplete: () => mainBolt.destroy(),
    });

    // 4단계: HP 데미지
    const pet = this.saveData.bag.find(p => p.isActive && p.alive);
    if (pet) {
      pet.hp = Math.max(0, pet.hp - 10);
      Save.save(this.saveData);
      this.updateHpBar();

      // 데미지 텍스트
      const dmgTxt = this.add.text(width/2, height/2 + 30, '⚡ -10 HP!', {
        fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#fde047',
        fontStyle: 'bold', stroke: '#000', strokeThickness: 4,
      }).setScrollFactor(0).setDepth(28).setOrigin(0.5);
      this.tweens.add({
        targets: dmgTxt, y: dmgTxt.y - 40, alpha: 0,
        duration: 1200, delay: 400, onComplete: () => dmgTxt.destroy(),
      });

      // 기절 처리
      if (pet.hp <= 0) {
        pet.alive = false;
        Save.save(this.saveData);
        if (this.lightningTimer) this.lightningTimer.remove();
        const faintTxt = this.add.text(width/2, height/2 + 70, '⚡ 펫이 번개에 기절했어요!', {
          fontSize: '18px', fontFamily: 'Malgun Gothic', color: '#fde047',
          fontStyle: 'bold', stroke: '#000', strokeThickness: 4,
        }).setScrollFactor(0).setDepth(30).setOrigin(0.5);
        this.time.delayedCall(2000, () => {
          faintTxt.destroy();
          this.scene.restart({ saveData: this.saveData });
        });
      }
    }
  }

  showFreezeOverlay() {
    const { width, height } = this.scale;
    this.freezeObjs = [];
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x87ceeb, 0.4).setScrollFactor(0).setDepth(28).setOrigin(0.5);
    const iceTxt = this.add.text(width/2, height/2 - 30, '🥶 몸이 얼었어요!', {
      fontSize: '22px', fontFamily: 'Malgun Gothic', color: '#e0f2fe',
      fontStyle: 'bold', stroke: '#1e3a5f', strokeThickness: 5,
    }).setScrollFactor(0).setDepth(29).setOrigin(0.5);
    const helpTxt = this.add.text(width/2, height/2 + 15, '가방에서 💊 체력 회복 물약을 사용하세요!', {
      fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#bae6fd',
      fontStyle: 'bold', stroke: '#000', strokeThickness: 3,
    }).setScrollFactor(0).setDepth(29).setOrigin(0.5);
    // 가방 바로가기 버튼
    const bagBtn = this.add.rectangle(width/2, height/2 + 60, 160, 40, 0x4c1d95).setScrollFactor(0).setDepth(29).setOrigin(0.5).setInteractive({ useHandCursor: true });
    const bagTxt = this.add.text(width/2, height/2 + 60, '🎒 가방 열기', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fff',
    }).setScrollFactor(0).setDepth(29).setOrigin(0.5);
    bagBtn.on('pointerdown', () => {
      Save.save(this.saveData);
      this.scene.start('BagScene', { saveData: this.saveData });
    });
    // 얼음 파티클
    for (let i = 0; i < 12; i++) {
      const flake = this.add.text(
        Phaser.Math.Between(50, width - 50),
        Phaser.Math.Between(50, height - 50),
        '❄️', { fontSize: Phaser.Math.Between(16, 28) + 'px' }
      ).setScrollFactor(0).setDepth(28).setAlpha(0.7);
      this.tweens.add({ targets: flake, y: flake.y + 40, alpha: 0.3, duration: Phaser.Math.Between(1500, 3000), yoyo: true, repeat: -1 });
      this.freezeObjs.push(flake);
    }
    this.freezeObjs.push(overlay, iceTxt, helpTxt, bagBtn, bagTxt);
  }

  showAngelDialog() {
    const { width, height } = this.scale;
    const allObjs = [];
    const activePet = this.saveData.bag.find(p => p.isActive && p.alive);
    const isEsper = !!(activePet && (activePet.type === '에스퍼' || activePet.type === '페어리'));
    const chance = isEsper ? 0.10 : 0.05;

    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.7).setScrollFactor(0).setDepth(40).setOrigin(0.5);
    const panel = this.add.rectangle(width/2, height/2, 340, isEsper ? 320 : 280, 0x2a1040).setScrollFactor(0).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2, 0xf0abfc);
    const angelEmoji = this.add.text(width/2, height/2 - (isEsper ? 120 : 100), '👼', { fontSize: '50px' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
    const msgTxt = this.add.text(width/2, height/2 - (isEsper ? 60 : 40), '너의 소원을 들어줄\n무지개 조각을 만들어줄게! 🌈', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#f0abfc',
      fontStyle: 'bold', align: 'center', stroke: '#000', strokeThickness: 2,
    }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
    allObjs.push(overlay, panel, angelEmoji, msgTxt);

    if (isEsper) {
      const boostTxt = this.add.text(width/2, height/2 - 15, `🔮 에스퍼/페어리 펫의 힘으로 성공 확률 UP!`, {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#e879f9',
        fontStyle: 'bold', stroke: '#000', strokeThickness: 2,
      }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      allObjs.push(boostTxt);
    }

    const subTxt = this.add.text(width/2, height/2 + (isEsper ? 10 : 10), `(성공 확률 ${isEsper ? '10%' : '5%'}${isEsper ? '' : ' · 에스퍼/페어리 펫 동반 시 확률 UP!'})`, {
      fontSize: '11px', fontFamily: 'Malgun Gothic', color: '#d8b4fe',
    }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
    allObjs.push(subTxt);

    // 확인 버튼
    const okBtn = this.add.rectangle(width/2, height/2 + (isEsper ? 55 : 55), 160, 40, 0x7c3aed).setScrollFactor(0).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
    const okTxt = this.add.text(width/2, height/2 + (isEsper ? 55 : 55), '✨ 부탁할게!', {
      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fff',
    }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
    allObjs.push(okBtn, okTxt);

    // 닫기 버튼
    const closeBtn = this.add.rectangle(width/2, height/2 + (isEsper ? 105 : 105), 160, 36, 0x374151).setScrollFactor(0).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
    const closeTxt = this.add.text(width/2, height/2 + (isEsper ? 105 : 105), '✕ 아니야 괜찮아', {
      fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#9ca3af',
    }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
    allObjs.push(closeBtn, closeTxt);

    closeBtn.on('pointerdown', () => allObjs.forEach(o => o.destroy()));

    okBtn.on('pointerdown', () => {
      allObjs.forEach(o => o.destroy());
      // 천사 사용 처리
      this.saveData.mapObjects.angel.used = true;
      const success = Math.random() < chance;
      if (success) {
        this.saveData.items.rainbowFragment++;
        Save.save(this.saveData);
        this.showAngelResult(true);
      } else {
        Save.save(this.saveData);
        this.showAngelResult(false);
      }
    });
  }

  showAngelResult(success) {
    const { width, height } = this.scale;
    const allObjs = [];
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.7).setScrollFactor(0).setDepth(40).setOrigin(0.5);
    const panel = this.add.rectangle(width/2, height/2, 340, 300, 0x2a1040).setScrollFactor(0).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2, success ? 0xfbbf24 : 0x6b7280);
    allObjs.push(overlay, panel);

    if (success) {
      const emoji = this.add.text(width/2, height/2 - 90, '🌈', { fontSize: '50px' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      const msg1 = this.add.text(width/2, height/2 - 30, '운이 좋았어!\n여기 무지개 조각이야! 🌈', {
        fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fbbf24',
        fontStyle: 'bold', align: 'center', stroke: '#000', strokeThickness: 2,
      }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      const countTxt = this.add.text(width/2, height/2 + 20, `보유: 🌈 ${this.saveData.items.rainbowFragment} / 10개`, {
        fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#d8b4fe',
      }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      allObjs.push(emoji, msg1, countTxt);

      // 10개 모이면 자동 합성
      if (this.saveData.items.rainbowFragment >= 10) {
        this.saveData.items.rainbowFragment -= 10;
        this.saveData.items.rainbowCrystal++;
        Save.save(this.saveData);
        const crystalMsg = this.add.text(width/2, height/2 + 55, '🔮 무지개 수정이 완성되었어요!', {
          fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#e879f9',
          fontStyle: 'bold', stroke: '#000', strokeThickness: 2,
        }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
        allObjs.push(crystalMsg);
      }
    } else {
      const emoji = this.add.text(width/2, height/2 - 80, '👼', { fontSize: '50px' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      const msg1 = this.add.text(width/2, height/2 - 20, '미안...\n내 힘이 부족했나봐 😢', {
        fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#9ca3af',
        fontStyle: 'bold', align: 'center', stroke: '#000', strokeThickness: 2,
      }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      const msg2 = this.add.text(width/2, height/2 + 25, '다음에 다시 해보자!', {
        fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#a78bfa',
      }).setScrollFactor(0).setDepth(42).setOrigin(0.5);

    }

      fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#fff',
    }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
    allObjs.push(okBtn, okTxt);
    okBtn.on('pointerdown', () => { allObjs.forEach(o => o.destroy()); this.scene.restart({ saveData: this.saveData }); });

  drawMapDecoration(theme) {
    // 테마별 장식 타일 배치
    const decorations = {
      ice:     { items: ['❄️','⛄','🧊'], count: 30 },
      forest:  { items: ['🌲','🌿','🍀'], count: 35 },
      fire:    { items: ['🔥','🌋','💎'], count: 25 },
      cave:    { items: ['🪨','💀','🦇'], count: 30 },
      village: { items: ['🏠','🌸','⛲'], count: 28 },
      desert:  { items: ['🌵','🏜️','☀️'], count: 25 },
      cloud:   { items: ['☁️','⭐','🌙'], count: 30 },
      rainbow: { items: ['🌈','💫','✨'], count: 35 },
      aurora:  { items: ['🌌','💠','🔮'], count: 30 },
    };
    const deco = decorations[theme] || decorations.forest;
    for (let i = 0; i < deco.count; i++) {
      const x = Phaser.Math.Between(40, this.MAP_W - 40);
      const y = Phaser.Math.Between(40, this.MAP_H - 40);
      this.add.text(x, y, deco.items[i % deco.items.length], {
        fontSize: Phaser.Math.Between(20, 40) + 'px', alpha: 0.5,
      }).setOrigin(0.5);
    }
    // 경계선
    const border = this.add.rectangle(this.MAP_W/2, this.MAP_H/2, this.MAP_W-4, this.MAP_H-4, 0x000000, 0).setOrigin(0.5);
    border.setStrokeStyle(4, 0xffffff, 0.3);
  }

  spawnObjects() {
    const objs = this.saveData.mapObjects;

    objs.eggs.forEach(eggData => {
      if (eggData.collected) return;
      const egg = this.add.text(eggData.x, eggData.y, '🥚', { fontSize: '34px' }).setOrigin(0.5).setDepth(5);
      this.tweens.add({ targets: egg, y: eggData.y - 8, duration: 900 + Math.random()*400, yoyo: true, repeat: -1 });
      // 빛나는 효과
      const glow = this.add.circle(eggData.x, eggData.y, 22, 0xffffff, 0.15).setDepth(4);
      this.tweens.add({ targets: glow, alpha: 0.35, scaleX: 1.3, scaleY: 1.3, duration: 700, yoyo: true, repeat: -1 });
      egg.setInteractive({ useHandCursor: true });
      egg.on('pointerdown', () => {
        eggData.collected = true;
        Save.save(this.saveData);
        this.scene.start('QuizScene', { saveData: this.saveData });
      });
    });

    // 수의사 (마을 지역)
    if (objs.vet && !objs.vet.used) {
      const vet = this.add.text(objs.vet.x, objs.vet.y, '🧑‍⚕️', { fontSize: '40px' }).setOrigin(0.5).setDepth(5);
      const heartGlow = this.add.text(objs.vet.x, objs.vet.y - 32, '💚', { fontSize: '20px' }).setOrigin(0.5).setDepth(6);
      this.tweens.add({ targets: heartGlow, y: objs.vet.y - 42, alpha: 0.4, duration: 900, yoyo: true, repeat: -1 });
      this.add.text(objs.vet.x, objs.vet.y + 28, '수의사', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#4ade80', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6);
      vet.setInteractive({ useHandCursor: true });
      vet.on('pointerdown', () => this.showVetMenu());
    }

    // 상점 (마을 지역)
    if (objs.shop) {
      const shop = this.add.text(objs.shop.x, objs.shop.y, '🏪', { fontSize: '42px' }).setOrigin(0.5).setDepth(5);
      const coinGlow = this.add.text(objs.shop.x, objs.shop.y - 32, '🪙', { fontSize: '20px' }).setOrigin(0.5).setDepth(6);
      this.tweens.add({ targets: coinGlow, y: objs.shop.y - 42, alpha: 0.4, duration: 900, yoyo: true, repeat: -1 });
      this.add.text(objs.shop.x, objs.shop.y + 28, '상점', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#fbbf24', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6);
      shop.setInteractive({ useHandCursor: true });
      shop.on('pointerdown', () => this.scene.start('ShopScene', { saveData: this.saveData }));
    }

    // 천사 (무지개 지역)
    if (objs.angel && !objs.angel.used) {
      const ax = objs.angel.x, ay = objs.angel.y;
      const angel = this.add.text(ax, ay, '👼', { fontSize: '48px' }).setOrigin(0.5).setDepth(5);
      const halo = this.add.text(ax, ay - 36, '✨', { fontSize: '22px' }).setOrigin(0.5).setDepth(6);
      this.tweens.add({ targets: halo, y: ay - 46, alpha: 0.4, duration: 1000, yoyo: true, repeat: -1 });
      this.tweens.add({ targets: angel, scaleX: 1.05, scaleY: 1.05, duration: 1200, yoyo: true, repeat: -1 });
      this.add.text(ax, ay + 32, '무지개 천사', { fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#f0abfc', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(6);
      angel.setInteractive({ useHandCursor: true });
      angel.on('pointerdown', () => this.showAngelDialog());
    }

    objs.wildPets.forEach(wildData => {
      if (wildData.defeated) return;
      const pet = wildData.pet;
      const isLegend = pet.isLegend;
      const isBoss = pet.isBoss;

      // 보스는 실제 펫 이미지, 그 외엔 이모지
      let sprite;
      const bossTexKey = isBoss ? Utils.petTexKey(pet.id, pet.level) : null;
      if (isBoss && bossTexKey && this.textures.exists(bossTexKey)) {
        sprite = this.add.image(wildData.x, wildData.y, bossTexKey).setDepth(5);
        // 보스 크기: 세로 90px 기준
        const src = this.textures.get(bossTexKey).getSourceImage();
        sprite.setScale(90 / src.height);
      } else {
        const icon = isBoss ? '👑' : isLegend ? '✨' : '⚔️';
        sprite = this.add.text(wildData.x, wildData.y, icon, { fontSize: isBoss ? '48px' : isLegend ? '44px' : '34px' }).setOrigin(0.5).setDepth(5);
      }

      if (isBoss) {
        // 보스: 붉은 오라 + 살짝 흔들림 + 라벨 (이미지는 과하지 않게)
        this.tweens.add({ targets: sprite, angle: 5, duration: 600, yoyo: true, repeat: -1 });
        const ring = this.add.circle(wildData.x, wildData.y, 44, 0xef4444, 0.22).setDepth(4);
        this.tweens.add({ targets: ring, alpha: 0.5, scale: 1.4, duration: 700, yoyo: true, repeat: -1 });
        this.add.text(wildData.x, wildData.y - 56, '⚡보스⚡', { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#ef4444', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(6);
      } else if (isLegend) {
        this.tweens.add({ targets: sprite, scale: 1.25, duration: 600, yoyo: true, repeat: -1 });
        const ring = this.add.circle(wildData.x, wildData.y, 30, 0xFFD700, 0.2).setDepth(4);
        this.tweens.add({ targets: ring, alpha: 0.5, scale: 1.4, duration: 800, yoyo: true, repeat: -1 });
        this.add.text(wildData.x, wildData.y - 36, '전설!', {
          fontSize: '12px', fontFamily: 'Malgun Gothic', color: '#FFD700', fontStyle: 'bold',
        }).setOrigin(0.5).setDepth(6);
      } else {
        this.tweens.add({ targets: sprite, x: wildData.x + 30, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }

      sprite.setInteractive({ useHandCursor: true });
      sprite.on('pointerdown', () => {
        if (isLegend) {
          this.showLegendWarning(() => {
            wildData.defeated = true;
            Save.save(this.saveData);
            this.scene.start('BattleScene', { saveData: this.saveData, wildPet: pet, wildDataId: wildData.id });
          });
        } else {
          wildData.defeated = true;
          Save.save(this.saveData);
          this.scene.start('BattleScene', { saveData: this.saveData, wildPet: pet, wildDataId: wildData.id });
        }
      });
    });

    // 포털 2개 항상 배치
    this.spawnPortals();

    // 클리어 보상 텍스트
    const allDone = objs.eggs.every(e => e.collected) && objs.wildPets.every(w => w.defeated);
    if (allDone) {
      const cx = this.MAP_W / 2, cy = 80;
      const badge = this.add.rectangle(cx, cy, 280, 44, 0x7c3aed, 0.9).setOrigin(0.5).setDepth(7);
      badge.setStrokeStyle(2, 0xe879f9);
      this.add.text(cx, cy, '🎉 지역 클리어! 포털로 이동하세요', {
        fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#fff',
      }).setOrigin(0.5).setDepth(8);
    }
  }

  spawnPortals() {
    // 포털 2개 랜덤 위치 (맵 4분면 나눠서 각각 1개씩)
    const portalPositions = [
      { x: Phaser.Math.Between(100, this.MAP_W/2 - 100), y: Phaser.Math.Between(100, this.MAP_H/2 - 100) },
      { x: Phaser.Math.Between(this.MAP_W/2 + 100, this.MAP_W - 100), y: Phaser.Math.Between(this.MAP_H/2 + 100, this.MAP_H - 100) },

    portalPositions.forEach((pos, idx) => {
      // 포털 배경 링

      this.tweens.add({ targets: ring, scale: 1.3, alpha: 0.5, duration: 900, yoyo: true, repeat: -1 });

      const portal = this.add.text(pos.x, pos.y, '🌀', { fontSize: '52px' }).setOrigin(0.5).setDepth(6);
      this.tweens.add({ targets: portal, angle: 360, duration: 2500, repeat: -1, ease: 'Linear' });

      this.add.text(pos.x, pos.y - 46, '포털', {
        fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#c4b5fd', fontStyle: 'bold',
      }).setOrigin(0.5).setDepth(7);

      portal.setInteractive({ useHandCursor: true });
      portal.on('pointerdown', () => this.showZoneSelect());
    });
  }

  showVetMenu() {
    const { width, height } = this.scale;
    const alivePets = this.saveData.bag.filter(p => p.alive);

    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.7).setScrollFactor(0).setDepth(40).setOrigin(0.5);
    const panel = this.add.rectangle(width/2, height/2, 360, 480, 0x0f2a1f).setScrollFactor(0).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2, 0x4ade80);
    const title = this.add.text(width/2, height/2 - 205, '🧑‍⚕️ 수의사', { fontSize: '20px', fontFamily: 'Malgun Gothic', color: '#4ade80', fontStyle: 'bold' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
    const sub = this.add.text(width/2, height/2 - 178, '체력을 모두 채울 펫을 선택하세요', { fontSize: '13px', fontFamily: 'Malgun Gothic', color: '#86efac' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);

    const allObjs = [overlay, panel, title, sub];
    const itemObjs = [];

    if (alivePets.length === 0) {
      const noMsg = this.add.text(width/2, height/2, '치료할 펫이 없어요!', { fontSize: '16px', fontFamily: 'Malgun Gothic', color: '#fb923c' }).setScrollFactor(0).setDepth(42).setOrigin(0.5);
      allObjs.push(noMsg);
    } else {
      const listTop = height/2 - 155;
      const listBottom = height/2 + 175;
      const listHeight = listBottom - listTop;
      const itemH = 42;
      const visibleCount = Math.floor(listHeight / itemH);
      let scrollOffset = 0;
      const totalItems = alivePets.length;
      const maxScroll = Math.max(0, totalItems - visibleCount);

      if(totalItems > visibleCount) {
        const scrollHint = this.add.text(width/2+155, listTop-14, `총 ${totalItems}마리 ▲▼`, {fontSize:'11px',fontFamily:'Malgun Gothic',color:'#4ade80'}).setScrollFactor(0).setDepth(42).setOrigin(0.5);
        allObjs.push(scrollHint);
      }

      const renderList = () => {
        itemObjs.forEach(o=>o.destroy());
        itemObjs.length = 0;
        const visible = alivePets.slice(scrollOffset, scrollOffset + visibleCount);
        visible.forEach((pet, i) => {
          const by = listTop + i * itemH + itemH/2;
          const needsHeal = pet.hp < pet.maxHp;
          const btn = this.add.rectangle(width/2, by, 300, 38, needsHeal ? 0x14532d : 0x1f2937).setScrollFactor(0).setDepth(42).setOrigin(0.5);
          btn.setStrokeStyle(1, needsHeal ? 0x4ade80 : 0x374151);
          const txt = this.add.text(width/2, by, `${pet.name}  Lv.${pet.level}  HP ${pet.hp}/${pet.maxHp}`, {
            fontSize: '14px', fontFamily: 'Malgun Gothic', color: needsHeal ? '#e9d5ff' : '#6b7280',
          }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
          itemObjs.push(btn, txt);
          if (needsHeal) {
            btn.setInteractive({ useHandCursor: true });
            btn.on('pointerdown', () => {
              pet.hp = pet.maxHp;
              this.saveData.mapObjects.vet.used = true;
              Save.save(this.saveData);
              itemObjs.forEach(o => o.destroy());
              allObjs.forEach(o => o.destroy());
              this.showHealEffect(pet.name);
              this.time.delayedCall(1500, () => this.scene.restart({ saveData: this.saveData }));
            });
          }
        });
        if(maxScroll > 0) {
          const upBtn = this.add.text(width/2+158, listTop+16, '▲', {fontSize:'20px',color: scrollOffset>0?'#4ade80':'#4b5563'}).setScrollFactor(0).setDepth(44).setOrigin(0.5).setInteractive({useHandCursor:true});
          const dnBtn = this.add.text(width/2+158, listBottom-16, '▼', {fontSize:'20px',color: scrollOffset<maxScroll?'#4ade80':'#4b5563'}).setScrollFactor(0).setDepth(44).setOrigin(0.5).setInteractive({useHandCursor:true});
          const cntT = this.add.text(width/2+158, (listTop+listBottom)/2, `${scrollOffset+1}-${Math.min(scrollOffset+visibleCount,totalItems)}\n/${totalItems}`, {fontSize:'10px',fontFamily:'Malgun Gothic',color:'#4ade80',align:'center'}).setScrollFactor(0).setDepth(44).setOrigin(0.5);
          upBtn.on('pointerdown', ()=>{ if(scrollOffset>0){scrollOffset--;renderList();} });
          dnBtn.on('pointerdown', ()=>{ if(scrollOffset<maxScroll){scrollOffset++;renderList();} });
          itemObjs.push(upBtn, dnBtn, cntT);
        }
      };
      renderList();
    }

    const closeBtn = this.add.rectangle(width/2, height/2 + 205, 160, 40, 0x374151).setScrollFactor(0).setDepth(42).setOrigin(0.5).setInteractive({ useHandCursor: true });
    const closeText = this.add.text(width/2, height/2 + 205, '✕ 닫기', { fontSize: '15px', fontFamily: 'Malgun Gothic', color: '#9ca3af' }).setScrollFactor(0).setDepth(43).setOrigin(0.5);
    allObjs.push(closeBtn, closeText);
    closeBtn.on('pointerdown', () => { itemObjs.forEach(o=>o.destroy()); allObjs.forEach(o => o.destroy()); });
  }

    const t2 = this.add.text(width/2, height/2 + 20, `${petName}의 체력을 모두 회복했어요!`, { fontSize: '14px', fontFamily: 'Malgun Gothic', color: '#86efac' }).setScrollFactor(0).setDepth(50).setOrigin(0.5);
    for (let i = 0; i < 8; i++) {
      this.time.delayedCall(i * 100, () => {
        const h = this.add.text(Phaser.Math.Between(width*0.3, width*0.7), height/2, '💚', { fontSize: '20px' }).setScrollFactor(0).setDepth(50);
        this.tweens.add({ targets: h, y: h.y - 80, alpha: 0, duration: 900, onComplete: () => h.destroy() });
      });
    }

  showZoneSelect() {
    const { width, height } = this.scale;
    const currentZone = this.saveData.mapProgress.zone;

    // 오버레이
    const overlay = this.add.rectangle(width/2, height/2, width, height, 0x000000, 0.7)
      .setScrollFactor(0).setDepth(40).setOrigin(0.5);

    // 패널
    const panel = this.add.rectangle(width/2, height/2, 380, 500, 0x1a0a3e)
      .setScrollFactor(0).setDepth(41).setOrigin(0.5);
    panel.setStrokeStyle(2, 0x7c3aed);

    const title = this.add.text(width/2, height/2 - 210, '🌀 어느 지역으로 갈까요?', {
      fontSize: '17px', fontFamily: 'Malgun Gothic', color: '#e9d5ff', fontStyle: 'bold',
    }).setScrollFactor(0).setDepth(42).setOrigin(0.5);

    const zoneNames = ['얼음','숲','불','동굴','마을','사막','구름','무지개','오로라'];
    const zoneEmojis = ['🧊','🌿','🔥','🕳️','🏘️','🏜️','☁️','🌈','🌌'];
